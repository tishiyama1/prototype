<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>勇者の墓場 ― GRAVE OF HEROES</title>
<style>
  :root {
    --bg: #07060b;
    --ink: #ece4d6;
    --dim: #93876f;
    --gold: #e8c46a;
    --blood: #b4413a;
    --moss: #6f8f5a;
    --line: rgba(232, 196, 106, 0.22);
    --panel: rgba(16, 13, 20, 0.94);
    --panel-solid: #100d14;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 600px at 50% -12%, rgba(120, 96, 180, 0.13), transparent 62%),
      radial-gradient(700px 520px at 50% 112%, rgba(180, 65, 58, 0.08), transparent 60%),
      linear-gradient(180deg, #0a0810 0%, #07060b 55%, #050409 100%);
  }

  #app { position: fixed; left: 0; right: 0; top: 0; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 1; }
  #ui { z-index: 20; }
  #stage { position: relative; }
  #cv {
    display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #05040a;
    box-shadow: 0 24px 70px rgba(0,0,0,0.75);   /* ふちの線は引かない ― ボタンや小地図の線と喧嘩する */
  }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #scan {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply; opacity: 0.5;
  }
  #vig {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 100% at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- HUD ---------- */
  /* 情報の柱 ― 利き手の反対側。下端はスティックと同じ高さにそろえる（--infobot） */
  #info {
    position: absolute; left: var(--infoside, 7px); bottom: var(--infobot, 6px); width: 52%;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    pointer-events: none; z-index: 2;
  }
  #stage.lefty #info { left: auto; right: var(--infoside, 7px); align-items: flex-end; }
  #side {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    pointer-events: none;
  }
  #stage.dg #side { pointer-events: auto; cursor: pointer; }
  #stage.dg #side:active #hud2 { opacity: 0.6; }
  #stage.lefty #side { align-items: flex-end; }
  #mini {
    display: none; width: 96px; height: 68px; image-rendering: pixelated;
    background: rgba(6,5,12,0.72); box-shadow: 0 0 0 1px rgba(232,196,106,0.24);
    pointer-events: none;
  }
  #stage.dun #mini { display: block; }
  #stage.mo #mini { opacity: 0.5; }              /* 全体図を開いている間 ― もう一度押せばとじる */
  #stage.dg #mini { pointer-events: auto; cursor: pointer; }
  #stage.dg #mini:active { box-shadow: 0 0 0 1px rgba(232,196,106,0.7); }
  #hud2 {
    display: flex; flex-direction: column; gap: 2px;
    font-size: 10.5px; letter-spacing: 0.02em; line-height: 1.5;
    text-shadow: 0 1px 2px #000, 0 0 6px #000;
  }
  #hud2 .row2 { display: flex; align-items: center; gap: 5px; }
  #stage.lefty #hud2 { align-items: flex-end; }
  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 5px 7px;
    font-size: 10.5px; letter-spacing: 0.02em; line-height: 1.5;
    background: linear-gradient(180deg, rgba(6,5,10,0.92) 0%, rgba(6,5,10,0.8) 62%, rgba(6,5,10,0) 100%);
    pointer-events: none; text-shadow: 0 1px 2px #000, 0 0 6px #000;
  }
  #hud2 .hearts { letter-spacing: 0px; color: var(--blood); font-size: 12px; }
  #hud .brk { flex-basis: 100%; height: 0; }
  #hud .sep { flex: 1; }
  #hud .chip { color: var(--gold); }
  #hud .chip b { color: var(--ink); font-weight: 600; }
  #hud .chip.warn b, #hud .chip.warn { color: #ff9a92; }
  #hud .chip.mode { color: #12100a; background: var(--gold); padding: 0 5px; border-radius: 2px; font-weight: 700; }
  #hud .clk { color: var(--ink); font-variant-numeric: tabular-nums; }
  #hud .clk.low { color: var(--gold); } #hud .clk.out { color: var(--blood); }
  #hud .stam, #hud2 .stam { display: inline-block; width: 52px; height: 6px; vertical-align: middle;
    background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.20); }
  #hud .stam i { display: block; height: 100%; background: #6f8f5a; transition: width .2s linear; }
  #hud .stam.low i { background: var(--gold); }
  #hud .stam.out i { background: var(--blood); }
  #toasts {
    position: absolute; left: 6px; right: 6px; top: 24px; display: flex; flex-direction: column;
    align-items: flex-end; gap: 3px; pointer-events: none;
  }
  #stage.lefty #toasts { align-items: flex-start; }
  #toasts div {
    font-size: 11.5px; padding: 3px 8px; max-width: 100%; border-radius: 2px;
    background: rgba(8,6,12,0.82); border-left: 2px solid var(--gold);
    animation: toastIn 0.22s ease both; text-shadow: 0 1px 2px #000;
  }
  #toasts div.bad { border-left-color: var(--blood); color: #ffb9b1; }
  #toasts div.good { border-left-color: var(--moss); color: #cfe6b6; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }

  /* ---------- touch controls ---------- */
  /* 位置は vh ではなく下端からの px で決める。vh は iOS だとツールバー
     ぶんずれるので、盤面と重なってしまう。高さは JS が実測して空ける。 */
  #pad {
    position: fixed; left: 0; right: 0; top: 0; height: 100%; z-index: 3;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
  }
  body.portrait #app { align-items: flex-start; padding-top: max(4px, env(safe-area-inset-top)); }
  #pad.on { opacity: 1; }
  #pad:not(.on) * { pointer-events: none; }
  .stick {
    position: absolute; right: 28px;
    bottom: calc(30px + env(safe-area-inset-bottom)); width: 100px; height: 100px;
    border-radius: 50%; background: rgba(20,16,26,0.4); border: 1px solid rgba(232,196,106,0.18);
    pointer-events: auto;
  }
  .stick .knob {
    position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border-radius: 50%; background: rgba(232,196,106,0.28); border: 1px solid rgba(232,196,106,0.45);
  }
  .abtn {
    position: absolute; pointer-events: auto; width: 66px; height: 66px; border-radius: 50%;
    background: rgba(20,16,26,0.5); border: 1px solid rgba(232,196,106,0.3);
    color: var(--ink); font-size: 11px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; line-height: 1.25;
  }
  .abtn:active { background: rgba(232,196,106,0.3); }
  .abtn small { display: block; font-size: 9.5px; font-weight: 400; letter-spacing: 0; color: var(--dim); margin-top: 1px; }
  .abtn.off { color: #6a6276; border-color: rgba(232,196,106,0.12); }
  .abtn.off small { color: #4d4657; }
  .abtn.on { border-color: rgba(232,196,106,0.65); background: rgba(232,196,106,0.18); }
  .abtn.hot {                                    /* 拾えるものが目の前にある */
    border-color: rgba(232,196,106,0.9); background: rgba(232,196,106,0.24); color: #fff3d4;
    box-shadow: 0 0 16px rgba(232,196,106,0.35);
  }
  .abtn.hot small { color: #e8c46a; }
  /* スティックを扇の要に、使う順で 真上→斜め上→横 と囲む。回収はボタンではなく足を止めるだけ */
  #bB { right:  49px; bottom: calc(138px + env(safe-area-inset-bottom)); width: 58px; height: 58px; font-size: 12px; }
  #bE { right: 116px; bottom: calc(118px + env(safe-area-inset-bottom)); width: 52px; height: 52px; font-size: 11px; }
  #bF { right: 140px; bottom: calc( 57px + env(safe-area-inset-bottom)); width: 46px; height: 46px; font-size: 10.5px; }
  #pad.lefty .stick { right: auto; left:  28px; }
  #pad.lefty #bB { right: auto; left:  49px; }
  #pad.lefty #bE { right: auto; left: 116px; }
  #pad.lefty #bF { right: auto; left: 140px; }
  .stick.hot {                                   /* 足元に拾えるものがある */
    border-color: rgba(232,196,106,0.85); background: rgba(232,196,106,0.10);
    box-shadow: 0 0 18px rgba(232,196,106,0.28);
  }
  .stick.hot .knob { background: rgba(232,196,106,0.45); }

  /* ---------- overlay UI ---------- */
  #ui {
    position: absolute; inset: 0; display: none;   /* #app いっぱい ― 画面の高さを全部使う */
    align-items: center; justify-content: center;
    background: rgba(4,3,8,0.66);
    padding: 8px;                                  /* 上の切り欠きは #app、下は .pfoot が見ている */
    overflow: hidden;
  }
  #ui.on { display: flex; }
  /* タイトルは絵の上に重ねたいので、盤面の高さぶんだけに収める */
  #ui.clear { background: linear-gradient(180deg, rgba(4,3,8,0.15) 0%, rgba(4,3,8,0.1) 40%, rgba(4,3,8,0.72) 100%);
    align-items: flex-end; height: var(--stageh, 100%); padding-bottom: 14px; }
  #ui.clear .panel { background: transparent; border: none; box-shadow: none; }
  .panel.raw { display: block; overflow-y: auto; padding: 16px 16px 14px; }

  /* パネルは［見出し・本文・操作］の三段。スクロールするのは本文だけ */
  .panel {
    display: flex; flex-direction: column;
    width: min(560px, 100%); max-height: 100%; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 18px 60px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.03);
    animation: pop 0.22s ease both;
  }
  .phead { flex: none; position: relative; padding: 13px 15px 0; }
  .phead.bare { padding: 0; min-height: 42px; }
  .pbody {
    flex: 1 1 auto; min-height: 0; padding: 10px 15px 12px;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    background:
      linear-gradient(var(--panel-solid) 40%, rgba(16,13,20,0)) top / 100% 16px no-repeat local,
      linear-gradient(rgba(16,13,20,0), var(--panel-solid) 65%) bottom / 100% 16px no-repeat local,
      radial-gradient(farthest-side at 50% 0, rgba(0,0,0,0.45), rgba(0,0,0,0)) top / 100% 9px no-repeat scroll,
      radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,0.45), rgba(0,0,0,0)) bottom / 100% 9px no-repeat scroll;
  }
  .pfoot {
    flex: none; display: flex; flex-direction: column; gap: 7px;
    padding: 10px 15px calc(11px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(0,0,0,0.10), rgba(0,0,0,0.30));
  }
  .pclose {
    position: absolute; top: 6px; right: 7px; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; line-height: 1; color: var(--dim); cursor: pointer;
    border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.04);
    border-radius: 50%; z-index: 2;
  }
  .pclose:hover, .pclose:active { color: var(--gold); border-color: var(--line); background: rgba(232,196,106,0.12); }
  .phead.hasx h2, .phead.hasx > div:first-child { padding-right: 38px; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: none; } }
  .panel h2 {
    font-size: 15px; letter-spacing: 0.2em; color: var(--gold); font-weight: 700;
    display: flex; align-items: center; gap: 8px; margin-bottom: 3px;
  }
  .panel h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .panel .sub { font-size: 11px; color: var(--dim); line-height: 1.8; margin-bottom: 10px; }
  .phead .tabs { margin-bottom: 0; padding-bottom: 10px; }
  .pbody > *:first-child { margin-top: 0; }
  .panel p { font-size: 12.5px; line-height: 1.95; color: var(--ink); }
  .panel p.q { color: var(--dim); font-size: 11.5px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab {
    font-size: 11px; padding: 7px 12px; min-height: 30px; display: flex; align-items: center;
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--dim); background: rgba(255,255,255,0.02); cursor: pointer;
  }
  .tab.on { color: #12100a; background: var(--gold); border-color: var(--gold); font-weight: 700; }

  .list { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 12px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.022); font-size: 12px;
  }
  .row .ico {
    width: 24px; height: 24px; flex: none; image-rendering: pixelated;
    background-repeat: no-repeat; background-position: center; background-size: 24px 24px;
  }
  .row .nm { flex: 1; line-height: 1.5; }
  .row .nm small { display: block; color: var(--dim); font-size: 10.5px; letter-spacing: 0.04em; }
  .qb {
    display: inline-block; margin-left: 5px; padding: 0 5px; font-size: 9.5px; line-height: 15px;
    border-radius: 2px; vertical-align: 1px; border: 1px solid currentColor; opacity: 0.9;
  }
  .qb.q0 { color: #7c7488; } .qb.q1 { color: #9aa2b8; } .qb.q2 { color: #8fd0ff; }
  .qb.q3 { color: #e8c46a; } .qb.q4 { color: #e29ce0; }
  .qb.qe { color: #ff9a7a; } .qb.qu { color: #8f7fb8; border-style: dashed; }
  .cf { display: inline-block; width: 14px; text-align: center; font-size: 11px; }
  .cf.c1 { color: #8fe3a0; } .cf.c2 { color: #8fd0ff; }
  .cf.c3 { color: #e8c46a; } .cf.c4 { color: #ff9a92; }
  .row .pr { color: var(--gold); font-size: 12px; white-space: nowrap; }
  .row.rar1 { border-color: rgba(140,200,255,0.3); }
  .row.rar2 { border-color: rgba(232,196,106,0.45); background: rgba(232,196,106,0.05); }
  .row.rar3 { border-color: rgba(226,120,220,0.5); background: rgba(226,120,220,0.06); }
  .row.locked { opacity: 0.42; }
  .row[data-a] { cursor: pointer; }
  .row[data-a]::after { content: "›"; flex: none; color: var(--dim); font-size: 16px; line-height: 1; margin-left: 2px; }
  .row[data-a]:hover { background: rgba(232,196,106,0.07); border-color: rgba(232,196,106,0.32); }
  .row[data-a]:hover::after { color: var(--gold); }
  .row[data-a]:active { background: rgba(232,196,106,0.14); }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 120px; text-align: center; cursor: pointer;
    padding: 11px 12px; min-height: 42px; display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--ink); border: 1px solid rgba(232,196,106,0.35); background: rgba(232,196,106,0.07);
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: rgba(232,196,106,0.16); }
  .btn:active { transform: translateY(1px); }
  .btn.pri { background: var(--gold); color: #17130a; border-color: var(--gold); }
  .btn.pri:hover { background: #f4d789; }
  .pfoot .btn { letter-spacing: 0.03em; white-space: nowrap; min-width: 96px; }
  .btns.trio .btn { min-width: 0; padding-left: 4px; padding-right: 4px; letter-spacing: 0.02em; }
  .row.thin { padding: 5px 10px; font-size: 11.5px; }
  .row.thin .nm { flex: 1; }
  .row.thin .val { color: var(--ink); white-space: nowrap; }
  .btns.slim .btn { min-height: 34px; padding: 7px 12px; font-size: 11.5px; font-weight: 600; }
  .btn.sm { flex: none; min-width: 0; padding: 6px 12px; min-height: 30px; font-size: 11px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; }
  .btn.dis { opacity: 0.35; pointer-events: none; }
  .btn.warn { border-color: rgba(180,65,58,0.5); background: rgba(180,65,58,0.12); color: #ffc4bd; }
  .art {
    display: block; margin: 2px auto 10px; width: 96px; height: 96px;
    image-rendering: pixelated;
    background: radial-gradient(60% 60% at 50% 55%, rgba(232,196,106,0.10), rgba(0,0,0,0) 70%);
    background-repeat: no-repeat; background-position: center; background-size: 96px 96px, cover;
  }
  .art.tall { width: 112px; height: 112px; background-size: 112px 112px, cover; }
  .art.big { width: 128px; height: 128px; background-size: 128px 128px, cover; }
  .row[data-a] .nm { cursor: pointer; }
  .btns.wrap { flex-wrap: wrap; }
  .btns.wrap .btn { flex: 0 0 auto; min-width: 34px; }
  .tin {
    width: 100%; padding: 9px 10px; font: inherit; font-size: 13px; letter-spacing: 0.04em;
    color: var(--ink); background: rgba(255,255,255,0.05);
    border: 1px solid rgba(232,196,106,0.35); border-radius: 2px; outline: none;
  }
  .tin:focus { border-color: var(--gold); background: rgba(232,196,106,0.08); }

  .stat { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--dim); margin-bottom: 10px; }
  .stat b { color: var(--gold); font-weight: 700; }
  .note { font-size: 10.5px; color: var(--dim); line-height: 1.9; margin-top: 10px; }
  .lbl { font-size: 11px; letter-spacing: 0.12em; color: var(--gold); margin: 16px 0 7px; }
  .pbody > .lbl:first-child { margin-top: 0; }
  .hr { height: 1px; background: var(--line); margin: 12px 0; }
  .center { text-align: center; }
  .big { font-size: 26px; color: var(--gold); font-weight: 800; letter-spacing: 0.06em; }
  .kbd {
    display: inline-block; padding: 1px 6px; margin: 0 2px; font-size: 10.5px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: var(--ink);
  }
  .qbar { height: 4px; background: rgba(255,255,255,0.08); margin-top: 4px; }

  /* 横持ちになったら遊べないので、そう言う */
  #rot {
    display: none; position: fixed; inset: 0; z-index: 60; padding: 24px;
    align-items: center; justify-content: center; text-align: center;
    background: #07060b; color: var(--ink);
  }
  body.rotate #rot { display: flex; }
  #rot b { display: block; font-size: 15px; letter-spacing: 0.14em; color: var(--gold); }
  #rot small { display: block; margin-top: 8px; font-size: 11px; color: var(--dim); letter-spacing: 0.06em; }
  .qbar i { display: block; height: 100%; background: var(--gold); }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="fx"></canvas>
    <div id="scan"></div>
    <div id="vig"></div>
    <div id="hud"></div>
    <div id="info">
      <div id="side"><div id="hud2"></div></div>
      <canvas id="mini" width="48" height="34"></canvas>
    </div>
    <div id="toasts"></div>
  </div>
  <div id="pad">
    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
    <div class="abtn" id="bB">灯り</div>
    <div class="abtn" id="bE">煙玉</div>
    <div class="abtn" id="bF">回復</div>
  </div>
  <div id="ui"></div>
</div>
<div id="rot"><div><b>画面を縦にしてください</b><small>『勇者の墓場』は縦持ち専用です</small></div></div>
<script>
"use strict";
/* ============================================================
   勇者の墓場 ― GRAVE OF HEROES
   死んだ勇者の装備を回収して生きる、拾い屋のドット絵ゲーム。
   外部ライブラリなし / 1ファイル完結
   ============================================================ */
(() => {

/* ---------- 基本 ---------- */
const VW = 208, VH = 288, TILE = 16;   // iPhone を想定した縦画面 13×18 マス
const cv = document.getElementById("cv");
const g = cv.getContext("2d");
cv.width = VW; cv.height = VH;
g.imageSmoothingEnabled = false;

const $ = id => document.getElementById(id);
const fx = document.getElementById("fx"), fg = fx.getContext("2d");
let SCALE = 3, DPR = 1, viewOX = 0, viewOY = 0;
const UI = $("ui"), HUD = $("hud"), HUD2 = $("hud2"), TOAST = $("toasts"), PAD = $("pad");
const MINI = $("mini"), mg = MINI.getContext("2d");

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- 音 ----------
   石と土の下の音。裸の矩形波はどこにも出さない。どの声もかならず
   濾波と包絡を通し、石の廊下の返りに送る。

       master ── lim ── destination
         ├ 効果音 ┬ そのまま
         │        └ 送り ── 残響 ── 返り
         └ 音楽   ┴ 同じ送り                                   */
let AC = null, muted = false, noMus = false;
/* 検証の〈音〉にいるあいだは、場面の曲も自動で鳴る音も止め、押したものだけを鳴らす */
let dbgSnd = false, sfxLet = false;
const sfxOn = () => dbgSnd ? sfxLet : !muted;
const musOn = () => dbgSnd || !noMus;
let LIM = null, REV = null, SBUS = null, MBUS = null;

function actx() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") AC.resume();
  if (AC && !LIM) buildMix(AC);
  return AC;
}
/* 石の廊下の返り ― 高いところは返ってこない */
function stoneIR(a, dur, dark) {
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(2, n, a.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    let lp = 0;
    for (let i = 0; i < n; i++) {
      lp += ((Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.4) - lp) * dark;
      d[i] = lp * (i < 90 ? i / 90 : 1);
    }
  }
  return b;
}
function mkBus(a, dry, wet) {
  const g = a.createGain();
  const d = a.createGain(); d.gain.value = dry; g.connect(d); d.connect(LIM);
  const s = a.createGain(); s.gain.value = wet; g.connect(s); s.connect(REV);
  return g;
}
function buildMix(a) {
  LIM = a.createDynamicsCompressor();
  LIM.threshold.value = -6; LIM.knee.value = 8; LIM.ratio.value = 8;
  LIM.attack.value = 0.003; LIM.release.value = 0.16;
  LIM.connect(a.destination);
  REV = a.createConvolver(); REV.buffer = stoneIR(a, 2.1, 0.26);
  const ret = a.createGain(); ret.gain.value = 0.9;
  REV.connect(ret); ret.connect(LIM);
  SBUS = mkBus(a, 2.15, 1.0);
  MBUS = mkBus(a, 0.56, 0.34);
  MBUS.gain.value = 0.0001;
  if (!musTimer) musTimer = setInterval(musTick, 90);
}

/* 一声 ― 濾波した振動子。裸では鳴らさない */
function vox(p) {
  const a = actx(); if (!a) return;
  const to = p.to || SBUS; if (!to || (to === SBUS && !sfxOn())) return;
  const t = a.currentTime + (p.at || 0), dur = p.dur;
  const o = a.createOscillator();
  o.type = p.w || "triangle";
  o.frequency.setValueAtTime(p.f, t);
  if (p.f2 && p.f2 !== p.f) o.frequency.exponentialRampToValueAtTime(Math.max(18, p.f2), t + (p.bend || dur));
  if (p.det) o.detune.value = p.det;
  const f = a.createBiquadFilter();
  f.type = "lowpass"; f.Q.value = p.q === undefined ? 0.6 : p.q;
  f.frequency.setValueAtTime(p.cut || 2400, t);
  if (p.cut2) f.frequency.exponentialRampToValueAtTime(Math.max(80, p.cut2), t + dur);
  const g = a.createGain();
  const v = p.vol === undefined ? 0.07 : p.vol, atk = p.atk === undefined ? 0.01 : p.atk;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + atk);
  if (p.hold) g.gain.setValueAtTime(v, t + atk + p.hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(atk + 0.04, dur));
  o.connect(f); f.connect(g); g.connect(to);
  o.start(t); o.stop(t + dur + 0.08);
}
/* 息と擦れ ― 帯を絞った雑音 */
function air(p) {
  const a = actx(); if (!a) return;
  const to = p.to || SBUS; if (!to || (to === SBUS && !sfxOn())) return;
  const t = a.currentTime + (p.at || 0);
  const n = Math.max(1, Math.floor(a.sampleRate * p.dur));
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  const sm = p.soft === undefined ? 0.45 : p.soft, sh = p.shape === undefined ? 2.4 : p.shape;
  const rise = Math.max(1, Math.min(n * 0.25, a.sampleRate * (p.atk === undefined ? 0.005 : p.atk)));
  let lp = 0;
  for (let i = 0; i < n; i++) {
    lp += ((Math.random() * 2 - 1) - lp) * sm;
    const e = Math.pow(1 - i / n, sh) * Math.min(1, i / rise);
    d[i] = lp * (p.swell ? Math.min(1, i / (n * 0.3)) * e : e);
  }
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = p.ft || "bandpass"; f.Q.value = p.q === undefined ? 1.0 : p.q;
  f.frequency.setValueAtTime(p.f || 800, t);
  if (p.f2 && p.f2 !== p.f) f.frequency.exponentialRampToValueAtTime(Math.max(60, p.f2), t + p.dur);
  const g = a.createGain(); g.gain.value = p.vol === undefined ? 0.05 : p.vol;
  src.connect(f); f.connect(g); g.connect(to);
  src.start(t);
}

  }

function makeSprite(art, pal) {
  const w = art.reduce((m, r) => Math.max(m, r.length), 0), h = art.length;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  for (let j = 0; j < h; j++) {
    const row = art[j];
    for (let i = 0; i < row.length; i++) {
      const col = pal[row[i]];
      if (!col) continue;
      x.fillStyle = col; x.fillRect(i, j, 1, 1);
    }
  }
  return c;
}

const itemBigURL = {};                           // 32×32 の品物絵（呼ばれてから焼く）
function itemBig(k) {
  if (itemBigURL[k] === undefined)
    itemBigURL[k] = BIG_ART[k] ? makeSprite(BIG_ART[k], BIG_PAL).toDataURL() : "";
  return itemBigURL[k];
}
const bigURL = {};                               // 詳細画面で大きく出すぶん（呼ばれてから焼く）
function bigOf(key) {
  if (bigURL[key] !== undefined) return bigURL[key];
  let sp = null;
  if (key.indexOf("m:") === 0) { const t = MTYPE[key.slice(2)]; sp = t ? SPR[t.spr] : null; }
  else sp = SPR[key];
  sp = sp && sp.length !== undefined && sp[0] ? sp[0] : sp;
  bigURL[key] = sp && sp.toDataURL ? sp.toDataURL() : "";
  return bigURL[key];
}

function drawSpr(s, x, y, flip) {
  if (!s) return;
  x = Math.round(x); y = Math.round(y);
  if (flip) { g.save(); g.translate(x + s.width, y); g.scale(-1, 1); g.drawImage(s, 0, 0); g.restore(); }
  else g.drawImage(s, x, y);
}

/* まず真相を決め、それに合う所見を選ぶ。プレイヤーに見えるのは所見だけ */
function rollTruth(depth) {
  const hum = 4 + Math.floor(depth * 0.45) + Math.floor((G ? G.susp : 0) / 25);
  const acc = 9, mon = 26 + Math.floor(depth * 0.4);
  const r = rnd(0, hum + acc + mon);
  return r < hum ? "hum" : r < hum + acc ? "acc" : "mon";
}
function rollCause(depth, truth) {
  if (truth === "hum") return pick(["blade", "blade", "blade", "blade", "blunt", "bleed", "choke"]);
  if (truth === "acc") return pick(["fall", "fall", "crush", "choke", "drown", "weak", "weak", "burn", "poison", "unknown"]);
  const at = atkAtDepth(depth);                    // 魔物なら、その階にいる魔物の手口
  const bag = [];
  for (const c of CAUSES) if (c.atk && at[c.atk]) for (let i = 0; i < 5; i++) bag.push(c.id);
  bag.push("bleed", "unknown");
  return pick(bag);
}
/* 現場の状況 ― 真相によって出方が変わる */
function rollSitu(truth, depth) {
  const s2 = {};
  if (truth === "hum") {
    s2.fight = chance(0.08); s2.carcass = chance(0.05);

    s2.intact = chance(0.7); s2.back = chance(0.62); s2.clean = chance(0.35); s2.alone = chance(0.5);
  } else if (truth === "mon") {
    s2.fight = chance(0.72); s2.carcass = chance(0.42);
    s2.sheathed = chance(0.08); s2.geared = chance(0.6);
    s2.worn = chance(0.62); s2.back = chance(0.2);
  } else {
    s2.fight = chance(0.15); s2.sheathed = chance(0.5); s2.geared = chance(0.7);
    s2.worn = chance(0.3); s2.alone = chance(0.45); s2.clean = chance(0.2);
  }
  return s2;
}

    slot[i] = cnt[k] = (cnt[k] === undefined ? 0 : cnt[k] + 1);

  const h = HEROES[i], j = heroSlot[i] || 0, off = Math.max(0, CLASSES.indexOf(h.c));
  return Object.assign({}, HERO_FIX,
    HERO_CLOTH[(j + off) % HERO_CLOTH.length],
    HERO_ACC[(j + off * 2) % HERO_ACC.length],
    HERO_HAIRC[(j + off * 3) % HERO_HAIRC.length],
    HERO_SKIN[(j + off) % HERO_SKIN.length]);
}
function layerArt(base, over) {                   // "." は下を透かす
  return base.map((row, y) => {
    const o = over[y] || "";
    let r = "";
    for (let x = 0; x < row.length; x++) r += (o[x] && o[x] !== "." ? o[x] : row[x]);
    return r;
  });
}
function heroArt(i) {
  const h = HEROES[i], g = h.g === "f" ? "f" : "m";
  let a = HERO_BODY;

  if (HERO_GEAR[h.c]) a = layerArt(a, HERO_GEAR[h.c]);

  if (HERO_PROP[pk]) a = layerArt(a, HERO_PROP[pk]);

}

];

/* ============================================================
   ダンジョン生成
   ============================================================ */
const MW = 48, MH = 34;
const T_WALL = 0, T_FLOOR = 1, T_EXIT = 2, T_UP = 3, T_DOWN = 4;
const BOSS_FLOOR = 30;
const SAFE_EVERY = 5;                                   // 5階ごとに聖堂フロアを挟む
const hasSanctBelow = d => d % SAFE_EVERY === 0 && d < BOSS_FLOOR;   // 最深部より下はない
const nextSanct = d => Math.min(Math.ceil(d / SAFE_EVERY) * SAFE_EVERY, BOSS_FLOOR);
const D_NONE = 0, D_GRAVE = 1, D_BONES = 2, D_PILLAR = 3, D_SCONCE = 4, D_DOOR = 5;

let map = new Uint8Array(MW * MH);
let deco = new Uint8Array(MW * MH);
let seen = new Uint8Array(MW * MH);
let light = new Float32Array(MW * MH);
let warm = new Float32Array(MW * MH);
let flow = new Int16Array(MW * MH);
let rooms = [], torches = [], corpses = [], mons = [], loose = [], parts = [], floaters = [];
let hero = null, floorCv = null, bossRoom = null, cleanerT = -1, safeRoom = null, altar = null, bossGate = null;
let grandRoom = null, carpetX = -1, houseRoom = null;
const inGrand = (x, y) => !!grandRoom && x >= grandRoom.x - 1 && x < grandRoom.x + grandRoom.w + 1 &&
  y >= grandRoom.y - 1 && y < grandRoom.y + grandRoom.h + 1;
let runSnap = null;

const idx = (x, y) => y * MW + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const isWall = (x, y) => !inb(x, y) || map[idx(x, y)] === T_WALL;
const blocked = (x, y) => isWall(x, y) || deco[idx(x, y)] === D_GRAVE || deco[idx(x, y)] === D_PILLAR;
const blocksSight = (x, y) => isWall(x, y) || deco[idx(x, y)] === D_PILLAR;

/* ---------- 地形は「1ターム」のあいだ固定 ---------- */
/*  借金1回ぶん（=1周）につき種を1つ持ち、階ごとに同じ地形を生成する。
    変わるのは遺留品・魔物・生きた勇者だけ。                        */
let lseed = 1;
const lrand = () => { lseed = (lseed * 1664525 + 1013904223) >>> 0; return lseed / 4294967296; };
const lri = (a, b) => Math.floor(a + lrand() * (b - a + 1));
const lpick = arr => arr[Math.floor(lrand() * arr.length)];
const lchance = p => lrand() < p;
function seedFor(pos) { return ((G.seed || 1) * 2654435761 + pos.d * 40503 + (pos.s ? 7919 : 0)) >>> 0; }

function carveRoom(r) {
  for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) map[idx(x, y)] = T_FLOOR;
}
function carveH(x0, x1, y) { for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) if (inb(x, y)) map[idx(x, y)] = T_FLOOR; }
function carveV(y0, y1, x) { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) if (inb(x, y)) map[idx(x, y)] = T_FLOOR; }

/* 柱と墓は床の上に置くので、置きどころによっては道をふさいでしまう。
   生成のあと上り階段から歩ける範囲を数えて、塞いでいる飾りだけ取り除く */
function openBlockedPaths(sx, sy) {
  const start = idx(sx, sy);
  const flood = deep => {
    const hit = new Uint8Array(MW * MH), st = [start];
    hit[start] = 1;
    while (st.length) {
      const i = st.pop(), x = i % MW, y = (i - x) / MW;
      for (let k = 0; k < 4; k++) {
        const nx = x + (k === 0 ? 1 : k === 1 ? -1 : 0), ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (!inb(nx, ny)) continue;
        const j = idx(nx, ny);
        if (hit[j] || map[j] === T_WALL) continue;
        if (!deep && (deco[j] === D_GRAVE || deco[j] === D_PILLAR)) continue;
        hit[j] = 1; st.push(j);
      }
    }
    return hit;
  };
  const all = flood(true);                       // 飾りが無ければ歩けるはずの床
  for (let pass = 0; pass < 24; pass++) {
    const walk = flood(false);                   // いま実際に歩ける床
    let short = false;
    for (let i = 0; i < all.length; i++) if (all[i] && !walk[i]) { short = true; break; }
    if (!short) return;
    let opened = 0;
    for (let i = 0; i < all.length; i++) {       // 歩ける側に面した飾りを外す
      if (!all[i] || walk[i]) continue;
      if (deco[i] !== D_GRAVE && deco[i] !== D_PILLAR) continue;
      const x = i % MW, y = (i - x) / MW;
      if ((inb(x + 1, y) && walk[idx(x + 1, y)]) || (inb(x - 1, y) && walk[idx(x - 1, y)]) ||
          (inb(x, y + 1) && walk[idx(x, y + 1)]) || (inb(x, y - 1) && walk[idx(x, y - 1)])) { deco[i] = D_NONE; opened++; }
    }
    if (!opened) return;
  }
}

function genLayout(pos) {
  lseed = seedFor(pos);
  map.fill(T_WALL); deco.fill(D_NONE); seen.fill(0);
  rooms = []; torches = []; safeRoom = null; altar = null; bossGate = null; grandRoom = null; carpetX = -1; houseRoom = null;
  let tries = 0;
  while (rooms.length < 11 && tries < 260) {
    tries++;
    const w = lri(5, 9), h = lri(4, 7);
    const x = lri(2, MW - w - 3), y = lri(2, MH - h - 3);
    const r = { x, y, w, h, cx: Math.floor(x + w / 2), cy: Math.floor(y + h / 2) };
    let hit = false;
    for (const o of rooms) if (r.x < o.x + o.w + 2 && r.x + r.w + 2 > o.x && r.y < o.y + o.h + 2 && r.y + r.h + 2 > o.y) { hit = true; break; }
    if (hit) continue;
    carveRoom(r); rooms.push(r);
  }
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i - 1], b = rooms[i];
    if (lchance(0.5)) { carveH(a.cx, b.cx, a.cy); carveV(a.cy, b.cy, b.cx); }
    else { carveV(a.cy, b.cy, a.cx); carveH(a.cx, b.cx, b.cy); }
  }
  for (let k = 0; k < 3; k++) {
    const a = lpick(rooms), b = lpick(rooms);
    if (a === b) continue;
    carveH(a.cx, b.cx, a.cy); carveV(a.cy, b.cy, b.cx);
  }
  // 階段は地形の一部。位置は毎日同じ
  const upR = rooms[0];
  map[idx(upR.cx, upR.cy)] = T_UP; deco[idx(upR.cx, upR.cy)] = D_NONE;
  const dnR = farthestRoom(upR);
  map[idx(dnR.cx, dnR.cy)] = T_DOWN; deco[idx(dnR.cx, dnR.cy)] = D_NONE;
  for (const r of rooms) {
    const n = lri(1, 3);
    for (let k = 0; k < n; k++) {
      const x = lri(r.x, r.x + r.w - 1), y = lri(r.y, r.y + r.h - 1);
      if (map[idx(x, y)] !== T_FLOOR) continue;
      const t = lrand();
      if (t < 0.42) deco[idx(x, y)] = D_GRAVE;
      else if (t < 0.75) deco[idx(x, y)] = D_BONES;
      else deco[idx(x, y)] = D_PILLAR;
    }
    for (let k = 0, guard = 0; k < lri(1, 2) && guard < 20; guard++) {
      const x = lri(r.x, r.x + r.w - 1), y = r.y - 1;
      if (inb(x, y) && map[idx(x, y)] === T_WALL && deco[idx(x, y)] === D_NONE) {
        deco[idx(x, y)] = D_SCONCE; torches.push({ x, y, ph: lrand() * 9 }); k++;
      }
    }
  }
  openBlockedPaths(upR.cx, upR.cy);
}

/* 最深部 ― 小部屋（前室）から扉をくぐって、聖堂じみた玄室へ。奥に主がいる */
function layoutBoss(depth) {
  lseed = seedFor({ d: depth, s: false });
  map.fill(T_WALL); deco.fill(D_NONE); seen.fill(0);
  rooms = []; torches = []; safeRoom = null; altar = null; houseRoom = null;
  const cx = Math.floor(MW / 2);
  const hw = 21, hh = 17, hx = cx - Math.floor(hw / 2), hy = 2;
  const hall = { x: hx, y: hy, w: hw, h: hh, cx, cy: Math.floor(hy + hh / 2) };
  const aw = 11, ah = 7, ax = cx - Math.floor(aw / 2), ay = hy + hh + 4;
  const ante = { x: ax, y: ay, w: aw, h: ah, cx, cy: Math.floor(ay + ah / 2) };
  carveRoom(hall); carveRoom(ante);
  carveV(hy + hh, ay - 1, cx);                     // 扉の通路
  rooms.push(ante, hall);                          // rooms[0] は入ってくる小部屋
  grandRoom = hall; carpetX = cx;                  // 玄室は聖堂と同じ明るい石で描く
  bossGate = { x: cx, y: hy + hh + 2 };
  deco[idx(cx - 1, bossGate.y)] = D_DOOR;
  deco[idx(cx + 1, bossGate.y)] = D_DOOR;
  for (const t of [[cx - 1, bossGate.y - 2], [cx + 1, bossGate.y - 2]]) {
    deco[idx(t[0], t[1])] = D_SCONCE; torches.push({ x: t[0], y: t[1], ph: lrand() * 9 });
  }
  for (let i = 0; i < 5; i++) {                    // 玄室 ― 柱を二列
    const py = hy + 2 + i * 3;
    deco[idx(hx + 2, py)] = D_PILLAR;
    deco[idx(hx + hw - 3, py)] = D_PILLAR;
  }
  for (const x of [hx + 4, hx + 10, hx + 16]) {    // 玄室の燭台
    deco[idx(x, hy - 1)] = D_SCONCE; torches.push({ x, y: hy - 1, ph: lrand() * 9 });
  }
  for (const x of [ax + 2, ax + aw - 3]) {         // 前室の松明
    deco[idx(x, ay - 1)] = D_SCONCE; torches.push({ x, y: ay - 1, ph: lrand() * 9 });
  }
  map[idx(cx, ay + ah - 2)] = T_UP; deco[idx(cx, ay + ah - 2)] = D_NONE;     // 上へ。下は無い
  for (let y = hy; y < hy + hh; y++) for (let x = hx; x < hx + hw; x++) seen[idx(x, y)] = 1;
}

/* 聖堂 ― 5階ごとの独立したフロア。魔物も遺留品もない */
function layoutSanctuary(depth) {
  lseed = seedFor({ d: depth, s: true });
  map.fill(T_WALL); deco.fill(D_NONE); seen.fill(0);
  rooms = []; torches = []; bossGate = null; grandRoom = null; houseRoom = null;
  const w = 13, h = 19;                                      // 縦に長い身廊
  const x0 = Math.floor((MW - w) / 2), y0 = Math.floor((MH - h) / 2);
  const hall = { x: x0, y: y0, w, h, cx: Math.floor(x0 + w / 2), cy: Math.floor(y0 + h / 2) };
  carveRoom(hall);
  rooms.push(hall); safeRoom = hall;
  altar = { x: hall.cx, y: hall.cy }; carpetX = hall.cx;
  for (let i = 0; i < 5; i++) {                              // 柱を二列
    const py = y0 + 2 + i * 4;
    deco[idx(x0 + 2, py)] = D_PILLAR;
    deco[idx(x0 + w - 3, py)] = D_PILLAR;
  }
  map[idx(hall.cx, hall.cy)] = T_EXIT;                       // 転移碑
  map[idx(hall.cx, y0 + 1)] = T_UP;                          // 上の階へ
  deco[idx(hall.cx, y0 + 1)] = D_NONE;
  if (depth < BOSS_FLOOR) { map[idx(hall.cx, y0 + h - 2)] = T_DOWN; deco[idx(hall.cx, y0 + h - 2)] = D_NONE; }
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) seen[idx(x, y)] = 1;
}

function farthestRoom(from) {
  let best = rooms[0], bd = -1;
  for (const r of rooms) {
    const d = dist2(r.cx, r.cy, from.cx, from.cy);
    if (d > bd) { bd = d; best = r; }
  }
  return best;
}
function freeSpotIn(r, avoid) {
  for (let k = 0; k < 40; k++) {
    const x = ri(r.x, r.x + r.w - 1), y = ri(r.y, r.y + r.h - 1);
    if (blocked(x, y) || map[idx(x, y)] !== T_FLOOR) continue;
    if (avoid && avoid.some(a => Math.abs(a.tx - x) < 2 && Math.abs(a.ty - y) < 2)) continue;
    return { x, y };
  }
  return { x: r.cx, y: r.cy };
}

function makeHeroRecord(depth, opt) {
  opt = opt || {};
  const hi = opt.hi !== undefined ? opt.hi : ri(0, HEROES.length - 1);
  const H = HEROES[hi];
  const tr = opt.tr || rollTruth(depth);
  const cz = opt.cz || rollCause(depth, tr);
  return {
    hi, name: H.n, cls: opt.cls || H.c, lv: clamp(ri(depth * 2 + 1, depth * 3 + 8), 1, 99),
    floor: depth, cz, tr, sc: opt.sc || rollSitu(tr, depth), day: Math.max(1, G.day - ri(0, 4))
  };
}

/* 亡骸・遺留品のかたち */
const REMAIN_W = [
  ["body", 34], ["gear", 16], ["item", 12], ["broken", 10], ["blood", 9], ["memo", 7], ["stripped", 8], ["nothing", 4]
];
function rollRemainType(depth) {
  const bag = [];
  for (const [t, w] of REMAIN_W) {
    let ww = w;
    if (t === "body") ww += Math.floor(depth * 0.8);
    if (t === "nothing") ww = Math.max(2, w - Math.floor(depth * 0.2));
    for (let i = 0; i < ww; i++) bag.push(t);
  }
  return pick(bag);
}
function makeRemain(depth, tx, ty, opt) {
  opt = opt || {};
  const type = opt.type || rollRemainType(depth);
  const r = { tx, ty, x: tx * TILE, y: ty * TILE, type, items: [], hero: null, memo: null, looted: false, prog: 0, fresh: !!opt.fresh, story: null };
  const withHero = type === "body" || type === "memo" || type === "stripped";
  if (withHero) r.hero = makeHeroRecord(depth, opt);
  if (r.hero) r.sc = r.hero.sc;
  const n = type === "body" ? ri(2, 3) : type === "gear" ? ri(1, 2) : type === "item" ? 1 : type === "broken" ? 1 :
    type === "carcass" ? (chance(0.45) ? 1 : 0) : 0;
  for (let i = 0; i < n; i++) {
    const o = { boost: opt.boost || 0, hi: r.hero ? r.hero.hi : -1, cz: r.hero ? r.hero.cz : null, tr: r.hero ? r.hero.tr : null };
    if (type === "broken") { o.wear = rnd(0.86, 0.98); o.q = 0; }
    if (type === "item") o.cat = chance(0.5) ? "use" : "val";
    if (type === "carcass") { o.cat = "val"; o.hi = -1; o.cz = null; o.tr = null; }
    r.items.push(makeItem(depth, o));
  }
  if (type === "memo") r.memo = HEROES[r.hero.hi].l;
  if (opt.story) {
    const it = makeStoryItem(opt.story, depth, r.hero ? r.hero.hi : -1, r.hero ? r.hero.cz : null, r.hero ? r.hero.tr : null);
    r.items.push(it); r.story = opt.story;
  }
  return r;
}

/* 最深部の中身 ― 前室に一体だけ。玄室には主のほか何も無い */
function populateBossFloor(depth) {
  corpses = []; mons = []; loose = []; hero = null;
  const ante = rooms[0], hall = rooms[1];
  bossRoom = hall;
  const ap = freeSpotIn({ x: ante.x + 1, y: ante.y + 1, w: ante.w - 2, h: ante.h - 3, cx: ante.cx, cy: ante.cy }, null);
  corpses.push(makeRemain(depth, ap.x, ap.y, {
    type: "body", tr: "hum", cz: "blade", fresh: true, boost: 0.6,
    sc: { sheathed: true, geared: true, intact: true, back: true, alone: true }
  }));
  spawnMon("king", hall.cx, hall.y + 4);
}

/* その日ぶんの中身（遺留品・魔物・勇者）を置く */
function populateFloor(depth) {
  if (depth >= BOSS_FLOOR) { populateBossFloor(depth); return; }
  corpses = []; mons = []; loose = []; hero = null;
  const upRoom = rooms[0];
  const pool = rooms.length > 1 ? rooms.slice(1) : rooms;

  const nc = clamp(3 + Math.floor(depth / 2) + ri(0, 2), 4, 9);
  let storyKind = null;
  if (!caseDone("c2") && depth >= 8 && depth <= 24 && G.story.badge < 3 && chance(0.16)) storyKind = "badge";
  else if (!caseDone("c3") && depth >= 5 && depth <= 28 && G.story.map < 4 && chance(0.18)) storyKind = "mapfrag";
  else if (!caseDone("c4") && G.story.cleaner >= 1 && G.story.order < 1 && depth >= 10 && chance(0.22)) storyKind = "order";
  const storyAt = storyKind ? ri(0, nc - 1) : -1;

  let metGhost = null;
  if (G.met.length && depth >= 3 && chance(0.3)) {
    const m = G.met[ri(0, G.met.length - 1)];
    if (G.day > m.day) {
      metGhost = { hi: m.hi, tr: G.susp >= 40 && chance(0.55) ? "hum" : null };
      G.met = G.met.filter(x => x !== m);
    }
  }
  for (let i = 0; i < nc; i++) {
    const r = pick(pool);
    const p = freeSpotIn(r, corpses);
    const opt = { story: i === storyAt ? storyKind : null };
    if (metGhost && i === 0) { opt.type = "body"; opt.hi = metGhost.hi; opt.tr = metGhost.tr; opt.fresh = true; opt.boost = 0.4; }
    corpses.push(makeRemain(depth, p.x, p.y, opt));
  }
  bossRoom = null;

  // 魔物と勇者が潰し合った跡。戦闘は終わっていて、残っているのは荷だけ
  if (depth >= 4 && rooms.length > 2 && chance(0.2)) {
    const hr = pick(pool);
    houseRoom = hr;
    const local = Object.keys(MTYPE).filter(k => MTYPE[k].w > 0 && MTYPE[k].dMin <= depth && depth <= MTYPE[k].dMax);
    const nCar = ri(3, 6);
    for (let i = 0; i < nCar; i++) {
      const p = freeSpotIn(hr, corpses);
      const r = makeRemain(depth, p.x, p.y, { type: "carcass" });
      r.mon = pick(local); corpses.push(r);
    }
    for (let i = 0, n2 = ri(2, 3); i < n2; i++) {
      const p = freeSpotIn(hr, corpses);
      corpses.push(makeRemain(depth, p.x, p.y, {
        type: chance(0.75) ? "body" : "broken", tr: "mon", fresh: true, boost: 0.3,
        sc: { fight: true, carcass: true, worn: true, geared: chance(0.6) }
      }));
    }

}

/* ---------- 踏破した地図は日をまたいで残る ---------- */
function packSeen() {
  const n = MW * MH, bytes = new Uint8Array((n + 7) >> 3);
  for (let i = 0; i < n; i++) if (seen[i]) bytes[i >> 3] |= 1 << (i & 7);
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  try { return btoa(s); } catch (e) { return null; }
}
function unpackSeen(b64) {
  try {
    const s = atob(b64), n = MW * MH;
    for (let i = 0; i < n; i++) seen[i] = (s.charCodeAt(i >> 3) >> (i & 7)) & 1;
  } catch (e) {}
}
const levelKey = pos => (pos.s ? "s" : "f") + pos.d;
function loadMem(pos) { const m = G.mem && G.mem[levelKey(pos)]; if (m) unpackSeen(m); }
function storeMem(pos) {
  if (!G.mem) G.mem = {};
  const p = packSeen();
  if (p) G.mem[levelKey(pos)] = p;
}

/* 視線・経路 */
function los(x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy, x = x0, y = y0, guard = 0;
  while (guard++ < 80) {
    if (x === x1 && y === y1) return true;
    const e2 = err * 2;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
    if (x === x1 && y === y1) return true;
    if (blocksSight(x, y)) return false;
  }
  return false;
}
const fq = new Int32Array(MW * MH);
function computeFlow(sx, sy) {
  flow.fill(-1);
  if (!inb(sx, sy)) return;
  let head = 0, tail = 0;
  flow[idx(sx, sy)] = 0; fq[tail++] = idx(sx, sy);
  while (head < tail) {
    const c = fq[head++], cx = c % MW, cy = (c / MW) | 0, d = flow[c];
    for (let k = 0; k < 4; k++) {
      const nx = cx + [1, -1, 0, 0][k], ny = cy + [0, 0, 1, -1][k];
      if (!inb(nx, ny)) continue;
      const n = idx(nx, ny);
      if (flow[n] >= 0 || blocked(nx, ny)) continue;
      flow[n] = d + 1; fq[tail++] = n;
    }
  }
}

/* ============================================================
   ゲーム状態

let scene = "title";          // title | town | dungeon | result
let run = null;
let time = 0, shake = 0, flash = 0, fade = 0, fadeDir = 0, fadeCb = null, fadeLock = false;
let camx = 0, camy = 0;
let uiOpen = false, uiKind = "", mapOpen = false;

function addPart(x, y, o) {

function floatTxt(x, y, txt, col) {

/* 浮き文字は流れて消える。読み返せるように、同じ内容をログにも残す。 */
function logAdd(t, lines, cls) {

/*  幕引き（その日が終わる暗転）は、あとから来た暗転に横取りさせない。
    倒れた瞬間に階段の「降りる」を押しても、行き先が書き換わらないように。 */
function doFade(dir, cb, lock) {
  if (fadeLock && !lock) return;
  if (lock) fadeLock = true;
  fadeDir = dir; fadeCb = cb || null; if (dir > 0) fade = 0;
}

/* ---------- 食料と水 ― もぐっていられる時間そのもの ---------- */
/*  持って入った分だけ潜れる。聖堂の中では減らない。尽きれば動けなくなる。 */
const SUPPLY_RATE = 0.5;                    // 1秒あたり
/* 持ち込みの上限 ― 倉庫にいくら積んでも、袋に入るのはここまで。
   使うたび G.inv と run.carry の両方が減るので、carry ≤ inv は崩れない。 */
const CARRY_MAX = 5;
const carrying = () => scene === "dungeon" && run && !run.escaped && run.carry;
const potHave = () => carrying() ? run.carry.potion : G.inv.potion;
const smkHave = () => carrying() ? run.carry.smoke : G.inv.smoke;
function tickSupply(dt, inSafe) {
  if (inSafe || watchMode()) return;
  P.st = clamp(P.st - SUPPLY_RATE * dt, 0, maxSupply());
}

/* ---------- 装備 ---------- */
function equipDef() {
  let d = 0;
  for (const k of ["shield", "armor", "helm", "acc"]) if (G.equip[k]) d += itemDef(G.equip[k]);
  return d;
}
const armorMax = () => clamp(Math.floor(equipDef() / 8), 0, 6);
function wearItem(it, amt) {
  if (!it) return;
  it.wear = clamp(it.wear + amt, 0, 1);
  if (it.wear >= 1) {
    for (const k in G.equip) if (G.equip[k] === it) G.equip[k] = null;
    toast(itemName(it) + " が壊れた", "bad");
    SFX.deny();
  }
}
function wearArmorOnHit() {
  const parts_ = ["shield", "armor", "helm"].map(k => G.equip[k]).filter(Boolean);
  if (parts_.length) wearItem(pick(parts_), rnd(0.02, 0.045));
}

/* ---------- 潜行 ---------- */
const sanctNo = d => Math.max(1, Math.round(d / SAFE_EVERY));
const levelName = pos => pos.s ? "第" + sanctNo(pos.d) + "聖堂" : "地下 " + pos.d + " 階";
function stairPos(t) {
  for (let i = 0; i < map.length; i++) if (map[i] === t) return { x: i % MW, y: (i / MW) | 0 };
  return null;
}
function cacheLevel() {
  if (!run.pos || run.pos.s) return;
  run.cache[levelKey(run.pos)] = { corpses, mons, loose, hero, cleanerT, bossRoom, houseRoom };
}
function buildLevel(pos) {
  if (pos.s) layoutSanctuary(pos.d);
  else if (pos.d >= BOSS_FLOOR) layoutBoss(pos.d);
  else genLayout(pos);
  loadMem(pos);
  if (pos.s) { corpses = []; mons = []; loose = []; hero = null; cleanerT = -1; bossRoom = null; }
  else {
    const c = run.cache[levelKey(pos)];
    if (c) { corpses = c.corpses; mons = c.mons; loose = c.loose; hero = c.hero; cleanerT = c.cleanerT; bossRoom = c.bossRoom; houseRoom = c.houseRoom || null; }
    else populateFloor(pos.d);
  }
  parts = []; floaters = [];
}
function enterLevel(pos, from) {
  if (run.pos) { storeMem(run.pos); cacheLevel(); }
  run.pos = pos;
  buildLevel(pos);
  floorCv = null; prerenderFloor();
  run.askAt = -1;
  let sp = null;
  if (pos.s && from === "start") sp = stairPos(T_EXIT);
  if (!sp) sp = stairPos(from === "up" ? T_DOWN : T_UP);
  if (!sp) sp = { x: rooms[0].cx, y: rooms[0].cy };
  P.x = sp.x * TILE + 8; P.y = sp.y * TILE + (pos.s ? 22 : 8);
  if (!canStand(P.x, P.y)) P.y = sp.y * TILE + 8;
  P.dir = "s"; P.face = 1; P.looting = null; P.lootT = 0;
  run.askAt = idx(Math.floor(P.x / TILE), Math.floor(P.y / TILE));   // 降り立った階段では聞かない
  camx = clamp(P.x - VW / 2, 0, MW * TILE - VW); camy = clamp(P.y - VH / 2, 0, MH * TILE - VH);
  if (!pos.s && pos.d > G.deepest) { G.deepest = pos.d; save(); }
  setMusic(floorMus());
  if (pos.s) {
    P.armor = armorMax();
    if (pos.d > (G.sanctMax || 0)) { G.sanctMax = pos.d; save(); toast("新しい聖堂を見つけた", "good"); }
    else if (run.floors > 1) toast(levelName(pos) + "。魔物は入ってこない", "good");
  }
}
function startRun(pos) {
  if (safeMode()) G.assist = 1;                  // 一度でも使えば、その周は記録に残さない
  runSnap = JSON.stringify(G);                   // 図鑑もログも G の中なので、これ一本で戻せる
  run = { pos: null, cache: {}, bag: [], t: 0, escaped: false, askAt: -1, floors: 1, looted: 0, killer: null,
          carry: { potion: Math.min(G.inv.potion, CARRY_MAX), smoke: Math.min(G.inv.smoke, CARRY_MAX) } };
  P.hp = maxHearts(); P.invul = 0; P.lamp = true; P.smoke = 0;
  P.st = maxSupply(); P.tired = 0; P.exT = 0; P.armor = armorMax();
  enterLevel(pos, "start");
  scene = "dungeon"; closeUI();
  tipCheck();
  SFX.descend();
}
function goDown() {
  if (!run || run.escaped) return;           // 倒れたあとの階段は、もう動かない
  const p = run.pos;
  const next = p.s ? { d: p.d + 1, s: false }
    : hasSanctBelow(p.d) ? { d: p.d, s: true } : { d: p.d + 1, s: false };
  run.floors++;
  doFade(1, () => { enterLevel(next, "down"); SFX.descend(); toast(levelName(next) + (next.s ? "" : " ― " + themeOf(next.d).nm), "good"); });
}
function goUp() {
  if (!run || run.escaped) return;
  const p = run.pos;
  if (!p.s && p.d <= 1) { endRun("escape"); return; }
  const next = p.s ? { d: p.d, s: false }
    : hasSanctBelow(p.d - 1) ? { d: p.d - 1, s: true } : { d: p.d - 1, s: false };
  run.floors++;
  doFade(1, () => { enterLevel(next, "up"); SFX.descend(); toast(levelName(next) + (next.s ? "" : " ― " + themeOf(next.d).nm), "good"); });
}
const bagFull = () => bagWeight() >= bagCap();
const canCarry = it => bagWeight() + itemWt(it) <= bagCap() + 0.001;
function addToBag(it) {
  if (!canCarry(it)) return false;
  run.bag.push(it); dexItem(it);
  return true;
}
function dropItem(it, x, y, delay) { loose.push({ it, x, y, vx: rnd(-24, 24), vy: rnd(-30, -6), t: 0, pick: delay || 0.5 }); }

/* ---------- 一日の終わり ---------- */
function endRun(kind) {
  if (!run || run.escaped) return;
  run.escaped = true;
  closeUI(); mapOpen = false;                // 階段の問いなどを残したまま終わらせない
  P.invul = 0; P.looting = null; P.lootT = 0;
  const depth = run.pos.d, floors = run.floors, killer = run.killer;

  if (kind === "faint") {
    // 力尽きた日は、まるごと無かったことになる ― 過ぎるのは一日だけ
    const day = G.day;
    if (runSnap) { G = S.g = JSON.parse(runSnap); bindGame(); }
    G.day = day + 1;
    S.rec.deaths = (S.rec.deaths || 0) + 1;
    rollMarket(); save();
    doFade(1, () => { showDream(depth, floors, killer); }, true);
    SFX.faint();
    return;
  }
  storeMem(run.pos);
  const kept = run.bag.slice();
  const haul = kept.reduce((a, b) => a + sellPrice(b), 0);   // 地上に着いた時点の買取見込み
  run.haul = haul;
  G.earned = (G.earned || 0) + haul;
  G.runsDone = (G.runsDone || 0) + 1;
  if (haul > (G.bestRun || 0)) { G.bestRun = haul; G.bestDay = G.day; }   // 何日目がいちばん稼いだか
  if (!G.assist) {
    S.rec.bestDay = Math.max(S.rec.bestDay || 0, haul);
    S.rec.bestTerm = Math.max(S.rec.bestTerm || 0, G.earned);
    S.rec.gold = (S.rec.gold || 0) + haul;
    S.rec.hauls = (S.rec.hauls || 0) + 1;
  }
  for (const it of kept) G.stash.push(it);
  G.day++;
  rollMarket();
  if (G.deepest >= 12) addSusp(1);
  save();
  doFade(1, () => { showResult(kind, kept, [], depth, floors, haul); }, true);
  SFX.escape();
}

/* ---------- 傷つく ---------- */
const CALM_UI = ["items", "pause", "dex", "help", "opt", "log"];
const inSanctNow = () => scene === "dungeon" && run && inSafeZone(Math.floor(P.x / TILE), Math.floor(P.y / TILE));
/* 潜っている最中に画面を開いても墓場は待たない。そのことを常に出しておく */
function timeNote() {
  if (scene !== "dungeon" || !run || run.escaped) return "";
  return inSanctNow()
    ? '<div class="sub" id="tnote" style="color:#8fe3a0;margin-bottom:8px">聖堂の中 ― 水も食料も減らない。魔物も入ってこない。整理はここで。</div>'
    : '<div class="sub" id="tnote" style="color:#ff9a92;margin-bottom:8px">時間は止まっていない ― 残り ' + supplyClock() + '。魔物も動いている</div>';
}
const supplyClock = () => { const sc2 = Math.max(0, Math.ceil(P.st / SUPPLY_RATE)); return Math.floor(sc2 / 60) + ":" + String(sc2 % 60).padStart(2, "0"); };
function hitPlayer(sx, sy, hard, who) {
  if (P.invul > 0 || run.escaped || watchMode() || dbgGod) return;
  if (mapOpen) { mapOpen = false; }
  if (uiOpen && CALM_UI.indexOf(uiKind) >= 0) { closeUI(); toast("襲われた ― 手を止めている場合ではない", "bad"); }
  P.invul = 1.7; shake = 7;
  const a = Math.atan2(P.y - sy, P.x - sx);
  P.x += Math.cos(a) * 12; P.y += Math.sin(a) * 12;
  if (!canStand(P.x, P.y)) { P.x -= Math.cos(a) * 12; P.y -= Math.sin(a) * 12; }
  P.looting = null; P.lootT = 0;
  if (P.armor > 0) {                       // 防具が肩代わりする
    P.armor--; wearArmorOnHit();
    SFX.deny(); flash = 0.25;
    for (let i = 0; i < 8; i++) addPart(P.x, P.y, { vx: rnd(-40, 40), vy: rnd(-50, 10), life: 0.4, max: 0.4, col: "#b9c9de", sz: 2 });
    floatTxt(P.x, P.y - 16, "防いだ", "#b9c9de");
    return;
  }
  P.hp--; flash = 0.5; SFX.hurt();
  if (who) run.killer = who;
  for (let i = 0; i < 10; i++) addPart(P.x, P.y, { vx: rnd(-40, 40), vy: rnd(-50, 10), life: 0.5, max: 0.5, col: "#b4413a", sz: 2 });
  if (run.bag.length && (hard || chance(0.5))) {
    const it = run.bag.splice(ri(0, run.bag.length - 1), 1)[0];
    dropItem(it, P.x, P.y);
    floatTxt(P.x, P.y - 14, itemName(it) + " を落とした", "#ff9a92");
  }
  if (P.hp <= 0) survive();
}
/* 死なないモードのときだけ、倒れる代わりに踏みとどまる */
function survive() {
  if (!safeMode()) { endRun("faint"); return; }
  P.hp = 1; P.invul = 2.8; P.exT = 0; hudSig = "";
  floatTxt(P.x, P.y - 18, "倒れずに済んだ", "#8fe3a0");
}
function canStand(x, y) {
  const r = 5;
  return !blocked(Math.floor((x - r) / TILE), Math.floor((y - r) / TILE)) &&
         !blocked(Math.floor((x + r) / TILE), Math.floor((y - r) / TILE)) &&
         !blocked(Math.floor((x - r) / TILE), Math.floor((y + r) / TILE)) &&
         !blocked(Math.floor((x + r) / TILE), Math.floor((y + r) / TILE));
}

/* ---------- 灯り ---------- */
/*  消すと感知距離が半分になる。追われている最中でも、相手から離れていれば
    それだけ早く見失わせられる（すぐ隣にいる相手には効かない）。          */
function toggleLamp() {
  P.lamp = !P.lamp; SFX.ui(); hudSig = "";
  if (P.lamp || !run || run.escaped) return;
  sawIt("lampoff"); tipCheck();
  let shook = 0;
  for (const m of mons) {
    if (m.dead > 0 || m.state !== "chase") continue;
    const d = Math.hypot(m.x - P.x, m.y - P.y) / TILE;
    if (d > 2.5) { m.lost = Math.max(m.lost || 0, 1.5); shook++; }
  }
  if (shook) floatTxt(P.x, P.y - 18, "気配を消した", "#cfd6e6");
}

/* ---------- 道具 ---------- */
function useSmoke() {
  if (smkHave() <= 0) { SFX.deny(); toast(G.inv.smoke > 0 ? "持ってきた煙玉は使い切った" : "煙玉がない", "bad"); return; }
  G.inv.smoke--; if (carrying()) run.carry.smoke--;
  sawIt("smoke"); save(); SFX.smoke();
  P.smoke = 7;
  for (const m of mons) if (dist2(m.x, m.y, P.x, P.y) < (TILE * 7) ** 2) { m.state = "patrol"; m.alert = 0; }
  for (let i = 0; i < 26; i++) addPart(P.x, P.y, { vx: rnd(-60, 60), vy: rnd(-60, 60), life: rnd(0.6, 1.4), max: 1.4, col: "#9aa2b8", sz: 3 });
  floatTxt(P.x, P.y - 16, "煙にまぎれた", "#cfd6e6");
}
function usePotion() {
  if (potHave() <= 0) { SFX.deny(); toast(G.inv.potion > 0 ? "持ってきたポーションは使い切った" : "ポーションがない", "bad"); return; }
  if (P.hp >= maxHearts()) { SFX.deny(); toast("傷はない", "bad"); return; }
  G.inv.potion--; if (carrying()) run.carry.potion--;
  P.hp++; save(); SFX.get_();
  for (let i = 0; i < 12; i++) addPart(P.x, P.y, { vx: rnd(-25, 25), vy: rnd(-45, -10), life: 0.7, max: 0.7, col: "#ff8a7a", sz: 2 });
  floatTxt(P.x, P.y - 16, "傷がふさがった", "#ff8a7a");
}

function updateHero(dt) {
  if (cleanerT > 0) {
    cleanerT -= dt;
    if (cleanerT <= 0 && !hero) spawnCleaner(run.pos.d);
  }
  if (!hero) return;
  const h = hero;
  h.anim += dt; h.hurt = Math.max(0, h.hurt - dt); h.atk = Math.max(0, h.atk - dt);
  if (h.hp <= 0) { heroDies(); return; }

  let tx = null, ty = null, sp = h.spd;
  if (h.state === "hostile") {
    const step = flowStep(Math.floor(h.x / TILE), Math.floor(h.y / TILE));
    if (step) { tx = step.x * TILE + 8; ty = step.y * TILE + 8; } else { tx = P.x; ty = P.y; }
    sp = h.cleaner ? 46 : 44;
    if (!run.escaped && dist2(h.x, h.y, P.x, P.y) < 160 && P.invul <= 0) {
      hitPlayer(h.x, h.y, true, h.cleaner ? "黒い外套の男" : "勇者 " + h.name);
      if (h.cleaner) floatTxt(h.x, h.y - 18, "「見なかったことにはできんな」", "#ff9a92");
    }
  } else if (h.state === "follow") {
    h.follow -= dt;
    if (h.follow <= 0) h.state = "fight";
    const m = nearestMon(h, 5.5);
    if (m) { tx = m.x; ty = m.y; }
    else if (dist2(h.x, h.y, P.x, P.y) > 900) { tx = P.x; ty = P.y; }
  } else {
    const m = nearestMon(h, 7);
    if (m) { tx = m.x; ty = m.y; sp = h.spd * 1.15; }
    else {
      h.cd -= dt;
      if (h.cd <= 0) { h.cd = rnd(1, 2.6); const cand = rooms.filter(rr => rr !== safeRoom); const r = pick(cand.length ? cand : rooms); h.wx = r.cx * TILE + 8; h.wy = r.cy * TILE + 8; }
      tx = h.wx; ty = h.wy; sp = h.spd * 0.7;
    }
  }
  if (tx !== null && tx !== undefined) {
    const a = Math.atan2(ty - h.y, tx - h.x);
    const nx = h.x + Math.cos(a) * sp * dt, ny = h.y + Math.sin(a) * sp * dt;
    if (monFree(nx, h.y)) h.x = nx;
    if (monFree(h.x, ny)) h.y = ny;
    h.dir = Math.cos(a) < 0 ? -1 : 1;
  }
  if (!h.met && h.state !== "hostile" && dist2(h.x, h.y, P.x, P.y) < 620 && !uiOpen && !run.escaped) { h.met = true; sawIt("hero"); tipCheck(); askHero(); }
}
function nearestMon(from, maxTiles) {
  let best = null, bd = (maxTiles * TILE) ** 2;
  for (const m of mons) {
    if (m.state === "dead" || MTYPE[m.type].boss) continue;
    const d = dist2(m.x, m.y, from.x, from.y);
    if (d < bd) { bd = d; best = m; }
  }
  return best;
}
function heroDies() {
  const h = hero;

  if (h.cleaner) {

    r.story = "order";

  } else {

    const r = makeRemain(run.pos.d, tx, ty, { type: "body", fresh: true, hi: h.hi, cz: rec.cz, tr: rec.tr, boost: 0.5 });
    r.hero = rec;

    r.items.push(makeItem(run.pos.d, { boost: 0.6, hi: h.hi, cz: rec.cz, tr: rec.tr }));

  for (let i = 0; i < 20; i++) addPart(h.x, h.y, { vx: rnd(-40, 40), vy: rnd(-60, 0), life: rnd(0.4, 1.1), max: 1.1, col: "#b4413a", sz: 2 });

}

function drawTo(c, s, x, y) { c.drawImage(s, Math.round(x), Math.round(y)); }

function computeLight(tx0, ty0, tx1, ty1) {
  const pr = (P.lamp ? lampR() : 1.7) * (1 + Math.sin(time * 8.3) * 0.025 + Math.sin(time * 21) * 0.015);
  const px = P.x / TILE, py = P.y / TILE;
  const ptx = Math.floor(P.x / TILE), pty = Math.floor(P.y / TILE);
  const near = [];
  for (const t of torches) if (Math.abs(t.x - px) < 9 && Math.abs(t.y - py) < 9) near.push(t);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (!inb(tx, ty)) continue;
    const i = idx(tx, ty);
    let l = 0, w = 0;
    const d = Math.hypot(tx + 0.5 - px, ty + 0.5 - py);
    if (d <= pr && los(ptx, pty, tx, ty)) l = clamp(1.12 - Math.pow(d / pr, 2.1), 0, 1);
    const dp = Math.hypot(tx + 0.5 - px, ty + 0.5 - py);
    const inView = dp < 11 && los(ptx, pty, tx, ty);
    for (const t of near) {
      if (!inView) break;
      const dd = Math.hypot(tx - t.x, ty - t.y);
      if (dd > 4.6) continue;
      if (!los(t.x, t.y, tx, ty)) continue;
      const f = clamp(1 - dd / 4.6, 0, 1) * (0.8 + 0.2 * Math.sin(time * 6.7 + t.ph));
      if (f > w) w = f;
    }
    if (inSafeZone(tx, ty)) {
      l = Math.max(l, 0.94 + Math.sin(time * 2.2 + tx) * 0.015);
      w = Math.max(w, 0.16);
    } else if (inGrand(tx, ty)) {                  // 玄室 ― 燭台が隅まで届いている
      l = Math.max(l, 0.80 + Math.sin(time * 1.8 + tx) * 0.03);
      w = Math.max(w, 0.20);
    }
    l = Math.max(l, w * 0.95);
    light[i] = l; warm[i] = w;
    if (l > 0.13) seen[i] = 1;
  }
}

  // 聖堂の設え

    for (let i = 0; i < 3; i++) {

      g.save(); g.globalCompositeOperation = "lighter";
      const cg2 = g.createRadialGradient(cx2, cy2 - 8, 1, cx2, cy2 - 8, 26);
      cg2.addColorStop(0, "rgba(255,210,140,0.16)"); cg2.addColorStop(1, "rgba(255,200,120,0)");

  for (const t of torches) {
    if (t.x < tx0 - 1 || t.x > tx1 + 1 || t.y < ty0 - 1 || t.y > ty1 + 1) continue;
    const f = Math.sin(time * 9 + t.ph), f2 = Math.sin(time * 13.7 + t.ph * 2);
    const bx = t.x * TILE + 6, by = t.y * TILE - 1;
    g.fillStyle = "#ff9a3c"; g.fillRect(bx + (f > 0 ? 0 : 1), by + 2, 4, 5);
    g.fillStyle = "#ffe08a"; g.fillRect(bx + 1, by + 3 + (f2 > 0 ? 0 : 1), 2, 3);
    g.fillStyle = "#fff6d0"; g.fillRect(bx + 1, by + 4, 1, 1);
    g.save(); g.globalCompositeOperation = "lighter";
    const cxp = t.x * TILE + 8, cyp = t.y * TILE + 8, rr = 26 + f * 2;
    const tg = g.createRadialGradient(cxp, cyp, 1, cxp, cyp, rr);
    tg.addColorStop(0, "rgba(255,170,80,0.16)");
    tg.addColorStop(1, "rgba(255,150,60,0)");
    g.fillStyle = tg; g.fillRect(cxp - rr, cyp - rr, rr * 2, rr * 2);
    g.restore();
  }

  // 実体（Yでソート）
  const ents = [];
  for (const c of corpses) ents.push({ y: c.y + 14, kind: "corpse", o: c });
  for (const l of loose) ents.push({ y: l.y, kind: "loose", o: l });
  for (const m of mons) ents.push({ y: m.y, kind: "mon", o: m });
  if (hero) ents.push({ y: hero.y, kind: "hero", o: hero });
  ents.push({ y: P.y, kind: "player", o: P });
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) {
    const tx = Math.floor((e.o.x || 0) / TILE), ty = Math.floor((e.o.y || 0) / TILE);
    if (e.kind === "corpse") {
      const c = e.o;
      if (light[idx(c.tx, c.ty)] < 0.04 && !seen[idx(c.tx, c.ty)]) continue;
      g.save();
      if (c.looted) g.globalAlpha = 0.45;         // 調べ終えたものは沈める
      if (c.type === "blood") {
        g.fillStyle = "#5a1c1c";
        for (let i = 0; i < 7; i++) {
          const h1 = hash(c.tx * 3 + i, c.ty * 5), h2 = hash(c.ty * 7 + i, c.tx * 2);
          g.fillRect(c.x + 2 + h1 * 12, c.y + 6 + h2 * 8, 1 + (h1 > 0.6 ? 2 : 1), 1 + (h2 > 0.7 ? 2 : 1));
        }
        g.fillStyle = "#7a2626"; g.fillRect(c.x + 5, c.y + 9, 6, 3);
      } else if (c.type === "memo") {           // 手記は持っていく ― 骨だけ残る
        drawSpr(SPR.bones, c.x, c.y);
        if (!c.looted) drawSpr(SPR.icon.note, c.x + 6, c.y + 4);
      } else if (c.type === "item") {            // 落とし物そのもの ― 拾えばなくなる
        if (c.looted) { g.restore(); continue; }
        drawSpr(SPR.icon[KIND[c.items[0].k].ico], c.x + 2, c.y + 4 + Math.sin(time * 3 + c.tx) * 0.8);
      } else if (c.type === "broken") {
        drawSpr(SPR.bones, c.x, c.y);
      } else if (c.type === "chest") {           // 空けた箱は、開いたまま残る
        drawSpr(c.looted ? SPR.icon.chestOpen : SPR.icon.chest, c.x + 2, c.y + 3);
      } else if (c.type === "carcass") {          // 魔物の死骸 ― 骨と、緑がかった残滓
        drawSpr(SPR.bones, c.x, c.y);
        g.fillStyle = "rgba(90,130,80,0.5)";
        for (let i = 0; i < 5; i++) {
          const h1 = hash(c.tx * 5 + i, c.ty * 3), h2 = hash(c.ty * 9 + i, c.tx * 6);
          g.fillRect(c.x + 2 + h1 * 12, c.y + 7 + h2 * 7, 2, 1);
        }
      } else {
        drawSpr(c.fresh ? SPR.corpseFresh : SPR.corpse, c.x, c.y);
      }
      g.restore();
      if (!c.looted) {
        const gl = 0.5 + 0.5 * Math.sin(time * 3 + c.tx);
        g.fillStyle = "rgba(232,196,106," + (0.3 + gl * 0.45).toFixed(2) + ")";
        g.fillRect(c.x + 12 + Math.round(Math.sin(time * 2 + c.ty)), c.y + 4, 1, 1);
      }
    } else if (e.kind === "loose") {
      const l = e.o;
      const bob = Math.sin(time * 4 + l.x) * 1.2;
      drawSpr(SPR.icon[KIND[l.it.k].ico], l.x - 6, l.y - 6 + bob);
    } else if (e.kind === "mon") {
      const m = e.o, t = MTYPE[m.type];
      if (!inb(tx, ty) || light[idx(tx, ty)] < 0.045) continue;
      if (!m.seen && m.dead <= 0) { m.seen = 1; dexMon(m.type, run.pos.d); }
      g.save();
      if (m.state === "dead") { g.globalAlpha = clamp(m.dead / 0.45, 0, 1); g.translate(0, (1 - m.dead / 0.45) * 4); }
      if (t.phase || t.dim || t.float) g.globalAlpha *= 0.78;
      if (m.hurt > 0) g.globalAlpha *= 0.6;
      const bob = (t.phase || t.dim || t.float) ? Math.sin(time * 2.4 + m.ph) * 2 : 0;
      const fr = Math.floor(m.anim * (t.erratic ? 9 : 4)) % 2;
      drawSpr(SPR[t.spr][fr], m.x - 8, m.y - 10 + bob, m.state === "chase" ? P.x < m.x : false);
      g.restore();
    } else if (e.kind === "hero") {
      const h = e.o;
      if (!inb(tx, ty) || light[idx(tx, ty)] < 0.045) continue;
      g.save();
      if (h.hurt > 0) g.globalAlpha = 0.65;
      const fr = Math.floor(h.anim * 5) % 2;
      const hsp = h.state === "hostile" ? SPR.heroBad : (h.hi >= 0 ? heroSpr(h.hi) : SPR.hero);
      drawSpr(hsp[fr], h.x - 8, h.y - 11, h.dir < 0);
      g.restore();
      if (h.atk > 0) { g.fillStyle = "rgba(255,240,200,0.85)"; g.fillRect(h.x + (h.dir > 0 ? 7 : -11), h.y - 6, 5, 2); }
    } else {
      if (P.invul > 0 && Math.floor(time * 18) % 2) continue;
      const spr = P.dir === "n" ? SPR.plN : P.dir === "e" ? SPR.plE : SPR.plS;
      const fr = Math.floor(P.anim) % 2;
      drawSpr(spr[fr], P.x - 8, P.y - 11, P.dir === "e" && P.face < 0);
      // 提灯
      const lx = P.x + (P.dir === "e" ? P.face * 7 : P.dir === "n" ? -6 : 6), ly = P.y - 2;
      g.fillStyle = "#2a2333"; g.fillRect(lx - 2, ly - 3, 5, 6);
      if (P.lamp) {
        g.fillStyle = "#ffd86b"; g.fillRect(lx - 1, ly - 2, 3, 4);
        g.fillStyle = "#fff3c4"; g.fillRect(lx, ly - 1, 1, 2);
      } else { g.fillStyle = "#4a4258"; g.fillRect(lx - 1, ly - 2, 3, 4); }
    }
  }
  // 粒子
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.type === "ring") {
      const r = (1 - a) * 26;
      g.strokeStyle = "rgba(232,196,106," + (a * 0.5).toFixed(2) + ")";
      g.lineWidth = 1; g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.stroke();
    } else {
      g.globalAlpha = a; g.fillStyle = p.col;
      g.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz); g.globalAlpha = 1;
    }
  }
  g.restore();

  // ---- 暗闇 ----
  g.save(); g.translate(ox, oy);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const px = tx * TILE, py = ty * TILE;
    if (!inb(tx, ty)) { g.fillStyle = "#05040a"; g.fillRect(px, py, TILE, TILE); continue; }
    const i = idx(tx, ty);
    const q = Math.round(clamp(light[i], 0, 1) * 7) / 7;
    if (q <= 0) {
      g.fillStyle = seen[i] ? "rgba(6,6,16,0.84)" : "#05040a";
      g.fillRect(px, py, TILE, TILE);
    } else if (q < 1) {
      g.fillStyle = "rgba(5,4,12," + (1 - q * 0.97).toFixed(3) + ")";
      g.fillRect(px, py, TILE, TILE);
    }
  }
  // 暖色
  g.globalCompositeOperation = "lighter";
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (!inb(tx, ty)) continue;
    const w = warm[idx(tx, ty)];
    if (w > 0.06) { g.fillStyle = "rgba(255,140,50," + (w * 0.085).toFixed(3) + ")"; g.fillRect(tx * TILE, ty * TILE, TILE, TILE); }
  }
  // 提灯の光
  if (P.lamp) {
    const rr = lampR() * TILE * 0.72;
    const grd = g.createRadialGradient(P.x, P.y - 2, 2, P.x, P.y - 2, rr);
    grd.addColorStop(0, "rgba(255,205,120,0.26)");
    grd.addColorStop(0.5, "rgba(255,170,80,0.09)");
    grd.addColorStop(1, "rgba(255,150,60,0)");
    g.fillStyle = grd; g.fillRect(P.x - rr, P.y - 2 - rr, rr * 2, rr * 2);
  }
  g.globalCompositeOperation = "source-over";
  g.restore();

  // ---- 上物（灯りに関係なく見せるもの） ----
  g.save(); g.translate(ox, oy);
  for (const m of mons) {
    if (m.state === "dead") continue;
    if (m.alert > 0) mark(m.x, m.y - 21 - (1 - m.alert / 1.2) * 3, "!", "#ff6b6b");
    else if (m.state === "chase") mark(m.x, m.y - 20, "!", "#e0524a");
    else if (m.state === "search") mark(m.x, m.y - 20, "?", "#e8c46a");
  }
  if (hero && hero.hp > 0) {
    const h = hero, w = 20;
    g.fillStyle = "rgba(0,0,0,0.6)"; g.fillRect(h.x - w / 2 - 1, h.y - 22, w + 2, 4);
    g.fillStyle = h.state === "hostile" ? "#e0524a" : "#7fd0ff";
    g.fillRect(h.x - w / 2, h.y - 21, Math.round(w * clamp(h.hp / h.maxHp, 0, 1)), 2);
    wtext(h.state === "hostile" ? (h.avenger ? "復讐者" : "勇者 " + h.name) : "勇者 " + h.name,
      h.x, h.y - 30, h.state === "hostile" ? "#ff9a92" : "#cfe0ff", 9);
  }
  // 回収ゲージ
  const nc = P.looting || nearestRemain();
  if (nc && !nc.looted) {
    if (P.looting) {
      const w = 26;
      g.fillStyle = "rgba(0,0,0,0.7)"; g.fillRect(nc.x + 8 - w / 2 - 1, nc.y - 9, w + 2, 5);
      g.fillStyle = "#e8c46a"; g.fillRect(nc.x + 8 - w / 2, nc.y - 8, Math.round(w * clamp(P.looting.prog, 0, 1)), 3);
      wtext("調べている…", nc.x + 8, nc.y - 17, "#e8c46a", 9);
    } else {
      const bob = Math.sin(time * 4) * 1;
      wtext("立ち止まれば調べる ― " + remainLabel(nc), nc.x + 8, nc.y - 12 + bob, "#e8c46a", 9);
    }
  }
  if (altar && Math.hypot(P.x / TILE - altar.x, P.y / TILE - altar.y) < 8) {
    wtext("聖堂", altar.x * TILE + 8, altar.y * TILE - 14, "#dfe8ff", 10);
  }
  if (houseRoom && P.x / TILE >= houseRoom.x - 1 && P.x / TILE <= houseRoom.x + houseRoom.w &&
      P.y / TILE >= houseRoom.y - 1 && P.y / TILE <= houseRoom.y + houseRoom.h) {
    wtext("戦いの跡 ― もう終わっている", (houseRoom.cx) * TILE + 8, (houseRoom.y - 1) * TILE + 4, "#9aa2b8", 9);
  }
  if (bossGate && Math.hypot(P.x / TILE - bossGate.x, P.y / TILE - bossGate.y) < 7) {
    wtext("扉 ― この奥が最深部だ", bossGate.x * TILE + 8, bossGate.y * TILE - 14, "#e8c46a", 9);
  }
  // 浮き文字
  for (const f of floaters) {
    const a = clamp(f.life / 1.4, 0, 1);
    fg.globalAlpha = Math.min(1, a * 1.6);
    wtext(f.txt, f.x, f.y - (1 - a) * 12, f.col, 10);
    fg.globalAlpha = 1;
  }
  g.restore();

  // ---- 小地図 ----
  drawMinimap();

  if (P.smoke > 0) {
    g.fillStyle = "rgba(150,160,185," + (0.1 * clamp(P.smoke / 7, 0, 1)).toFixed(3) + ")";
    g.fillRect(0, 0, VW, VH);
  }
  if (P.tired) {
    const pl = 0.16 + 0.08 * Math.sin(time * 2.4);
    const tg = g.createRadialGradient(VW / 2, VH / 2, VH * 0.2, VW / 2, VH / 2, VH * 0.8);
    tg.addColorStop(0, "rgba(10,10,20,0)");
    tg.addColorStop(1, "rgba(10,10,20," + (0.5 + pl).toFixed(3) + ")");
    g.fillStyle = tg; g.fillRect(0, 0, VW, VH);
  }
  const chasers = mons.reduce((n, m) => n + (m.dead <= 0 && m.state === "chase" ? 1 : 0), 0) + (hero && hero.state === "hostile" ? 1 : 0);
  if (chasers > 0) {
    const pulse = (0.13 + 0.09 * Math.sin(time * 7)) * clamp(chasers * 0.6, 0.5, 1);
    const vg = g.createRadialGradient(VW / 2, VH / 2, VH * 0.28, VW / 2, VH / 2, VH * 0.78);
    vg.addColorStop(0, "rgba(180,50,45,0)");
    vg.addColorStop(1, "rgba(180,50,45," + pulse.toFixed(3) + ")");
    g.fillStyle = vg; g.fillRect(0, 0, VW, VH);
  }
  if (flash > 0) { g.fillStyle = "rgba(180,65,58," + (flash * 0.5).toFixed(3) + ")"; g.fillRect(0, 0, VW, VH); }
}

/* 小地図は盤面ではなく DOM のキャンバスに描く ― 親指と同じ高さまで下ろすため */
function drawMinimap() {
  mg.clearRect(0, 0, MW, MH);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const i = idx(x, y);
    if (!seen[i]) continue;
    const t = map[i];
    mg.fillStyle = t === T_WALL ? "#2a2536" : t === T_EXIT ? "#7fd0ff" : t === T_DOWN ? "#e8c46a" :
      t === T_UP ? "#6f8f5a" : (inSafeZone(x, y) || inGrand(x, y)) ? "#8b84a8" : "#4a4360";
    mg.fillRect(x, y, 1, 1);
  }
  for (const c of corpses) if (!c.looted && seen[idx(c.tx, c.ty)]) { mg.fillStyle = "#e8c46a"; mg.fillRect(c.tx, c.ty, 1, 1); }
  mg.fillStyle = Math.floor(time * 4) % 2 ? "#fff3c4" : "#e8c46a";
  mg.fillRect(Math.floor(P.x / TILE) - 1, Math.floor(P.y / TILE) - 1, 3, 3);
}

/* 全体地図 ― 地形は1タームのあいだ変わらないので、歩いたぶんが残る */
function drawFullMap() {
  viewOX = 0; viewOY = 0;                       // 画面座標で描く
  g.fillStyle = "rgba(4,3,8,0.94)"; g.fillRect(0, 0, VW, VH);
  const sc = Math.max(2, Math.min(Math.floor((VW - 14) / MW), Math.floor((VH - 90) / MH)));
  const w = MW * sc, h = MH * sc, x0 = Math.floor((VW - w) / 2), y0 = 44;
  g.fillStyle = "#0a0812"; g.fillRect(x0 - 3, y0 - 3, w + 6, h + 6);
  g.strokeStyle = "rgba(232,196,106,0.3)"; g.lineWidth = 1; g.strokeRect(x0 - 3.5, y0 - 3.5, w + 7, h + 7);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const i = idx(x, y);
    if (!seen[i]) continue;
    const t = map[i];
    g.fillStyle = t === T_WALL ? "#2b2639" : (inSafeZone(x, y) || inGrand(x, y)) ? "#8b84a8" : "#524a68";
    g.fillRect(x0 + x * sc, y0 + y * sc, sc, sc);
  }
  const mark = (x, y, col, big) => {
    g.fillStyle = col;
    g.fillRect(x0 + x * sc - (big ? 1 : 0), y0 + y * sc - (big ? 1 : 0), sc + (big ? 2 : 0), sc + (big ? 2 : 0));
  };
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (!seen[idx(x, y)]) continue;
    const t = map[idx(x, y)];
    if (t === T_DOWN) mark(x, y, "#e8c46a", true);
    else if (t === T_UP) mark(x, y, "#6f8f5a", true);
    else if (t === T_EXIT) mark(x, y, "#7fd0ff", true);
  }
  for (const c of corpses) if (!c.looted && seen[idx(c.tx, c.ty)]) mark(c.tx, c.ty, "#ffd86b", false);
  if (Math.floor(time * 4) % 2) mark(Math.floor(P.x / TILE), Math.floor(P.y / TILE), "#ffffff", true);
  wtext("地　図 ― " + levelName(run.pos) + (run.pos.s ? "" : "（" + themeOf(run.pos.d).nm + "）"), VW / 2, 20, "#e8c46a", 11);
  wtext("下り ● 上り ● 転移碑 ● 遺留品 ●", VW / 2, y0 + h + 16, "#93876f", 9);
  wtext(isTouch ? "もう一度 小地図を押すととじる" : "M でとじる", VW / 2, y0 + h + 30, "#5a5266", 9);
}

/* ---------- 地上（町）― 背景そのものが操作盤 ---------- */
const townStars = [];
for (let i = 0; i < 70; i++) townStars.push({ x: Math.random() * VW, y: Math.random() * (VH * 0.42), r: Math.random(), ph: rnd(0, 9) });
const fireflies = [];
for (let i = 0; i < 12; i++) fireflies.push({ x: rnd(0, VW), y: rnd(VH * 0.66, VH), ph: rnd(0, 9), sp: rnd(0.3, 0.9) });
// 遠景の街並み［x, 高さ, 幅］
const FARTOWN = [[2, 16, 12], [16, 10, 9], [27, 20, 8], [38, 13, 12], [52, 9, 8],
  [62, 17, 10], [88, 12, 9], [100, 22, 11], [114, 11, 8], [126, 16, 12],
  [150, 10, 8], [161, 19, 10], [176, 13, 11], [190, 9, 9]];
let townHots = [], townHover = null, townFlash = 0;

function hot(x, y, w, h, act, label, lx, ly) { townHots.push({ x, y, w, h, act, label, lx, ly }); }

/* ふわりとした光 */
function glow(x, y, r, col, a) {
  g.save(); g.globalCompositeOperation = "lighter";
  const gr = g.createRadialGradient(x, y, r * 0.12, x, y, r);
  gr.addColorStop(0, "rgba(" + col + "," + (+a).toFixed(3) + ")"); gr.addColorStop(1, "rgba(" + col + ",0)");
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}

/* 板壁・柱・軒・切妻屋根で小さな家を組む */
function house(x, y, w, h, c) {
  const rh = c.rh, ov = c.ov;
  for (let i = 0; i < rh; i++) {                   // 屋根は 1px ずつ積んで段々に
    const t = i / (rh - 1);
    const rw = Math.round((w + ov * 2) * (0.18 + 0.82 * t));
    g.fillStyle = i < 2 ? c.roofLt : (i % 4 === 3 ? c.roofDk : c.roof);
    g.fillRect(Math.round(x + w / 2 - rw / 2), y - rh + i, rw, 1);
  }
  g.fillStyle = c.eave; g.fillRect(x - ov, y - 2, w + ov * 2, 2);
  g.fillStyle = c.wall; g.fillRect(x, y, w, h);
  g.fillStyle = c.wallDk;
  for (let i = y + 4; i < y + h - 3; i += 5) g.fillRect(x + 1, i, w - 2, 1);
  g.fillStyle = c.beam; g.fillRect(x, y, 2, h); g.fillRect(x + w - 2, y, 2, h);
  g.fillStyle = c.base; g.fillRect(x - 1, y + h - 3, w + 2, 3);
}

/* 灯りのともった窓 */
function litWin(x, y, w, h, a) {
  g.fillStyle = "#0d0a12"; g.fillRect(x, y, w, h);
  g.fillStyle = "rgba(255,206,124," + a.toFixed(2) + ")"; g.fillRect(x + 1, y + 1, w - 2, h - 2);
  g.fillStyle = "#2a1f1a";
  g.fillRect(x + (w >> 1) - 1, y, 2, h); g.fillRect(x, y + (h >> 1) - 1, w, 2);
}

function drawTown() {
  viewOX = 0; viewOY = 0;
  townHots = [];
  const GY = 156;                                  // 地平線

  // ---- 空 ----
  const sky = g.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, "#0b0a1c"); sky.addColorStop(0.38, "#141530");
  sky.addColorStop(0.58, "#1d1b30"); sky.addColorStop(1, "#0d0b14");
  g.fillStyle = sky; g.fillRect(0, 0, VW, VH);
  for (const s2 of townStars) {
    const tw = 0.5 + 0.5 * Math.sin(time * 2 + s2.ph);
    g.fillStyle = "rgba(232,230,255," + (0.25 + tw * 0.6).toFixed(2) + ")";
    g.fillRect(s2.x | 0, s2.y | 0, s2.r > 0.85 ? 2 : 1, s2.r > 0.85 ? 2 : 1);
  }
  // 月
  const mx = VW - 46, my = 54;
  g.fillStyle = "#f2e9c8"; g.beginPath(); g.arc(mx, my, 12, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#e6dbb6"; g.beginPath(); g.arc(mx - 4, my - 4, 3, 0, Math.PI * 2); g.arc(mx + 5, my + 4, 2, 0, Math.PI * 2); g.fill();
  glow(mx, my, 50, "240,235,200", 0.15);

  // ---- 遠くの街並み ----
  g.fillStyle = "#12111f";
  for (const f of FARTOWN) {
    g.fillRect(f[0], GY - 14 - f[1], f[2], f[1] + 14);

let isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
const actions = {};
/* パネルを ［見出し／本文／操作］ の三段に組み直す。
   スクロールするのは本文だけ、とじる手段はつねに画面内に置く。 */
const CLOSERS = ["back", "resume", "titleback", "optback", "dbgback"];   // recs も titleback で閉じる
function buildSheet(p) {
  const kids = Array.prototype.slice.call(p.children);
  const head = document.createElement("div"); head.className = "phead";
  const body = document.createElement("div"); body.className = "pbody";
  const foot = document.createElement("div"); foot.className = "pfoot";
  let i = 0;                                       // 先頭の見出し・説明・タブは固定
  for (; i < kids.length; i++) {
    const k = kids[i];
    if (!(k.tagName === "H2" || k.classList.contains("sub") || k.classList.contains("tabs"))) break;
    head.appendChild(k);
    if (k.classList.contains("tabs")) { i++; break; }   // タブから下は中身
  }
  const rest = kids.slice(i);
  let cut = -1;                                    // いちばん最後の操作列から下は足元へ固定
  for (let j = rest.length - 1; j >= 0; j--) if (rest[j].classList.contains("btns")) { cut = j; break; }
  rest.forEach((el, j) => {
    ((el.classList.contains("pin") || (cut >= 0 && j >= cut)) ? foot : body).appendChild(el);
  });
  body.querySelectorAll("[style]").forEach(el => {  // 入れ子のスクロールは潰す
    if (el.style.maxHeight) { el.style.maxHeight = ""; el.style.overflow = ""; }
  });
  const fbs = foot.querySelectorAll(".btns");   // 操作列が二段になったら、とじる側は控えめに
  if (fbs.length > 1) fbs[fbs.length - 1].classList.add("slim");
  p.appendChild(head); if (body.children.length) p.appendChild(body); if (foot.children.length) p.appendChild(foot);
  const c = p.querySelector(CLOSERS.map(a => '[data-a="' + a + '"]').join(","));
  if (c) {                                         // × はつねに右上
    const x = document.createElement("div");
    x.className = "pclose"; x.textContent = "×"; x.dataset.a = c.dataset.a;
    x.setAttribute("aria-label", "とじる");
    head.appendChild(x); head.classList.add("hasx");
    if (head.children.length === 1) head.classList.add("bare");
  }
  return { head, body, foot, closable: !!c, closeAct: c ? c.dataset.a : "" };
}

  const t = p.querySelector(".tabs .tab.on");

/* ---------- 地上 ---------- */
function daysLeft() { return G.limit - G.day + 1; }
function showTown() {
  scene = "town"; setMusic("town");
  if (pendingCase) { const c = pendingCase; pendingCase = null; showCase(c); return; }
  if (G.ended === "fail") { endFail(); return; }
  if (G.debt <= 0 && !G.ended) { G.ended = "clear"; recordClear(); endClear(); return; }
  if (G.day > G.limit && G.debt > 0) { G.ended = "fail"; if (!G.assist) { S.rec.fails++; recordEnd("fail"); } save(); endFail(); return; }
  if (G.gift) {
    G.stash.push(G.gift);
    toast("店の前に置かれていた ― " + itemName(G.gift) + "（勇者からの贈り物）", "good");
    G.gift = null; save();
  }
  townHover = null;
  closeUI();                                   // 背景そのものが操作盤
}
function townLine() {
  const l = [
    "「今日も誰か死んだらしいよ。……仕事だね」",
    "「勇者様の装備は高く売れる。持ち主が要らなくなればね」",
    "「深いところほど、いい品が眠ってる。帰れればの話だが」",
    "「灯りを消して歩く癖をつけな。長生きするよ」",
    "「ギルドの地図、また版が新しくなったってさ」"
  ];
  if (daysLeft() <= 5 && G.debt > 0) l.push("「期日が近いね。……悪いこと言わないから、深く行きな」");
  if (G.susp >= 50) l.push("「あんたのこと、ギルドで話してる連中がいたよ」");
  if (G.kind >= 3) l.push("「助けられた勇者が、あんたを探してたよ」");
  return pick(l);
}
actions.dive = () => {

  for (let d = SAFE_EVERY; d < BOSS_FLOOR; d += SAFE_EVERY) {

    const danger = "★".repeat(clamp(Math.ceil(d / 6), 1, 5)) + "☆".repeat(5 - clamp(Math.ceil(d / 6), 1, 5));
    const note = d >= BOSS_FLOOR ? "最深部の扉の、その先" : d >= 20 ? "石の番人と亡霊の巣の只中" : d >= 15 ? "生きて戻る者は少ない" :
      d >= 10 ? "骸骨兵と亡霊" : "そろそろ本番だ";

      '<div class="pr" style="color:#b4413a;letter-spacing:1px">' + danger + "</div></div>";

    '<div class="sub">聖堂は5階ごとに挟まっている独立した階だ。<b>転移碑</b>で地上へ帰れて、<b>行ったことのある聖堂へは直接降りられる</b>。<br>' +
    "階段は上下ともに使える。水と食料 " + supplyMin(G.up.sup) + " 分 ／ 背負える重さ " + bagCap() + " ／ 体力 " + maxHearts() + " ／ 防具 " + armorMax() +
    "<br>持ち込み ― ポーション <b>" + Math.min(G.inv.potion, CARRY_MAX) + "</b> ／ 煙玉 <b>" + Math.min(G.inv.smoke, CARRY_MAX) +
    "</b>（<b>各 " + CARRY_MAX + " 個まで</b>。残りは倉庫に置いていく）" +
    (watchMode() ? '<br><b style="color:var(--gold)">見学中 ― まだ行っていない聖堂にも降りられる</b>' : "") + "</div>" +
    '<div class="list" style="max-height:44vh;overflow:auto">' + rows + "</div>" +
    '<div class="btns"><div class="btn" data-a="back">やめる</div></div></div>');
};
actions.dive2 = d => {
