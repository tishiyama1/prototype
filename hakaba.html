/* ---------- よろず買取 ---------- */
let shopTab = "sell";
actions.shop = () => showShop();
function showShop(tab) {
  scene = "town"; shopTab = tab || shopTab;
  let body = "";
  if (shopTab === "sell") {
    if (!G.stash.length) body = '<p class="q">売る品がない。もぐって拾ってきな。</p>';
    else {
      let total = 0;
      body = '<div class="list" style="max-height:44vh;overflow:auto">' + G.stash.map((it, i) => {
        total += sellPrice(it);
        return itemRow(it, money(sellPrice(it)) + " G" + '<span class="btn sm" data-a="sell1" data-i="' + i + '" style="margin-left:8px">売る</span>');
      }).join("") + "</div>" +
        '<div class="btns pin"><div class="btn pri" data-a="sellall">まとめて売る ' + money(total) + " G</div>" +
        '<div class="btn" data-a="store">倉庫に入れる</div></div>';
    }
    body += '<div class="note">今日の相場 ― ' + Object.keys(CAT_NM).map(c => CAT_NM[c] + " " + marketArrow(c)).join(" ／ ") + "</div>";
  } else if (shopTab === "buy") {
    body = '<div class="list">' + GOODS.map(gd => {
      const can = G.gold >= gd.price;
      return '<div class="row"><div class="ico" style="background-image:url(' + iconURL[gd.ico] + ')"></div>' +
        '<div class="nm">' + gd.nm + "<small>" + gd.desc + " ／ 所持 " + G.inv[gd.id] +
        (gd.id === "potion" || gd.id === "smoke" ? "（持ち込みは " + CARRY_MAX + " 個まで）" : "") + "</small></div>" +
        '<div class="pr">' + money(gd.price) + ' G<span class="btn sm' + (can ? "" : " dis") + '" data-a="buy" data-i="' + gd.id + '" style="margin-left:8px">買う</span></div></div>';
    }).join("") + "</div>";
  } else {
    body = '<div class="list" style="max-height:46vh;overflow:auto">' + Object.keys(UPG).map(k => {
      const u = UPG[k], lv = G.up[k], maxed = lv >= u.max;
      const cost = maxed ? 0 : u.cost[lv - 1];
      const can = !maxed && G.gold >= cost;
      const next = maxed ? "" : " → " + u.val(lv + 1);
      return '<div class="row"><div class="ico" style="background-image:url(' + iconURL[u.ico] + ')"></div>' +
        '<div class="nm">' + u.nm + " Lv" + lv + "<small>" + u.desc + "：" + u.val(lv) + next + "</small></div>" +
        '<div class="pr">' + (maxed ? "十分だ" : money(cost) + ' G<span class="btn sm' + (can ? "" : " dis") + '" data-a="upg" data-i="' + k + '" style="margin-left:8px">強化</span>') + "</div></div>";
    }).join("") + "</div>";
  }
  openUI("shop", '<div class="panel"><h2>よろず買取</h2>' +
    '<div class="sub">「死人の持ち物は、生きてる奴の役に立ってこそさ」<br>所持金 <b style="color:var(--gold)">' + gold() + "</b> G</div>" +
    '<div class="tabs"><div class="tab' + (shopTab === "sell" ? " on" : "") + '" data-a="tab" data-i="sell">売る</div>' +
    '<div class="tab' + (shopTab === "buy" ? " on" : "") + '" data-a="tab" data-i="buy">道具を買う</div>' +
    '<div class="tab' + (shopTab === "upg" ? " on" : "") + '" data-a="tab" data-i="upg">身を固める</div></div>' +
    body +
    '<div class="btns" style="margin-top:12px"><div class="btn" data-a="back">店を出る</div></div></div>');
}
actions.tab = d => showShop(d.i);
function sellItem(it) {
  const p = sellPrice(it);
  G.gold += p; G.sold++; tipCheck();
  if (it.tr === "hum") addSusp(2);             // 表には出ない。ギルドは何を回収したか見ている
  return p;
}
actions.sell1 = d => {
  const i = parseInt(d.i, 10), it = G.stash[i];
  if (!it) return;
  sellItem(it); G.stash.splice(i, 1); save(); SFX.coin(); showShop("sell");
};
actions.sellall = () => {
  if (!G.stash.length) return;
  let t = 0;
  for (const it of G.stash) t += sellItem(it);
  G.stash = []; save(); SFX.coin();
  toast(money(t) + " G を受け取った", "good");
  showShop("sell");
};
actions.buy = d => {
  const gd = GOODS.find(x => x.id === d.i);
  if (!gd || G.gold < gd.price) { SFX.deny(); return; }
  G.gold -= gd.price; G.inv[gd.id]++; save(); SFX.buy(); showShop("buy");
};
actions.upg = d => {
  const k = d.i, u = UPG[k], lv = G.up[k];
  if (lv >= u.max) return;
  const cost = u.cost[lv - 1];
  if (G.gold < cost) { SFX.deny(); return; }
  G.gold -= cost; G.up[k]++; save(); SFX.buy();
  toast(u.nm + " を新しくした", "good");
  showShop("upg");
};

/* ---------- 倉庫と装備 ---------- */
let storeTab = "store";
function countMurderKept() {
  G.story.murderKept = G.store.filter(it => it.tr === "hum").length;
}
actions.store = () => showStore();
function showStore(tab) {
  scene = "town"; storeTab = tab || storeTab;
  let body = "";
  if (storeTab === "store") {
    body = '<div class="sub" style="margin-bottom:6px">荷（売り場に出ている品）</div>' +
      (G.stash.length ? '<div class="list" style="max-height:26vh;overflow:auto">' + G.stash.map((it, i) =>
        itemRow(it, money(sellPrice(it)) + ' G<span class="btn sm" data-a="toStore" data-i="' + i + '" style="margin-left:8px">しまう</span>', "", true)).join("") + "</div>"
        : '<p class="q">荷はからっぽだ。</p>') +
      '<div class="sub" style="margin:12px 0 6px">倉庫（' + G.store.length + " 点）</div>" +
      (G.store.length ? '<div class="list" style="max-height:26vh;overflow:auto">' + G.store.map((it, i) =>
        itemRow(it, '<span class="btn sm" data-a="toStash" data-i="' + i + '">出す</span>', "", true)).join("") + "</div>"

  } else {
    const slots = [["shield", "盾"], ["armor", "鎧"], ["helm", "兜"], ["acc", "装身具"]];
    body = '<div class="list">' + slots.map(([k, nm]) => {
      const it = G.equip[k];
      return '<div class="row">' +
        '<div class="ico" style="background-image:url(' + (it ? iconURL[KIND[it.k].ico] : "") + ')"></div>' +
        '<div class="nm">' + nm + "<small>" + (it ? itemName(it) + "（" + qualNm(it) + "） ・ " + itemSub(it) : "なし") + "</small></div>" +
        '<div class="pr">' + (it ? '<span class="btn sm" data-a="unequip" data-i="' + k + '">外す</span>' : "―") + "</div></div>";
    }).join("") + "</div>" +
      '<div class="stat" style="margin-top:8px"><span>防御 <b>' + equipDef() + "</b>（被弾を " + armorMax() + " 回まで肩代わり）</span></div>" +
      '<div class="sub" style="margin:10px 0 6px">身につけられる品（荷と倉庫から）― 武器は売るためのものだ</div>';
    const cand = [];
    G.stash.forEach((it, i) => { if (SLOT_OF[KIND[it.k].cat]) cand.push(["stash", i, it]); });
    G.store.forEach((it, i) => { if (SLOT_OF[KIND[it.k].cat]) cand.push(["store", i, it]); });
    body += cand.length ? '<div class="list" style="max-height:32vh;overflow:auto">' + cand.map(([src, i, it]) =>
      itemRow(it, '<span class="btn sm" data-a="equip" data-src="' + src + '" data-i="' + i + '">装備</span>')).join("") + "</div>"
      : '<p class="q">装備できる品がない。</p>';
    body += '<div class="note">身につけた防具は殴られるたびに傷む。傷んだ品は売値が下がり、いずれ壊れる。</div>';
  }
  openUI("store", '<div class="panel"><h2>倉庫と装備</h2>' +
    '<div class="tabs"><div class="tab' + (storeTab === "store" ? " on" : "") + '" data-a="stab" data-i="store">倉庫</div>' +
    '<div class="tab' + (storeTab === "equip" ? " on" : "") + '" data-a="stab" data-i="equip">装備</div></div>' +
    body +
    '<div class="btns" style="margin-top:12px"><div class="btn" data-a="back">もどる</div></div></div>');
}
actions.stab = d => showStore(d.i);
actions.toStore = d => {
  const i = parseInt(d.i, 10); if (!G.stash[i]) return;
  G.store.push(G.stash.splice(i, 1)[0]);
  countMurderKept(); checkCases(); save();
  if (pendingCase) { const c = pendingCase; pendingCase = null; showCase(c); return; }
  showStore("store");
};
actions.toStash = d => {
  const i = parseInt(d.i, 10); if (!G.store[i]) return;
  G.stash.push(G.store.splice(i, 1)[0]);
  countMurderKept(); save(); showStore("store");
};
actions.equip = d => {
  const i = parseInt(d.i, 10);
  const arr = d.src === "stash" ? G.stash : G.store;
  const it = arr[i]; if (!it) return;
  const slot = SLOT_OF[KIND[it.k].cat]; if (!slot) return;
  if (G.equip[slot]) G.store.push(G.equip[slot]);
  G.equip[slot] = it; arr.splice(i, 1);
  if (slot === "armor" || slot === "shield" || slot === "helm") sawIt("armor");
  countMurderKept(); tipCheck(); save(); SFX.buy(); showStore("equip");
};
actions.unequip = d => {
  const it = G.equip[d.i]; if (!it) return;
  G.store.push(it); G.equip[d.i] = null;
  countMurderKept(); save(); showStore("equip");
};

/* ---------- 冒険者ギルド ---------- */
actions.guild = () => showGuild();
function showGuild() {
  scene = "town"; sawIt("guild"); tipCheck();
  const opts = [1000, 10000, 50000].filter(v => v <= G.gold && v <= G.debt);
  const all = Math.min(G.gold, G.debt);
  let btns = opts.map(v => '<div class="btn" data-a="pay" data-v="' + v + '">' + money(v) + " G 返す</div>").join("");
  if (all > 0) btns += '<div class="btn pri" data-a="pay" data-v="' + all + '">' + (all >= G.debt ? "全額返済" : "有り金すべて（" + money(all) + " G）") + "</div>";
  openUI("guild", '<div class="panel"><h2>冒険者ギルド</h2>' +
    '<div class="sub">受付の女は、いつも同じ笑い方をする。<br>' + GUILD_LINE[suspLevel()] + "</div>" +
    '<div class="stat"><span>借金 <b>' + money(G.debt) + "</b> G</span><span>返済ずみ <b>" + money(G.paid) + "</b> G</span>" +
    "<span>" + G.day + " 日目 ／ 期限まで <b>" + Math.max(0, daysLeft()) + "</b> 日</span><span>所持金 <b>" + gold() + "</b> G</span></div>" +
    (G.debt > 0 ? '<div class="btns">' + (btns || '<p class="q">返せる金がない。</p>') + "</div>"
      : '<p class="q">借金はもうない。あんたは自由だ。……何をするかは知らないが。</p>') +
    '<div class="hr"></div>' +
    '<div class="sub" style="margin:0">掲示板</div><p class="q">' + boardLine() + "</p>" +
    '<div class="btns" style="margin-top:12px"><div class="btn" data-a="back">出る</div></div></div>');
}
function boardLine() {
  const l = [
    "『地下12階 討伐隊員募集。装備自弁。報酬は成功払い』",
    "『新版 ダンジョン図 入荷しました。1枚 300G』",
    "『行方不明：斥候ミラ。情報提供者に謝礼』",
    "『地下14階以深への単独潜行は自己責任で』",
    "『遺品回収業 登録更新のお知らせ』"
  ];
  if (G.susp >= 60) l.push("『遺品の持ち込みに関する規則が改定されました。詳細は受付まで』");
  if (caseDone("c3")) l.push("『新版 ダンジョン図 入荷しました。1枚 300G』（……また新版か）");
  return pick(l);
}
actions.pay = d => {
  const v = Math.min(parseInt(d.v, 10), G.gold, G.debt);
  if (v <= 0) { SFX.deny(); return; }
  G.gold -= v; G.debt -= v; G.paid += v; save(); SFX.coin();
  toast(money(v) + " G を返した", "good");
  if (G.debt <= 0) { G.ended = "clear"; recordClear(); endClear(); return; }
  showGuild();
};

actions.dbgDex = d => {
  dbgDirty();
  const all = d.i === "all";
  if (d.i === "none") { DX.mon = {}; DX.hero = {}; DX.item = {}; DX.cause = {}; DX.notes = []; }
  if (all || d.i === "mon") for (const k in MTYPE) {
    const dep = MTYPE[k].dMin === 99 ? 30 : MTYPE[k].dMin;
    for (let i = 0; i < MON_TIP_SEEN; i++) dexMon(k, dep);   // 癖まで開く
  }
  if (all || d.i === "item") for (const k in KIND)
    dexItem({ k, q: 3, e: 0, wear: 0, d: 1, hi: -1, cz: null, tr: null });
  if (all || d.i === "hero") for (let i = 0; i < HEROES.length; i++) {
    const dep = clamp(1 + (i % 29), 1, 29);
    dexHero(makeHeroRecord(dep, { hi: i }));
  }
  if (all || d.i === "cause") for (const c of CAUSES) {
    DX.cause[c.id] = (DX.cause[c.id] || 0) + 1; colAdd("cause", c.id);
  }
  if (all || d.i === "note") for (const h of HEROES) {
    if (DX.notes.indexOf(h.l) < 0) DX.notes.push(h.l);
    colAdd("notes", h.l);
  }
  save(); showDebug();
};
actions.dbgRec = d => {
  if (d.i === "ends") S.rec.ends = {};
  else S.rec = JSON.parse(JSON.stringify(DEFAULT_SAVE.rec));
  save(); showDebug();
};
actions.dbgWipe = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
actions.dbgEnd = d => {
  if (d.i === "away") {                            // 連れ出しは真相ENDの画面から入る
    dbgDirty();
    const t = G.story;
    t.boss = Math.max(t.boss || 0, END_REQ.away);
    t.badge = Math.max(t.badge || 0, 2); t.order = Math.max(t.order || 0, 1);
    t.witness = Math.max(t.witness || 0, 1);
    t.oddDeath = Math.max(t.oddDeath || 0, 3); t.humanKill = Math.max(t.humanKill || 0, 3);
    t.map = Math.max(t.map || 0, 3); t.house = Math.max(t.house || 0, 1);
    for (const k of Object.keys(MTYPE).slice(0, 5)) dexMon(k, 10);
    save(); closeUI(); endClear("truth"); return;
  }
  closeUI();
  if (d.i === "fail") { endFail(); return; }
  if (d.i) endClear(d.i); else endClear();
};

/* ---------- これまでの記録（周をまたぐぶん。タイトルから見る） ---------- */
let recTab = "rec";
actions.recs = d => showRecords(d && d.i);
function showRecords(tab) {
  recTab = tab || recTab;
  const r = S.rec, ends = r.ends || {}, col = r.col || newCol();
  const line = (a, b) => '<div class="row thin"><div class="nm">' + a + '</div><div class="val">' + b + "</div></div>";
  const empty = t => '<p class="q">' + t + "</p>";
  let body = "";
  if (recTab === "rec") {
    body = '<div class="stat"><span>1日の最高</span><span class="big" style="color:var(--gold)">' + money(r.bestDay || 0) + " G</span></div>" +
      '<div class="stat"><span>1周の最高</span><span class="big" style="color:var(--gold)">' + money(r.bestTerm || 0) + " G</span></div>" +
      '<div class="lbl">返済</div><div class="list">' +
      line("最短返済", r.best ? r.best + " 日" : "―") +
      line("完済", (r.clears || 0) + " 回") +
      line("期限切れ", (r.fails || 0) + " 回") +
      line("背負った借金", (r.terms || r.runs || 0) + " 口") + "</div>" +
      '<div class="lbl">墓場</div><div class="list">' +
      line("潜った回数", (r.hauls || 0) + " 回") +
      line("通算の持ち帰り高", money(r.gold || 0) + " G") +
      line("倒れた", (r.deaths || 0) + " 回") + "</div>" +
      '<div class="lbl">見たエンディング</div>' +
      (Object.keys(ends).filter(k => ENDINGS[k]).length
        ? '<div class="list">' + Object.keys(ENDINGS).filter(k => ends[k]).map(k =>
          '<div class="row rar2"><div class="nm">' + ENDINGS[k].nm + "END<small>" + ENDINGS[k].ttl + "</small></div></div>").join("") + "</div>"
        : empty("まだ借金を返せていない。"));
  } else if (recTab === "hero") {
    body = col.hero.length ? '<div class="list">' + col.hero.slice().sort((a, b) => a - b).map(i =>
      '<div class="row" data-a="dexHero" data-i="' + i + '" data-s="rec" style="cursor:pointer">' +
      '<div class="ico" style="background-image:url(' + ((col.heroBody || []).indexOf(i) >= 0 ? iconURL.body : heroURL(i)) + ')"></div>' +
      '<div class="nm">' + HEROES[i].n + "（" + HEROES[i].c + "）<small>" + HEROES[i].p + "</small></div></div>").join("") + "</div>"
      : empty("まだ誰も見つけていない。");
  } else if (recTab === "mon") {
    body = col.mon.length ? '<div class="list">' + col.mon.filter(k => MTYPE[k]).map(k =>
      '<div class="row' + (MTYPE[k].bonus ? " rar2" : "") + '" data-a="dexMonD" data-i="' + k + '" data-s="rec" style="cursor:pointer">' +
      '<div class="ico" style="background-image:url(' + bigOf("m:" + k) + ');background-size:20px 20px"></div>' +
      '<div class="nm">' + MTYPE[k].nm +
      "<small>生息：地下 " + MTYPE[k].dMin + "〜" + MTYPE[k].dMax + " 階" + (MTYPE[k].boss ? "（最深部）" : "") +
      " ／ " + (MTYPE[k].atk.length ? MTYPE[k].atk.map(a => MON_ATK_NM[a]).join("・") : "襲ってこない") + "</small></div></div>").join("") + "</div>"
      : empty("まだ何も見ていない。");
  } else if (recTab === "item") {
    body = col.item.length ? '<div class="list">' + col.item.filter(k => KIND[k]).map(k =>
      '<div class="row" data-a="dexItem" data-i="' + k + '" data-s="rec" style="cursor:pointer">' +
      '<div class="ico" style="background-image:url(' + iconURL[KIND[k].ico] + ')"></div>' +
      '<div class="nm">' + KIND[k].nm + "<small>" + CAT_NM[KIND[k].cat] + "</small></div></div>").join("") + "</div>"
      : empty("まだ何も拾っていない。");
  } else if (recTab === "cause") {
    body = col.cause.length ? '<div class="list">' + CAUSES.filter(c => col.cause.indexOf(c.id) >= 0).map(c =>
      '<div class="row"><div class="nm">' + c.nm + "</div></div>").join("") + "</div>"
      : empty("まだ誰の死体も調べていない。");
  } else if (recTab === "note") {
    body = col.notes.length ? '<div class="list">' + col.notes.map(n =>
      '<div class="row"><div class="ico" style="background-image:url(' + iconURL.note + ')"></div>' +
      '<div class="nm" style="font-size:11.5px">「' + n + '」</div></div>').join("") + "</div>"
      : empty("まだ手記を拾っていない。");
  } else {
    body = col.tips.length ? '<div class="list">' + col.tips.map(id => {
      const t = tipOf(id); if (!t) return "";
      return '<div class="row' + (t.cat === "clue" ? " rar2" : "") + '"><div class="ico" style="background-image:url(' + iconURL.note + ')"></div>' +
        '<div class="nm">' + t.ttl + "<small>" + t.txt + "</small></div></div>";

    '<div class="tabs">' + ["rec:記録", "hero:勇者", "mon:魔物", "item:品物", "cause:所見", "note:手記", "tips:手帳"].map(t => {
      const [k, nm] = t.split(":");

    }).join("") + "</div>" + body +
    '<div class="btns"><div class="btn pri" data-a="titleback">もどる</div></div></div>');

/* ---------- 図鑑 ---------- */
let dexTab = "hero";
actions.dex = d => showDex(d && d.i);
function showDex(tab) {
  if (!G) { showRecords(); return; }             // タイトルからは通しの記録へ
  dexTab = tab || dexTab;
  let body = "";
  if (dexTab === "hero") {
    const found = HEROES.map((h, i) => i).filter(i => DX.hero[i]);
    body = found.length ? '<div class="list" style="max-height:52vh;overflow:auto">' + found.map(i => {
      const h = HEROES[i], d = DX.hero[i];
      const sc = (d.sc || []).slice(0, 2).map(k => SITU[k]).join(" ／ ");
      const found = d.cz.length > 0;             // 亡骸を調べたか
      return '<div class="row' + (d.odd ? " rar2" : "") + '" data-a="dexHero" data-i="' + i + '" style="cursor:pointer">' +
        '<div class="ico" style="background-image:url(' + (found ? iconURL.body : heroURL(i)) + ')"></div>' +
        '<div class="nm">' + h.n + "（" + h.c + (d.lv > 1 ? " Lv" + d.lv : "") + "）<small>" + h.p +
        (found ? "<br>所見：" + d.cz.map(causeNm).join("・") + " ／ 地下" + d.fl + "階 ／ " + d.n + " 回"
               : "<br>地下" + d.fl + "階で会った ― まだ亡骸は見ていない") +
        (sc ? "<br>状況：" + sc : "") +
        (d.odd ? '<br><span style="color:#ff9a92">この階の魔物では説明がつかない傷が ' + d.odd + " 件</span>" : "") +
        '</small></div></div>';
    }).join("") + "</div>" : '<p class="q">まだ誰の亡骸も見つけていない。</p>';
  } else if (dexTab === "item") {
    const ks = Object.keys(KIND).filter(k => DX.item[k]);
    body = ks.length ? '<div class="list" style="max-height:52vh;overflow:auto">' + ks.map(k => {
      const d = DX.item[k], K = KIND[k];
      return '<div class="row" data-a="dexItem" data-i="' + k + '" style="cursor:pointer">' +
        '<div class="ico" style="background-image:url(' + iconURL[K.ico] + ')"></div>' +
        '<div class="nm">' + K.nm + "<small>" + CAT_NM[K.cat] + " ／ 最良 " + (QUAL[d.q].nm || "並") + " ／ " + d.n + " 点<br>" +
        (d.e.length ? "見た付与：" + d.e.map(e => ENCH[e].nm).join("・") : "付与つきは未発見") + '</small></div></div>';
    }).join("") + "</div>" : '<p class="q">まだ何も拾っていない。</p>';
  } else if (dexTab === "cause") {
    const seen = DX.mon || {};
    const cs = CAUSES.filter(c => DX.cause[c.id]);
    body = (cs.length ? '<div class="list">' + cs.map(c => {
      const n = DX.cause[c.id];
      let src = "傷のかたちからは、相手までは分からない";
      if (c.atk) {
        const any = Object.keys(MTYPE).filter(k => MTYPE[k].atk.indexOf(c.atk) >= 0);
        const who = any.filter(k => MTYPE[k].w > 0 && seen[k]);
        src = who.length ? "この傷を作れる魔物：" + who.map(k => MTYPE[k].nm + "（地下" + MTYPE[k].dMin + "〜" + MTYPE[k].dMax + "階）").join("、")
          : any.length ? "この傷を作れる魔物を、まだ見ていない"
          : "この傷をつけられる魔物は、墓場にいない";
      }
      return '<div class="row"><div class="nm">' + c.nm + "<small>" + n + " 人 ／ " + src + "</small></div></div>";
    }).join("") + "</div>" : '<p class="q">まだ誰の死体も調べていない。</p>') +
      '<div class="note">死体から読めるのは傷のかたちまでで、誰が、なぜ、までは分からない。魔物図鑑と突き合わせて、はじめて妙なところが見えてくる。</div>';
  } else if (dexTab === "mon") {
    const seen = DX.mon || {};
    const ms = Object.keys(MTYPE).filter(k => seen[k]);
    body = (ms.length ? '<div class="list">' + ms.map(k => {
      const t = MTYPE[k], d = seen[k];
      return '<div class="row' + (t.bonus ? " rar2" : "") + '" data-a="dexMonD" data-i="' + k + '" style="cursor:pointer">' +

      (G.assist ? "この周は練習を使ったので、通しの記録には残りません。" : "通しの記録はタイトルの〈これまでの記録〉に。") + "</div>";
  } else if (dexTab === "note") {
    body = DX.notes.length ? '<div class="list" style="max-height:52vh;overflow:auto">' + DX.notes.map(n =>
      '<div class="row"><div class="ico" style="background-image:url(' + iconURL.note + ')"></div><div class="nm" style="font-size:11.5px">「' + n + '」</div></div>').join("") + "</div>"
      : '<p class="q">まだ手記を拾っていない。</p>';
  } else {
    const got = tipGot(), cl = clueGot(), truth = G && G.story.notebook;
    const done = CASES.filter(c => caseDone(c.id));
    body = '<div class="sub" style="margin:0 0 8px">' + pname() + "の手帳。書きとめた順に綴じてある。</div>" +

          '<div class="ico" style="background-image:url(' + iconURL.note + ')"></div><div class="nm">' +
          (truth ? "繋げてみた ― 読み直す" : "気になることを、順に並べてみる") +
          "<small>" + (truth ? "もう一度たどる" : "書きためた紙を、床に並べてみる") + "</small></div></div></div>"
        : "") +
      (got.length ? '<div class="list">' + got.map(id => {          // 拾った順。区切りは入れない
        const t = tipOf(id);
        if (!t) return "";
        return '<div class="row' + (t.cat === "clue" ? " rar2" : "") + '"><div class="ico" style="background-image:url(' + iconURL.note + ')"></div>' +
          '<div class="nm">' + t.ttl + "<small>" + t.txt + "</small></div></div>";

      (done.length ? '<div class="list" style="margin-top:8px">' + done.map(c =>
        '<div class="row rar3" data-a="recase" data-i="' + c.id + '" style="cursor:pointer">' +
        '<div class="ico" style="background-image:url(' + iconURL.note + ')"></div>' +

  }
  openUI("dex", '<div class="panel"><h2>記録と図鑑</h2>' +
    '<div class="sub">' + G.day + " 日目 ／ 期限まで " + Math.max(0, daysLeft()) + " 日 ／ 最深 地下 " + (G.deepest || 1) + " 階" +
    " ― この周のぶんです</div>" + timeNote() +
    '<div class="tabs">' +
    ["log:ログ", "score:成績", "hero:勇者", "mon:魔物", "item:品物", "cause:所見", "note:手記", "case:手帳"].map(t => {
      const [k, nm] = t.split(":");
      return '<div class="tab' + (dexTab === k ? " on" : "") + '" data-a="dex" data-i="' + k + '">' + nm + "</div>";
    }).join("") + "</div>" + body +
    '<div class="btns" style="margin-top:12px"><div class="btn" data-a="back">もどる</div></div></div>');
}

function rememberHero(h) {
  if (h.hi < 0) return;
  if (!G.met.some(m => m.hi === h.hi)) { G.met.push({ hi: h.hi, day: G.day }); save(); }
  const d = DX.hero[h.hi] || (DX.hero[h.hi] = { n: 0, cz: [], lv: 0, fl: 0, sc: [], odd: 0, alive: 1 });
  colAdd("hero", h.hi);                        // 亡骸は見ていない ― 所見は入らない
  d.alive = 1; d.lv = Math.max(d.lv, 1);
  d.fl = d.fl || (run ? run.pos.d : 1);
  save();
}
actions.hTalk = () => {
  closeUI();
  const h = hero;
  let best = null, bd = 1e9;
  for (const c of corpses) if (!c.looted) { const d = dist2(c.x, c.y, P.x, P.y); if (d < bd) { bd = d; best = c; } }
  if (best) {
    for (let y = best.ty - 3; y <= best.ty + 3; y++) for (let x = best.tx - 3; x <= best.tx + 3; x++) if (inb(x, y)) seen[idx(x, y)] = 1;
    const dx = best.tx - Math.floor(P.x / TILE), dy = best.ty - Math.floor(P.y / TILE);
    const dir = (Math.abs(dy) > 2 ? (dy < 0 ? "北" : "南") : "") + (Math.abs(dx) > 2 ? (dx < 0 ? "西" : "東") : "");
    floatTxt(h.x, h.y - 24, "「" + (dir || "この") + "の方に、倒れていた」", "#cfe0ff");
    toast("遺留品の場所を聞いた（" + (dir || "近く") + "）", "good");
  } else floatTxt(h.x, h.y - 24, "「この階に、もう亡骸はない」", "#cfe0ff");
  h.talk = pick(HERO_TALK); h.met = true;
  rememberHero(h);
};
actions.hHelp = () => {
  closeUI();
  if (potHave() <= 0) { SFX.deny(); return; }
  G.inv.potion--; if (carrying()) run.carry.potion--;
  G.kind++; save(); SFX.get_();
  const h = hero;
  h.hp = h.maxHp; h.state = "follow"; h.follow = 45;
  floatTxt(h.x, h.y - 24, "「恩に着る。しばらく守ってやる」", "#7fd0ff");
  toast("勇者 " + h.name + " が同行してくれる", "good");
  if (!(G.story.witness || 0) || chance(0.5)) {      // 証言をひとつ漏らす
    const w = pick(HERO_WITNESS);
    G.story.witness = (G.story.witness || 0) + 1; tipCheck();
    if (DX.notes.indexOf(w) < 0) DX.notes.push(w);
    colAdd("notes", w);
    setTimeout(() => { if (scene === "dungeon" && !uiOpen) { floatTxt(h.x, h.y - 34, "「……ひとつ言っておく」", "#7fd0ff"); toast("手記に書き留めた ― 勇者 " + h.name + " の話", "good"); } }, 900);
    save();
  }
  rememberHero(h);
  for (let i = 0; i < 14; i++) addPart(h.x, h.y, { vx: rnd(-30, 30), vy: rnd(-50, -8), life: 0.8, max: 0.8, col: "#7fd0ff", sz: 2 });
};
actions.hRob = () => {
  closeUI();
  const h = hero;
  let got = 0;
  for (const it of h.gear) { it.hi = h.hi; if (addToBag(it)) got++; else dropItem(it, h.x, h.y); }
  h.gear = [];
  G.infamy++; addSusp(3); save(); SFX.loot(); if (got) SFX.get_();
  h.state = "hostile"; h.hp = Math.max(h.hp, h.maxHp * 0.8);
  floatTxt(h.x, h.y - 24, "「貴様……！」", "#ff9a92");
  toast("装備を奪った（" + got + " 点）― 追われている", "bad");
  shake = 6;
};
actions.hLeave = () => { closeUI(); rememberHero(hero); floatTxt(hero.x, hero.y - 24, "「……達者でな」", "#cfe0ff"); };

function judgeEnding() {
  const t = G.story;
  const monDex = DX.mon ? Object.keys(DX.mon).length : 0;
  const clues = [(t.oddDeath || 0) >= 3, (t.humanKill || 0) >= 3, (t.badge || 0) + (t.order || 0) >= 2,
    (t.map || 0) >= 3, monDex >= 4, (t.house || 0) >= 1].filter(Boolean).length;
  const guild = (t.badge || 0) + (t.order || 0) >= 2;
  // 珍しいほう・その周で「何をしたか」がはっきり出るほうを先に見る
  if (t.boss >= 1 && guild && ((t.witness || 0) >= 1 || t.notebook) && clues >= 4) return "truth";
  if ((t.boss || 0) >= END_REQ.buddy) return "buddy";
  if ((G.infamy || 0) >= END_REQ.cleaner) return "cleaner";
  if (G.gold >= END_REQ.rich) return "rich";
  if (noUpg()) return "bare";
  if (guild && ((t.oddDeath || 0) >= 3 || (t.humanKill || 0) >= 3)) return "plot";
  if ((t.oddDeath || 0) >= 1 || (t.humanKill || 0) >= 1 || t.boss >= 1) return "odd";
  return "normal";
}

  g.lineTo(roadX(1.1) + roadW(1.1), roadY(1.1)); g.lineTo(roadX(1.1) - roadW(1.1), roadY(1.1));

  g.fillStyle = "#96805f";                             // 轍
  for (let i = 1; i < 12; i++) {
    const t2 = i / 12, w = Math.max(1, roadW(t2) * 0.14);
    g.fillRect(Math.round(roadX(t2) - roadW(t2) * 0.45), Math.round(roadY(t2)), Math.round(w * 2), 1);
    g.fillRect(Math.round(roadX(t2) + roadW(t2) * 0.30), Math.round(roadY(t2)), Math.round(w * 2), 1);
  }
  g.fillStyle = "#2e2630";                             // 道ばたの草
  for (let i = 0; i < 26; i++) {
    const h2 = hash(i * 3, 7), h3 = hash(i * 5, 11);
    const t2 = 0.05 + h3 * 0.95, y = roadY(t2);
    const off = (roadW(t2) + 6 + h2 * 46) * (h2 > 0.5 ? 1 : -1);
    g.fillRect(Math.round(roadX(t2) + off), Math.round(y), 1, 2 + Math.round(h3 * 3));
  }

  // ---- ふたり（うしろ姿）― 街道を、朝日のほうへ ----
  const tw2 = 0.62 - Math.min(1, endT / 30) * 0.30;    // 手前から地平線へ
  const cx2 = roadX(tw2), cy2 = roadY(tw2), sc2 = 0.5 + tw2 * 1.1;
  const bob = Math.floor(endT * 3.2) % 2;
  g.save();                                            // 朝日を背に、こちらへ伸びる影
  g.globalAlpha = 0.32; g.fillStyle = "#170f1c";
  g.beginPath(); g.ellipse(cx2 - 12 * sc2, cy2 + 1, 6 * sc2, 2 * sc2, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(cx2 + 11 * sc2, cy2 + 1, 11 * sc2, 3 * sc2, 0, 0, Math.PI * 2); g.fill();
  g.restore();
  g.save();                                            // 主 ― ひとまわり大きく、半歩うしろ
  g.translate(cx2 + 11 * sc2, cy2 - 1); g.scale(1.75 * sc2, 1.75 * sc2);
  g.globalAlpha = 0.95; drawSpr(SPR.kingB[bob], -8, -16); g.restore();
  g.save();                                            // 拾い屋
  g.translate(cx2 - 12 * sc2, cy2); g.scale(sc2, sc2);
  drawSpr(SPR.plN[bob], -8, -16); g.restore();

  // ---- 暗幕とスタッフロール ----
  const dim = clamp((endRoll - 30) / 240, 0, 0.62);
  if (dim > 0) { g.fillStyle = "rgba(6,5,12," + dim.toFixed(2) + ")"; g.fillRect(0, 0, VW, VH); }
  if (fadeIn < 1) { g.fillStyle = "rgba(4,3,8," + (1 - fadeIn).toFixed(2) + ")"; g.fillRect(0, 0, VW, VH); }

  let y = VH + 14 - endRoll;
  for (const ln of STAFF) {
    const kind = ln[0];
    const gap = kind === "" ? 11 : kind === "t" ? 30 : kind === "l" ? 22 : kind === "l2" ? 18 : kind === "n" ? 14 : 15;
    if (y > -20 && y < VH + 20 && kind) {
      if (kind === "c") {
        wtext(ln[1], VW / 2 - 6, y, "#93876f", 9.5, "right");
        wtext(endVal(ln[2]), VW / 2 + 6, y, "#e8c46a", 9.5, "left");
      } else {
        const col = kind === "t" ? "#e8c46a" : kind === "s" ? "#cfc6b0"
          : kind === "l" || kind === "l2" ? "#e8c46a" : "#e6e0d0";
        wtext(ln[1], VW / 2, y, col, kind === "t" ? 20 : kind === "l" ? 12 : kind === "l2" ? 10.5 : 10);
      }
    }
    y += gap;
  }
  if (y < -10 && !endDone) { endDone = true; showEndCard(); }
  if (!endDone && endT > 4.5 && endT < 13) wtext("触れているあいだ 早送り", VW / 2, VH - 8, "rgba(147,135,111,0.7)", 8);
}

const stick = $("stick"), knob = $("knob");
let stickId = null, stickC = { x: 0, y: 0 };
function stickStart(e) {
  const t = e.changedTouches ? e.changedTouches[0] : e;
  stickId = t.identifier !== undefined ? t.identifier : "m";
  const r = stick.getBoundingClientRect();
  stickC = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  stickMove(e);
}
function stickMove(e) {
  const list = e.changedTouches ? Array.from(e.changedTouches) : [e];
  for (const t of list) {
    const id = t.identifier !== undefined ? t.identifier : "m";
    if (id !== stickId) continue;
    const dx = t.clientX - stickC.x, dy = t.clientY - stickC.y;
    const m = Math.hypot(dx, dy) || 1, r = 46;
    const cl = Math.min(m, r);
    knob.style.transform = "translate(" + (dx / m * cl) + "px," + (dy / m * cl) + "px)";
    const n = Math.min(1, m / 34);

  e.preventDefault();
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.05);
  time += dt;
  fg.setTransform(1, 0, 0, 1, 0, 0);
  fg.clearRect(0, 0, fx.width, fx.height);
  shake = Math.max(0, shake - dt * 26);
  flash = Math.max(0, flash - dt * 2.2);

  if (scene === "dungeon" && run) {
    if (!run.escaped) {                          // 画面を開いても墓場は待たない
      const frozen = uiOpen || mapOpen;          // 止まるのは手だけ
      run.t += dt;
      updatePlayer(dt, frozen);
      updateMons(dt);
      updateHero(dt);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].life -= dt; if (floaters[i].life <= 0) floaters.splice(i, 1); }
    drawDungeon(dt);
    if (mapOpen) drawFullMap();
  } else if (scene === "ending") {
    drawEnding(dt);
  } else {
    drawTown();
    if (scene === "title") { g.fillStyle = "rgba(4,3,8,0.45)"; g.fillRect(0, 0, VW, VH); }
  }
  updateHUD(); updatePad();
  PAD.classList.toggle("on", isTouch && scene === "dungeon" && !uiOpen);
  PAD.classList.toggle("lefty", lefty());
  stage.classList.toggle("lefty", lefty());
  stage.classList.toggle("dun", scene === "dungeon" && !!run);
  stage.classList.toggle("mo", mapOpen);
  stage.classList.toggle("dg", scene === "dungeon" && !!run && !uiOpen);

  // フェード
  if (fadeDir > 0) {
    fade = Math.min(1, fade + dt * 3.2);
    if (fade >= 1) { fadeDir = -1; if (fadeCb) { const c = fadeCb; fadeCb = null; fadeLock = false; c(); } }
  } else if (fadeDir < 0) {
    fade = Math.max(0, fade - dt * 2.4);
    if (fade <= 0) fadeDir = 0;
  }
  if (fade > 0) { g.fillStyle = "rgba(3,2,6," + fade.toFixed(3) + ")"; g.fillRect(0, 0, VW, VH); }

  requestAnimationFrame(frame);
}

/* ---------- 起動 ---------- */
muted = !!(S.opt && S.opt.mute);
noMus = !!(S.opt && S.opt.nomus);
if (G) { if (!G.market || !Object.keys(G.market).length) rollMarket(); countMurderKept(); }
resize();
showTitle();
requestAnimationFrame(frame);
addEventListener("pointerdown", () => actx(), { once: true });

})();
