<!DOCTYPE html>
<html lang="ja">

<title>勇者の墓場 ― GRAVE OF HEROES</title>
<style>
  :root {
    --bg: #07060b;
    --ink: #ece4d6;
    --dim: #93876f;
    --gold: #e8c46a;
    --blood: #b4413a;
    --moss: #6f8f5a;
    --line: rgba(232, 196, 106, 0.22);
    --panel: rgba(16, 13, 20, 0.94);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(900px 600px at 50% -12%, rgba(120, 96, 180, 0.13), transparent 62%),
      radial-gradient(700px 520px at 50% 112%, rgba(180, 65, 58, 0.08), transparent 60%),
      linear-gradient(180deg, #0a0810 0%, #07060b 55%, #050409 100%);
  }

  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }
  #ui { z-index: 4; }
  #stage { position: relative; }
  #cv {
    display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #05040a;
    box-shadow: 0 0 0 1px rgba(232,196,106,0.18), 0 24px 70px rgba(0,0,0,0.75);
  }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #scan {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply; opacity: 0.5;
  }
  #vig {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 100% at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 9px;
    font-size: 11px; letter-spacing: 0.06em;
    background: linear-gradient(180deg, rgba(6,5,10,0.88), rgba(6,5,10,0.0));
    pointer-events: none; text-shadow: 0 1px 2px #000;
  }
  #hud .hearts { letter-spacing: 1px; color: var(--blood); font-size: 13px; }
  #hud .sep { flex: 1; }
  #hud .chip { color: var(--gold); }
  #hud .chip b { color: var(--ink); font-weight: 600; }
  #hud .lamp.off { color: #5c5468; }
  #bag {
    position: absolute; left: 8px; bottom: 8px; display: flex; gap: 3px; flex-wrap: wrap;
    max-width: 60%; pointer-events: none;
  }
  #bag i {
    width: 16px; height: 16px; display: block;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(232,196,106,0.25);
    background-repeat: no-repeat; background-position: center; background-size: 12px 12px;
    image-rendering: pixelated;
  }
  #bag i.empty { border-color: rgba(255,255,255,0.08); background-image: none !important; }

  #toasts {
    position: absolute; right: 8px; bottom: 10px; display: flex; flex-direction: column;
    align-items: flex-end; gap: 3px; pointer-events: none;
  }
  #toasts div {
    font-size: 10.5px; padding: 2px 7px; border-radius: 2px;
    background: rgba(8,6,12,0.82); border-left: 2px solid var(--gold);
    animation: toastIn 0.22s ease both; text-shadow: 0 1px 2px #000;
  }
  #toasts div.bad { border-left-color: var(--blood); color: #ffb9b1; }
  #toasts div.good { border-left-color: var(--moss); color: #cfe6b6; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }

  /* ---------- touch controls ---------- */
  #pad { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 3; }
  body.portrait #app { align-items: flex-start; padding-top: 2.5vh; }
  #pad.on { display: block; }
  .stick {
    position: absolute; left: 14px; bottom: 14px; width: 118px; height: 118px;
    border-radius: 50%; background: rgba(20,16,26,0.4); border: 1px solid rgba(232,196,106,0.18);
    pointer-events: auto;
  }
  .stick .knob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; background: rgba(232,196,106,0.28); border: 1px solid rgba(232,196,106,0.45);
  }
  .abtn {
    position: absolute; pointer-events: auto; width: 62px; height: 62px; border-radius: 50%;
    background: rgba(20,16,26,0.5); border: 1px solid rgba(232,196,106,0.3);
    color: var(--ink); font-size: 11px; display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.25;
  }
  .abtn:active { background: rgba(232,196,106,0.3); }
  #bA { right: 16px; bottom: 26px; }
  #bB { right: 84px; bottom: 62px; }
  #bC { right: 16px; bottom: 98px; width: 48px; height: 48px; font-size: 10px; }

  /* ---------- overlay UI ---------- */
  #ui {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(4,3,8,0.62);
    padding: 10px; overflow: auto;
  }
  #ui.on { display: flex; }
  .panel {
    width: min(560px, 100%); max-height: 100%; overflow: auto;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 18px 60px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.03);
    padding: 16px 16px 14px; animation: pop 0.22s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: none; } }
  .panel h2 {
    font-size: 15px; letter-spacing: 0.2em; color: var(--gold); font-weight: 700;
    display: flex; align-items: center; gap: 8px; margin-bottom: 3px;
  }
  .panel h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .panel .sub { font-size: 11px; color: var(--dim); line-height: 1.8; margin-bottom: 12px; }
  .panel p { font-size: 12.5px; line-height: 1.95; color: var(--ink); }
  .panel p.q { color: var(--dim); font-size: 11.5px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab {
    font-size: 11px; padding: 5px 11px; border: 1px solid rgba(255,255,255,0.12);
    color: var(--dim); background: rgba(255,255,255,0.02); cursor: pointer;
  }
  .tab.on { color: #12100a; background: var(--gold); border-color: var(--gold); font-weight: 700; }

  .list { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 12px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.022); font-size: 12px;
  }
  .row .ico {
    width: 24px; height: 24px; flex: none; image-rendering: pixelated;
    background-repeat: no-repeat; background-position: center; background-size: 24px 24px;
  }
  .row .nm { flex: 1; line-height: 1.5; }
  .row .nm small { display: block; color: var(--dim); font-size: 10.5px; letter-spacing: 0.04em; }
  .row .pr { color: var(--gold); font-size: 12px; white-space: nowrap; }
  .row.rar1 { border-color: rgba(140,200,255,0.3); }
  .row.rar2 { border-color: rgba(232,196,106,0.45); background: rgba(232,196,106,0.05); }
  .row.rar3 { border-color: rgba(226,120,220,0.5); background: rgba(226,120,220,0.06); }
  .row.locked { opacity: 0.42; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 120px; text-align: center; cursor: pointer;
    padding: 10px 12px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--ink); border: 1px solid rgba(232,196,106,0.35); background: rgba(232,196,106,0.07);
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: rgba(232,196,106,0.16); }
  .btn:active { transform: translateY(1px); }
  .btn.pri { background: var(--gold); color: #17130a; border-color: var(--gold); }
  .btn.pri:hover { background: #f4d789; }
  .btn.sm { flex: none; min-width: 0; padding: 5px 12px; font-size: 11px; font-weight: 600; }
  .btn.dis { opacity: 0.35; pointer-events: none; }
  .btn.warn { border-color: rgba(180,65,58,0.5); background: rgba(180,65,58,0.12); color: #ffc4bd; }

  .stat { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--dim); margin-bottom: 10px; }
  .stat b { color: var(--gold); font-weight: 700; }
  .note { font-size: 10.5px; color: var(--dim); line-height: 1.9; margin-top: 10px; }
  .hr { height: 1px; background: var(--line); margin: 12px 0; }
  .center { text-align: center; }
  .big { font-size: 26px; color: var(--gold); font-weight: 800; letter-spacing: 0.06em; }
  .kbd {
    display: inline-block; padding: 1px 6px; margin: 0 2px; font-size: 10.5px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: var(--ink);
  }
  .qbar { height: 4px; background: rgba(255,255,255,0.08); margin-top: 4px; }
  .qbar i { display: block; height: 100%; background: var(--gold); }

</head>

};
let S = (() => {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
    const s = JSON.parse(JSON.stringify(DEFAULT_SAVE));
    for (const k in s) if (raw[k] !== undefined) {
      if (typeof s[k] === "object" && s[k] && !Array.isArray(s[k])) Object.assign(s[k], raw[k]);

let AC = null, muted = false;
function actx() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, delay) {
  const a = actx(); if (!a || muted) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), gn = a.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); gn.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, hp) {
  const a = actx(); if (!a || muted) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 700;
  const gn = a.createGain(); gn.gain.value = vol || 0.05;
  src.connect(f); f.connect(gn); gn.connect(a.destination); src.start();
}

function drawSpr(s, x, y, flip) {
  if (!s) return;
  x = Math.round(x); y = Math.round(y);
  if (flip) { g.save(); g.translate(x + s.width, y); g.scale(-1, 1); g.drawImage(s, 0, 0); g.restore(); }
  else g.drawImage(s, x, y);
}

const LOOT_POOL = ["sword", "sword", "shield", "helm", "helm", "armor", "staff", "coin", "coin", "ring", "gem", "potion"];

function makeItem(depth, boost) {
  boost = boost || 0;
  let id;
  if (chance(0.045 + depth * 0.006 + boost * 0.05)) id = "relic";
  else id = pick(LOOT_POOL);
  const def = ITEM_DEF[id];
  // 深いほど良い品が出る
  let q = 0;
  const roll = Math.random() * 100 - depth * 3.6 - boost * 22;
  if (roll < 2) q = 4; else if (roll < 12) q = 3; else if (roll < 30) q = 2; else if (roll < 62) q = 1; else q = 0;
  if (id === "potion" || id === "coin") q = clamp(q, 1, 2);
  const Q = QUAL[q];
  const val = Math.max(3, Math.round(def.base * Q.mul * (1 + depth * 0.2) * rnd(0.88, 1.16)));
  return { id, nm: Q.nm + def.nm, ico: def.ico, val, rar: Q.rar, q };
}
function makeNamed(id, q, depth) {
  const def = ITEM_DEF[id], Q = QUAL[q];
  return { id, nm: Q.nm + def.nm, ico: def.ico, val: Math.max(3, Math.round(def.base * Q.mul * (1 + depth * 0.2))), rar: Q.rar, q };
}

  map:   { nm: "墓場の図", ico: "map",   desc: "小地図が出る",   max: 1, cost: [200],               val: d => d ? "所持" : "未所持" }
};
const GOODS = [
  { id: "potion", nm: "薬",     ico: "potion", price: 34, desc: "体力を1つ回復。勇者に渡すこともできる" },
  { id: "smoke",  nm: "煙玉",   ico: "smoke",  price: 28, desc: "追跡を振り切り、しばらく見つかりにくくなる" },
  { id: "rope",   nm: "縄梯子", ico: "rope",   price: 46, desc: "その場から地上へ帰れる。荷はすべて持ち帰れる" }
];

const lampR = () => 3.6 + S.up.lamp * 1.1;
const bagSlots = () => 4 + S.up.bag * 2;
const walkSpd = () => 44 * (1 + (S.up.boot - 1) * 0.13);
const maxHearts = () => 2 + S.up.heart;
const lootTime = () => 1.5 - (S.up.glove - 1) * 0.32;
const priceMul = () => 1 + (S.up.eye - 1) * 0.12 + clamp(S.kind, 0, 12) * 0.012 - clamp(S.infamy, 0, 10) * 0.02;

/* ============================================================
   ダンジョン生成
   ============================================================ */
const MW = 48, MH = 34;
const T_WALL = 0, T_FLOOR = 1, T_EXIT = 2, T_ENTRY = 3;
const D_NONE = 0, D_GRAVE = 1, D_BONES = 2, D_PILLAR = 3, D_SCONCE = 4;

let map = new Uint8Array(MW * MH);
let deco = new Uint8Array(MW * MH);
let seen = new Uint8Array(MW * MH);
let light = new Float32Array(MW * MH);
let warm = new Float32Array(MW * MH);
let flow = new Int16Array(MW * MH);
let rooms = [], torches = [], corpses = [], mons = [], loose = [], parts = [], floaters = [];
let hero = null, floorCv = null;

const idx = (x, y) => y * MW + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const isWall = (x, y) => !inb(x, y) || map[idx(x, y)] === T_WALL;
const blocked = (x, y) => isWall(x, y) || deco[idx(x, y)] === D_GRAVE || deco[idx(x, y)] === D_PILLAR;
const blocksSight = (x, y) => isWall(x, y) || deco[idx(x, y)] === D_PILLAR;

function carveRoom(r) {
  for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) map[idx(x, y)] = T_FLOOR;
}
function carveH(x0, x1, y) { for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) if (inb(x, y)) map[idx(x, y)] = T_FLOOR; }
function carveV(y0, y1, x) { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) if (inb(x, y)) map[idx(x, y)] = T_FLOOR; }

function genLayout() {
  map.fill(T_WALL); deco.fill(D_NONE); seen.fill(0);
  rooms = []; torches = [];
  let tries = 0;
  while (rooms.length < 12 && tries < 260) {
    tries++;
    const w = ri(5, 10), h = ri(4, 7);
    const x = ri(2, MW - w - 3), y = ri(2, MH - h - 3);
    const r = { x, y, w, h, cx: Math.floor(x + w / 2), cy: Math.floor(y + h / 2) };
    let hit = false;
    for (const o of rooms) if (r.x < o.x + o.w + 2 && r.x + r.w + 2 > o.x && r.y < o.y + o.h + 2 && r.y + r.h + 2 > o.y) { hit = true; break; }
    if (hit) continue;
    carveRoom(r); rooms.push(r);
  }
  // 通路（順につなぐ + 余分な輪を数本）
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i - 1], b = rooms[i];
    if (chance(0.5)) { carveH(a.cx, b.cx, a.cy); carveV(a.cy, b.cy, b.cx); }
    else { carveV(a.cy, b.cy, a.cx); carveH(a.cx, b.cx, b.cy); }
  }
  for (let k = 0; k < 3; k++) {
    const a = pick(rooms), b = pick(rooms);
    if (a === b) continue;
    carveH(a.cx, b.cx, a.cy); carveV(a.cy, b.cy, b.cx);
  }
  // 飾り
  for (const r of rooms) {
    const n = ri(1, 3);
    for (let k = 0; k < n; k++) {
      const x = ri(r.x, r.x + r.w - 1), y = ri(r.y, r.y + r.h - 1);
      const t = Math.random();
      if (t < 0.42) deco[idx(x, y)] = D_GRAVE;
      else if (t < 0.75) deco[idx(x, y)] = D_BONES;
      else deco[idx(x, y)] = D_PILLAR;
    }
    // 壁掛けの燭台
    for (let k = 0, guard = 0; k < ri(1, 2) && guard < 20; guard++) {
      const x = ri(r.x, r.x + r.w - 1), y = r.y - 1;
      if (inb(x, y) && map[idx(x, y)] === T_WALL && deco[idx(x, y)] === D_NONE) {
        deco[idx(x, y)] = D_SCONCE; torches.push({ x, y, ph: rnd(0, 9) }); k++;
      }
    }
  }
}
function farthestRoom(from) {
  let best = rooms[0], bd = -1;
  for (const r of rooms) {
    const d = dist2(r.cx, r.cy, from.cx, from.cy);
    if (d > bd) { bd = d; best = r; }
  }
  return best;
}
function freeSpotIn(r, avoid) {
  for (let k = 0; k < 40; k++) {
    const x = ri(r.x, r.x + r.w - 1), y = ri(r.y, r.y + r.h - 1);
    if (blocked(x, y) || map[idx(x, y)] !== T_FLOOR) continue;
    if (avoid && avoid.some(a => Math.abs(a.tx - x) < 2 && Math.abs(a.ty - y) < 2)) continue;
    return { x, y };
  }
  return { x: r.cx, y: r.cy };
}

function pickHeroRecord() {
  const un = HEROES.map((h, i) => i).filter(i => S.diaries.indexOf(i) < 0);
  return un.length ? pick(un) : ri(0, HEROES.length - 1);
}

function genFloor(depth) {
  genLayout();
  corpses = []; mons = []; loose = []; parts = []; floaters = []; hero = null;
  const start = rooms[0];
  map[idx(start.cx, start.cy)] = T_ENTRY;
  const exitRoom = farthestRoom(start);
  const ex = freeSpotIn(exitRoom);
  map[idx(ex.x, ex.y)] = T_EXIT;

  const others = rooms.filter(r => r !== start);
  // 亡骸
  const nc = clamp(3 + Math.floor(depth / 2) + ri(0, 1), 3, 8);
  for (let i = 0; i < nc; i++) {
    const r = pick(others.length ? others : rooms);
    const p = freeSpotIn(r, corpses);
    const hi = pickHeroRecord();
    const items = [];
    const cnt = ri(1, 3);
    for (let k = 0; k < cnt; k++) items.push(makeItem(depth, 0));
    corpses.push({ tx: p.x, ty: p.y, x: p.x * TILE, y: p.y * TILE, hi, items, looted: false, prog: 0, fresh: false, name: HEROES[hi].n });
  }
  // 王墓（深層）
  if (depth >= 10) {
    let kr = rooms[0], bd = -1;
    for (const r of others) {
      const d = dist2(r.cx, r.cy, start.cx, start.cy) + dist2(r.cx, r.cy, exitRoom.cx, exitRoom.cy);
      if (d > bd && r !== exitRoom) { bd = d; kr = r; }
    }
    const p = freeSpotIn(kr, corpses);
    const items = [S.stats.relic ? makeNamed("relic", 4, depth) : makeNamed("holy", 4, depth), makeItem(depth, 1), makeItem(depth, 1)];
    corpses.push({ tx: p.x, ty: p.y, x: p.x * TILE, y: p.y * TILE, hi: -1, items, looted: false, prog: 0, fresh: false, name: "勇者王", king: true });
    spawnMon("king", kr.cx, kr.cy);
  }
  // 魔物
  const avail = Object.keys(MTYPE).filter(k => MTYPE[k].w > 0 && MTYPE[k].minD <= depth);
  const nm = 3 + Math.floor(depth * 0.95);
  for (let i = 0; i < nm; i++) {
    const r = pick(others.length ? others : rooms);
    const p = freeSpotIn(r, mons);
    const bag = [];
    for (const k of avail) for (let w = 0; w < MTYPE[k].w + (MTYPE[k].minD >= 4 ? Math.floor(depth / 4) : 0); w++) bag.push(k);
    spawnMon(pick(bag), p.x, p.y);
  }
  // 生きている勇者
  if (depth >= 2 && chance(0.45)) {
    const r = pick(others.length ? others : rooms);
    const p = freeSpotIn(r, mons);
    hero = {
      x: p.x * TILE, y: p.y * TILE, hp: 16, maxHp: 16, spd: 30, state: "fight", anim: 0, dir: 1,
      name: pick(HERO_NAMES), talk: pick(HERO_TALK), hi: pickHeroRecord(),
      gear: [makeItem(depth, 0.7), makeItem(depth, 0.7)], cd: 0, met: false, atk: 0, hurt: 0, follow: 0
    };
  }
  return { start, exitRoom };
}
function spawnMon(type, tx, ty) {
  const t = MTYPE[type];
  mons.push({
    type, x: tx * TILE, y: ty * TILE, hp: t.hp, state: "patrol", dirx: pick([-1, 0, 1]), diry: pick([-1, 0, 1]),
    cd: rnd(0, 1.4), anim: rnd(0, 9), lx: 0, ly: 0, alert: 0, hurt: 0, ph: rnd(0, 9), dead: 0
  });
}

/* 視線・経路 */
function los(x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy, x = x0, y = y0, guard = 0;
  while (guard++ < 80) {
    if (x === x1 && y === y1) return true;
    const e2 = err * 2;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
    if (x === x1 && y === y1) return true;
    if (blocksSight(x, y)) return false;
  }
  return false;
}
const fq = new Int32Array(MW * MH);
function computeFlow(sx, sy) {
  flow.fill(-1);
  if (!inb(sx, sy)) return;
  let head = 0, tail = 0;
  flow[idx(sx, sy)] = 0; fq[tail++] = idx(sx, sy);
  while (head < tail) {
    const c = fq[head++], cx = c % MW, cy = (c / MW) | 0, d = flow[c];
    for (let k = 0; k < 4; k++) {
      const nx = cx + [1, -1, 0, 0][k], ny = cy + [0, 0, 1, -1][k];
      if (!inb(nx, ny)) continue;
      const n = idx(nx, ny);
      if (flow[n] >= 0 || blocked(nx, ny)) continue;
      flow[n] = d + 1; fq[tail++] = n;
    }
  }
}

/* ============================================================
   ゲーム状態
   ============================================================ */
let scene = "title";          // title | town | dungeon | result
let run = null;
let time = 0, shake = 0, flash = 0, fade = 0, fadeDir = 0, fadeCb = null;
let camx = 0, camy = 0;
let uiOpen = false, uiKind = "";
const P = { x: 0, y: 0, dir: "s", face: 1, anim: 0, hp: 3, invul: 0, lamp: true, smoke: 0, looting: null, lootT: 0, stepT: 0, hitcd: 0 };
const keys = {};
let touchVec = { x: 0, y: 0 }, touchA = false, touchB = false;

function addPart(x, y, o) {
  parts.push(Object.assign({ x, y, vx: 0, vy: 0, life: 0.5, max: 0.5, col: "#fff", sz: 1, type: "dot" }, o));
}
function floatTxt(x, y, txt, col) { floaters.push({ x, y, txt, col: col || "#e8c46a", life: 1.4 }); }
function toast(txt, cls) {
  const d = document.createElement("div");
  d.textContent = txt; if (cls) d.className = cls;
  TOAST.appendChild(d);
  setTimeout(() => { d.style.transition = "opacity .4s"; d.style.opacity = "0"; setTimeout(() => d.remove(), 420); }, 2200);
  while (TOAST.children.length > 5) TOAST.firstChild.remove();
}
function doFade(dir, cb) { fadeDir = dir; fadeCb = cb || null; if (dir > 0) fade = 0; }

/* ---------- 進行 ---------- */
function startRun(depth) {
  const info = genFloor(depth);
  prerenderFloor();
  run = {
    depth, bag: [], t: 0, escaped: false, exitAsk: 0, heroAsk: 0,
    avengerT: (S.infamy >= 3 && chance(clamp(S.infamy * 0.16, 0, 0.7))) ? rnd(18, 50) : -1,
    kills: 0, looted: 0
  };
  P.x = info.start.cx * TILE + 8; P.y = info.start.cy * TILE + 8;
  P.dir = "s"; P.face = 1; P.hp = maxHearts(); P.invul = 0; P.lamp = true;
  P.smoke = 0; P.looting = null; P.lootT = 0;
  camx = clamp(P.x - VW / 2, 0, MW * TILE - VW); camy = clamp(P.y - VH / 2, 0, MH * TILE - VH);
  S.stats.runs++; if (depth > S.deepest) S.deepest = depth;
  save();
  scene = "dungeon"; closeUI();
  SFX.descend();
}
function bagFull() { return run.bag.length >= bagSlots(); }
function addToBag(it) {
  if (bagFull()) return false;
  run.bag.push(it); S.stats.loot++;
  return true;
}
function dropItem(it, x, y) {
  loose.push({ it, x, y, vx: rnd(-24, 24), vy: rnd(-30, -6), t: 0, pick: 0.5 });
}
function endRun(kind) {
  if (!run || run.escaped) return;
  run.escaped = true;
  let kept = run.bag.slice(), lost = [];
  if (kind === "faint") {
    kept = []; lost = [];
    for (const it of run.bag) (chance(0.5) ? kept : lost).push(it);
    S.stats.faints++;
  } else S.stats.escapes++;
  for (const it of kept) S.stash.push(it);
  save();
  const depth = run.depth;
  doFade(1, () => { showResult(kind, kept, lost, depth); });
  if (kind === "faint") SFX.faint(); else SFX.escape();
}

/* ---------- 傷つく ---------- */
function hitPlayer(sx, sy, hard) {
  if (P.invul > 0 || run.escaped) return;
  P.hp--; P.invul = 1.7; shake = 7; flash = 0.5;
  SFX.hurt();
  const a = Math.atan2(P.y - sy, P.x - sx);
  P.x += Math.cos(a) * 12; P.y += Math.sin(a) * 12;
  if (!canStand(P.x, P.y)) { P.x -= Math.cos(a) * 12; P.y -= Math.sin(a) * 12; }
  for (let i = 0; i < 10; i++) addPart(P.x, P.y, { vx: rnd(-40, 40), vy: rnd(-50, 10), life: 0.5, max: 0.5, col: "#b4413a", sz: 2 });
  if (run.bag.length && (hard || chance(0.55))) {
    const i = ri(0, run.bag.length - 1), it = run.bag.splice(i, 1)[0];
    dropItem(it, P.x, P.y);
    floatTxt(P.x, P.y - 14, it.nm + " を落とした", "#ff9a92");
  }
  P.looting = null; P.lootT = 0;
  if (P.hp <= 0) endRun("faint");
}
function canStand(x, y) {
  const r = 5;
  return !blocked(Math.floor((x - r) / TILE), Math.floor((y - r) / TILE)) &&
         !blocked(Math.floor((x + r) / TILE), Math.floor((y - r) / TILE)) &&
         !blocked(Math.floor((x - r) / TILE), Math.floor((y + r) / TILE)) &&
         !blocked(Math.floor((x + r) / TILE), Math.floor((y + r) / TILE));
}

/* ---------- 道具を使う ---------- */
function useSmoke() {
  if (S.inv.smoke <= 0) { SFX.deny(); toast("煙玉がない", "bad"); return; }
  S.inv.smoke--; save(); SFX.smoke();
  P.smoke = 7;
  for (const m of mons) if (dist2(m.x, m.y, P.x, P.y) < (TILE * 7) ** 2) { m.state = "patrol"; m.alert = 0; }
  for (let i = 0; i < 26; i++) addPart(P.x, P.y, { vx: rnd(-60, 60), vy: rnd(-60, 60), life: rnd(0.6, 1.4), max: 1.4, col: "#9aa2b8", sz: 3 });
  floatTxt(P.x, P.y - 16, "煙にまぎれた", "#cfd6e6");
}
function useRope() {
  if (S.inv.rope <= 0) { SFX.deny(); toast("縄梯子がない", "bad"); return; }
  S.inv.rope--; save();
  floatTxt(P.x, P.y - 16, "縄梯子をのぼる", "#e8c46a");
  endRun("rope");
}
function usePotion() {
  if (S.inv.potion <= 0) { SFX.deny(); toast("薬がない", "bad"); return; }
  if (P.hp >= maxHearts()) { SFX.deny(); toast("傷はない", "bad"); return; }
  S.inv.potion--; P.hp++; save(); SFX.get_();
  for (let i = 0; i < 12; i++) addPart(P.x, P.y, { vx: rnd(-25, 25), vy: rnd(-45, -10), life: 0.7, max: 0.7, col: "#ff8a7a", sz: 2 });
  floatTxt(P.x, P.y - 16, "傷がふさがった", "#ff8a7a");
}

/* ============================================================
   更新
   ============================================================ */
function inputVec() {
  let ix = 0, iy = 0;
  if (keys["arrowleft"] || keys["a"]) ix -= 1;
  if (keys["arrowright"] || keys["d"]) ix += 1;
  if (keys["arrowup"] || keys["w"]) iy -= 1;
  if (keys["arrowdown"] || keys["s"]) iy += 1;
  ix += touchVec.x; iy += touchVec.y;
  const m = Math.hypot(ix, iy);
  return m > 1 ? { x: ix / m, y: iy / m, m: 1 } : { x: ix, y: iy, m };
}
const actionHeld = () => !!(keys["z"] || keys[" "] || keys["enter"] || touchA);

function updatePlayer(dt) {
  const v = inputVec();
  const moving = v.m > 0.06;
  // 回収中は動けない
  if (P.looting) {
    if (moving) { P.looting.prog = 0; P.looting = null; }
    else if (!actionHeld()) { P.looting.prog = Math.max(0, P.looting.prog - dt * 1.4); if (P.looting.prog <= 0) P.looting = null; }
    else {
      const c = P.looting;
      c.prog += dt / lootTime();
      P.lootT += dt;
      if (P.lootT > 0.42) { // 物音
        P.lootT = 0;
        addPart(P.x, P.y - 6, { life: 0.8, max: 0.8, type: "ring", col: "#e8c46a", sz: 3 });
        for (const m of mons) {
          if (m.dead > 0 || m.state === "chase") continue;
          if (dist2(m.x, m.y, P.x, P.y) < (TILE * 5.5) ** 2) { m.state = "search"; m.lx = Math.floor(P.x / TILE); m.ly = Math.floor(P.y / TILE); m.alert = 0.6; }
        }
      }
      if (c.prog >= 1) finishLoot(c);
    }
  }
  if (!P.looting) {
    const sp = walkSpd() * (P.smoke > 0 ? 1.06 : 1);
    if (moving) {
      const nx = P.x + v.x * sp * dt, ny = P.y + v.y * sp * dt;
      if (canStand(nx, P.y)) P.x = nx;
      if (canStand(P.x, ny)) P.y = ny;
      P.anim += dt * 7.5;
      if (Math.abs(v.x) > Math.abs(v.y)) { P.dir = "e"; P.face = v.x < 0 ? -1 : 1; }
      else P.dir = v.y < 0 ? "n" : "s";
      P.stepT += dt * sp;
      if (P.stepT > 26) { P.stepT = 0; SFX.step(); }
    } else P.anim = 0;
  }
  P.invul = Math.max(0, P.invul - dt);
  P.smoke = Math.max(0, P.smoke - dt);

  // 落ちている品を拾う
  for (let i = loose.length - 1; i >= 0; i--) {
    const l = loose[i];
    l.t += dt; l.pick -= dt;
    l.x += l.vx * dt; l.y += l.vy * dt; l.vy += 160 * dt;
    if (l.vy > 0 && l.t > 0.28) { l.vy = 0; l.vx *= 0.6; }
    if (l.pick <= 0 && dist2(l.x, l.y, P.x, P.y) < 132) {
      if (addToBag(l.it)) {
        loose.splice(i, 1); SFX.get_();
        floatTxt(P.x, P.y - 16, l.it.nm, "#e8c46a");
      }
    }
  }
  // 亡骸に触れる
  const near = nearestCorpse();
  if (near && actionHeld() && !P.looting && !uiOpen) {
    P.looting = near; P.lootT = 0.4;
  }
  // 出口
  const ptx = Math.floor(P.x / TILE), pty = Math.floor(P.y / TILE);
  if (map[idx(ptx, pty)] === T_EXIT && run.exitAsk <= 0 && !uiOpen) {
    run.exitAsk = 1;
    askExit();
  } else if (map[idx(ptx, pty)] !== T_EXIT) run.exitAsk = 0;
}
function nearestCorpse() {
  let best = null, bd = 220;
  for (const c of corpses) {
    if (c.looted) continue;
    const d = dist2(c.x + 8, c.y + 10, P.x, P.y);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
function finishLoot(c) {
  c.looted = true; P.looting = null; run.looted++;
  SFX.loot();
  let got = 0, full = false;
  for (const it of c.items) {
    if (addToBag(it)) { got++; floatTxt(c.x + 8, c.y - 4 - got * 9, it.nm + " +" + it.val, it.rar >= 2 ? "#e29ce0" : "#e8c46a"); }
    else { full = true; dropItem(it, c.x + 8, c.y + 8); }
  }
  if (full) toast("背負い袋がいっぱいだ", "bad");
  if (c.hi >= 0 && S.diaries.indexOf(c.hi) < 0) {
    S.diaries.push(c.hi); save();
    toast("手記をひろった ― " + HEROES[c.hi].n, "good");
  }
  for (let i = 0; i < 14; i++) addPart(c.x + 8, c.y + 8, { vx: rnd(-30, 30), vy: rnd(-50, -6), life: rnd(0.4, 0.9), max: 0.9, col: "#e8c46a", sz: 1 });
  if (c.king) { S.stats.relic++; save(); }
}

/* ---------- 魔物 ---------- */
let flowT = 0;
function updateMons(dt) {
  flowT -= dt;
  const needFlow = mons.some(m => m.dead <= 0 && (m.state === "chase")) || (hero && hero.state === "hostile");
  if (needFlow && flowT <= 0) { computeFlow(Math.floor(P.x / TILE), Math.floor(P.y / TILE)); flowT = 0.22; }

  const sightMul = (P.lamp ? 1 : 0.5) * (P.smoke > 0 ? 0.35 : 1);
  for (const m of mons) {
    m.anim += dt;
    m.alert = Math.max(0, m.alert - dt);
    m.hurt = Math.max(0, m.hurt - dt);
    if (m.dead > 0) { m.dead -= dt; continue; }
    const t = MTYPE[m.type];
    const mtx = Math.floor(m.x / TILE), mty = Math.floor(m.y / TILE);
    const ptx = Math.floor(P.x / TILE), pty = Math.floor(P.y / TILE);
    const dTiles = Math.hypot(m.x - P.x, m.y - P.y) / TILE;

    // 感知
    if (!run.escaped && P.hp > 0 && dTiles <= t.sight * sightMul && (t.phase || los(mtx, mty, ptx, pty))) {
      if (m.state !== "chase") { m.alert = 1.1; SFX.alert(); }
      m.state = "chase"; m.lost = 0; m.lx = ptx; m.ly = pty;
    } else if (m.state === "chase") {
      m.lost = (m.lost || 0) + dt;
      if (m.lost > 2.4) { m.state = "search"; m.cd = 3; }
    }

    let dx = 0, dy = 0, sp = t.spd;
    if (m.state === "chase") {
      // 近くて見えているときは直接、遠いときは経路をたどる
      const direct = t.phase || (dTiles < 2.7 && los(mtx, mty, ptx, pty));
      let step = null;
      if (!direct) step = flowStep(mtx, mty);
      if (step) { dx = step.x * TILE + 8 - m.x; dy = step.y * TILE + 8 - m.y; }
      else { dx = P.x - m.x; dy = P.y - m.y; }
      const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      sp *= 1.15;
    } else if (m.state === "search") {
      m.cd -= dt;
      const tx = m.lx * TILE + 8, ty = m.ly * TILE + 8;
      if (m.cd <= 0 || dist2(tx, ty, m.x, m.y) < 90) { m.state = "patrol"; m.cd = rnd(0.5, 1.4); }
      else { const a = Math.atan2(ty - m.y, tx - m.x); dx = Math.cos(a); dy = Math.sin(a); sp *= 0.9; }
    } else {
      m.cd -= dt;
      if (m.cd <= 0) {
        m.cd = rnd(0.7, 2.2) / (t.wander || 1);
        if (chance(0.25)) { m.dirx = 0; m.diry = 0; }
        else { const a = rnd(0, Math.PI * 2); m.dirx = Math.cos(a); m.diry = Math.sin(a); }
      }
      dx = m.dirx; dy = m.diry; sp *= 0.62;
    }
    if (t.erratic && m.state !== "patrol") {
      dx += Math.cos(m.anim * 6 + m.ph) * 0.55; dy += Math.sin(m.anim * 5.3 + m.ph) * 0.55;
      const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    }
    const nx = m.x + dx * sp * dt, ny = m.y + dy * sp * dt;
    if (t.phase) {
      if (nx > 8 && nx < MW * TILE - 8) m.x = nx;
      if (ny > 8 && ny < MH * TILE - 8) m.y = ny;
      if (isWall(Math.floor(m.x / TILE), Math.floor(m.y / TILE)) && m.state === "patrol") {
        const a = Math.atan2(MH * TILE / 2 - m.y, MW * TILE / 2 - m.x); m.dirx = Math.cos(a); m.diry = Math.sin(a);
      }
    } else {
      if (monFree(nx, m.y)) m.x = nx; else m.dirx = -m.dirx, m.cd = Math.min(m.cd, 0.2);
      if (monFree(m.x, ny)) m.y = ny; else m.diry = -m.diry, m.cd = Math.min(m.cd, 0.2);
    }

    // 接触
    if (!run.escaped && P.hp > 0 && dist2(m.x, m.y, P.x, P.y) < 136) hitPlayer(m.x, m.y, false);

    // 勇者との斬り合い
    if (hero && hero.hp > 0 && hero.state !== "hostile" && dist2(m.x, m.y, hero.x, hero.y) < 290) {
      m.hp -= dt * 6.5; m.hurt = 0.15; hero.hp -= dt * 3.4; hero.hurt = 0.15; hero.atk = 0.25;
      if (chance(dt * 6)) { SFX.slash(); addPart((m.x + hero.x) / 2, (m.y + hero.y) / 2 - 4, { vx: rnd(-40, 40), vy: rnd(-40, 10), life: 0.3, max: 0.3, col: "#ffe7a8", sz: 2 }); }
      if (m.hp <= 0) killMon(m, true);

}
function monFree(x, y) {
  const r = 5;
  return !blocked(Math.floor((x - r) / TILE), Math.floor((y - r) / TILE)) &&
         !blocked(Math.floor((x + r) / TILE), Math.floor((y - r) / TILE)) &&
         !blocked(Math.floor((x - r) / TILE), Math.floor((y + r) / TILE)) &&
         !blocked(Math.floor((x + r) / TILE), Math.floor((y + r) / TILE));
}
function flowStep(x, y) {
  const c = flow[idx(x, y)];
  if (c < 0) return null;
  let best = null, bv = c;
  for (let k = 0; k < 8; k++) {
    const nx = x + [1, -1, 0, 0, 1, 1, -1, -1][k], ny = y + [0, 0, 1, -1, 1, -1, 1, -1][k];
    if (!inb(nx, ny)) continue;
    if (k >= 4 && (blocked(nx, y) || blocked(x, ny))) continue;
    const v = flow[idx(nx, ny)];
    if (v >= 0 && v < bv) { bv = v; best = { x: nx, y: ny }; }
  }

}
function killMon(m, byHero) {
  m.dead = 0.45; m.state = "dead";
  SFX.hurt();
  for (let i = 0; i < 16; i++) addPart(m.x, m.y, { vx: rnd(-50, 50), vy: rnd(-60, 10), life: rnd(0.3, 0.8), max: 0.8, col: "#6f8f5a", sz: 2 });
  if (chance(0.35)) dropItem(makeNamed("gem", chance(0.3) ? 2 : 1, run.depth), m.x, m.y);
  if (byHero) run.kills++;
}

/* ---------- 生きている勇者 ---------- */
function updateHero(dt) {
  if (run.avengerT > 0) {
    run.avengerT -= dt;
    if (run.avengerT <= 0 && !hero) {
      const r = pick(rooms);
      hero = {
        x: r.cx * TILE + 8, y: r.cy * TILE + 8, hp: 26, maxHp: 26, spd: 40, state: "hostile", anim: 0, dir: 1,
        name: pick(HERO_NAMES), talk: "", hi: pickHeroRecord(), gear: [makeItem(run.depth, 1)], cd: 0, met: true, atk: 0, hurt: 0, follow: 0, avenger: true
      };
      toast("誰かが降りてきた……", "bad");
      SFX.alert();
    }
  }
  if (!hero) return;
  const h = hero;
  h.anim += dt; h.hurt = Math.max(0, h.hurt - dt); h.atk = Math.max(0, h.atk - dt);
  if (h.hp <= 0) { heroDies(); return; }

  let tx = null, ty = null, sp = h.spd;
  if (h.state === "hostile") {
    const step = flowStep(Math.floor(h.x / TILE), Math.floor(h.y / TILE));
    if (step) { tx = step.x * TILE + 8; ty = step.y * TILE + 8; } else { tx = P.x; ty = P.y; }
    sp = 44;
    if (!run.escaped && dist2(h.x, h.y, P.x, P.y) < 150) {
      if (P.invul <= 0) {
        hitPlayer(h.x, h.y, true);
        if (h.avenger) floatTxt(h.x, h.y - 18, "この盗人め！", "#ff9a92");
      }
    }
  } else if (h.state === "follow") {
    h.follow -= dt;
    if (h.follow <= 0) { h.state = "fight"; }
    const m = nearestMon(h, 5.5);
    if (m) { tx = m.x; ty = m.y; }
    else if (dist2(h.x, h.y, P.x, P.y) > 900) { tx = P.x; ty = P.y; }
  } else {
    const m = nearestMon(h, 7);
    if (m) { tx = m.x; ty = m.y; sp = h.spd * 1.15; }
    else {
      h.cd -= dt;
      if (h.cd <= 0) { h.cd = rnd(1, 2.6); const r = pick(rooms); h.wx = r.cx * TILE + 8; h.wy = r.cy * TILE + 8; }
      tx = h.wx; ty = h.wy; sp = h.spd * 0.7;
    }
  }
  if (tx !== null && tx !== undefined) {
    const a = Math.atan2(ty - h.y, tx - h.x);
    const nx = h.x + Math.cos(a) * sp * dt, ny = h.y + Math.sin(a) * sp * dt;
    if (monFree(nx, h.y)) h.x = nx;
    if (monFree(h.x, ny)) h.y = ny;
    h.dir = Math.cos(a) < 0 ? -1 : 1;
  }
  // 出会い
  if (!h.met && h.state !== "hostile" && dist2(h.x, h.y, P.x, P.y) < 620 && !uiOpen && !run.escaped) {
    h.met = true; askHero();
  }
}
function nearestMon(from, maxTiles) {
  let best = null, bd = (maxTiles * TILE) ** 2;

    if (m.dead > 0) continue;
    const d = dist2(m.x, m.y, from.x, from.y);
    if (d < bd) { bd = d; best = m; }
  }
  return best;
}
function heroDies() {
  const h = hero;
  SFX.heroDie();
  const items = h.gear.slice();
  items.push(makeItem(run.depth, 0.8));
  const tx = clamp(Math.floor(h.x / TILE), 1, MW - 2), ty = clamp(Math.floor(h.y / TILE), 1, MH - 2);
  corpses.push({
    tx, ty, x: tx * TILE, y: ty * TILE, hi: h.hi, items, looted: false, prog: 0, fresh: true,
    name: h.name
  });
  for (let i = 0; i < 20; i++) addPart(h.x, h.y, { vx: rnd(-40, 40), vy: rnd(-60, 0), life: rnd(0.4, 1.1), max: 1.1, col: "#b4413a", sz: 2 });
  if (!h.avenger) {
    S.stats.watched++; save();
    toast("勇者 " + h.name + " は事切れた", "bad");
    floatTxt(h.x, h.y - 20, "……あとは、頼む", "#e6e0d0");
  } else toast("復讐者は倒れた", "good");
  hero = null;
}

/* ============================================================
   描画
   ============================================================ */
function prerenderFloor() {
  floorCv = document.createElement("canvas");
  floorCv.width = MW * TILE; floorCv.height = MH * TILE;
  const c = floorCv.getContext("2d");
  c.imageSmoothingEnabled = false;
  c.fillStyle = "#08070d"; c.fillRect(0, 0, floorCv.width, floorCv.height);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const t = map[idx(x, y)], px = x * TILE, py = y * TILE;
    if (t === T_WALL) {
      c.fillStyle = "#15121d"; c.fillRect(px, py, TILE, TILE);
      for (let r = 0; r < 4; r++) {
        const off = (r % 2) ? 8 : 0;
        for (let b = -1; b < 2; b++) {
          const bx = off + b * 8;
          if (bx < 0 || bx >= 16) continue;
          const h = hash(x * 7 + b + r * 3, y * 11 + r);
          c.fillStyle = h < 0.45 ? "#282133" : h < 0.85 ? "#2c2539" : "#332b41";
          c.fillRect(px + bx, py + r * 4, 7, 3);
        }
      }
      if (!isWall(x, y + 1)) { // 床に面した壁の下辺
        c.fillStyle = "#39324a"; c.fillRect(px, py + 12, TILE, 1);
        c.fillStyle = "#191524"; c.fillRect(px, py + 13, TILE, 3);
      }
    } else {
      c.fillStyle = "#1a1725"; c.fillRect(px, py, TILE, TILE);
      for (let sy = 0; sy < 2; sy++) for (let sx = 0; sx < 2; sx++) {
        const h = hash(x * 2 + sx, y * 2 + sy);
        c.fillStyle = h < 0.34 ? "#332c44" : h < 0.7 ? "#2d2739" : "#3a3249";
        c.fillRect(px + sx * 8, py + sy * 8, 7, 7);
        if (h > 0.93) { c.fillStyle = "#3b3450"; c.fillRect(px + sx * 8 + 1, py + sy * 8 + 1, 3, 1); }
        if (h < 0.05) { c.fillStyle = "#3d5a3c"; c.fillRect(px + sx * 8 + 2, py + sy * 8 + 3, 3, 2); }
        if (h > 0.86 && h < 0.9) { c.fillStyle = "#211c2b"; c.fillRect(px + sx * 8 + 2, py + sy * 8 + 4, 4, 1); }
      }
    }
  }
  // 壁の下に落ちる影
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (map[idx(x, y)] === T_WALL) continue;
    if (isWall(x, y - 1)) { c.fillStyle = "rgba(0,0,0,0.42)"; c.fillRect(x * TILE, y * TILE, TILE, 3); c.fillStyle = "rgba(0,0,0,0.2)"; c.fillRect(x * TILE, y * TILE + 3, TILE, 2); }
    if (isWall(x - 1, y)) { c.fillStyle = "rgba(0,0,0,0.25)"; c.fillRect(x * TILE, y * TILE, 3, TILE); }
  }
  // 飾り
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const d = deco[idx(x, y)];
    if (!d) continue;
    const px = x * TILE, py = y * TILE;
    if (d === D_GRAVE) drawTo(c, SPR.grave, px, py);
    else if (d === D_BONES) drawTo(c, SPR.bones, px, py);
    else if (d === D_PILLAR) drawTo(c, SPR.pillar, px, py);
    else if (d === D_SCONCE) drawTo(c, SPR.sconce, px, py);
  }
}
function drawTo(c, s, x, y) { c.drawImage(s, Math.round(x), Math.round(y)); }

function computeLight(tx0, ty0, tx1, ty1) {
  const pr = (P.lamp ? lampR() : 1.7) * (1 + Math.sin(time * 8.3) * 0.025 + Math.sin(time * 21) * 0.015);
  const px = P.x / TILE, py = P.y / TILE;
  const ptx = Math.floor(P.x / TILE), pty = Math.floor(P.y / TILE);
  const near = [];
  for (const t of torches) if (Math.abs(t.x - px) < 9 && Math.abs(t.y - py) < 9) near.push(t);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (!inb(tx, ty)) continue;
    const i = idx(tx, ty);
    let l = 0, w = 0;
    const d = Math.hypot(tx + 0.5 - px, ty + 0.5 - py);
    if (d <= pr && los(ptx, pty, tx, ty)) l = clamp(1.12 - Math.pow(d / pr, 2.1), 0, 1);
    const dp = Math.hypot(tx + 0.5 - px, ty + 0.5 - py);
    const inView = dp < 11 && los(ptx, pty, tx, ty);
    for (const t of near) {
      if (!inView) break;
      const dd = Math.hypot(tx - t.x, ty - t.y);
      if (dd > 4.6) continue;
      if (!los(t.x, t.y, tx, ty)) continue;
      const f = clamp(1 - dd / 4.6, 0, 1) * (0.8 + 0.2 * Math.sin(time * 6.7 + t.ph));
      if (f > w) w = f;
    }
    l = Math.max(l, w * 0.95);
    light[i] = l; warm[i] = w;
    if (l > 0.13) seen[i] = 1;
  }
}

function wtext(txt, x, y, col, sz, align) {
  const s = SCALE * DPR;
  fg.font = "600 " + Math.max(9, Math.round((sz || 10) * s * 0.62)) + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif';
  fg.textAlign = align || "center"; fg.textBaseline = "middle";
  fg.lineWidth = Math.max(2, 2.4 * s / 3); fg.lineJoin = "round";
  fg.strokeStyle = "rgba(0,0,0,0.92)";
  const px = (x + viewOX) * s, py = (y + viewOY) * s;
  fg.strokeText(txt, px, py); fg.fillStyle = col; fg.fillText(txt, px, py);
}
function pixText(txt, x, y, col, align, size) {
  g.font = (size || 10) + 'px "MS Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",monospace';
  g.textAlign = align || "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(0,0,0,0.85)";
  g.fillText(txt, Math.round(x) + 1, Math.round(y) + 1);
  g.fillStyle = col;
  g.fillText(txt, Math.round(x), Math.round(y));
}

/* 頭上の記号（！ ？）をドットで描く */
function mark(x, y, kind, col) {
  x = Math.round(x) - 3; y = Math.round(y) - 4;
  g.fillStyle = "rgba(0,0,0,0.55)";
  g.fillRect(x - 1, y - 1, 8, 10);
  g.fillStyle = col;
  if (kind === "!") { g.fillRect(x + 2, y, 2, 5); g.fillRect(x + 2, y + 6, 2, 2); }
  else {
    g.fillRect(x + 1, y, 4, 2); g.fillRect(x + 4, y + 2, 2, 2);
    g.fillRect(x + 2, y + 4, 2, 2); g.fillRect(x + 2, y + 7, 2, 2);
  }
}

function drawDungeon(dt) {
  const tgx = clamp(P.x - VW / 2, 0, MW * TILE - VW), tgy = clamp(P.y - VH / 2, 0, MH * TILE - VH);
  const k = 1 - Math.exp(-dt * 9);
  camx = lerp(camx, tgx, k); camy = lerp(camy, tgy, k);
  const sx = shake > 0 ? rnd(-shake, shake) : 0, sy = shake > 0 ? rnd(-shake, shake) : 0;
  const ox = Math.round(-camx + sx), oy = Math.round(-camy + sy);
  viewOX = ox; viewOY = oy;
  const tx0 = Math.floor(camx / TILE) - 1, ty0 = Math.floor(camy / TILE) - 1;
  const tx1 = tx0 + Math.ceil(VW / TILE) + 2, ty1 = ty0 + Math.ceil(VH / TILE) + 2;
  computeLight(tx0, ty0, tx1, ty1);

  g.fillStyle = "#05040a"; g.fillRect(0, 0, VW, VH);
  g.save(); g.translate(ox, oy);
  if (floorCv) g.drawImage(floorCv, 0, 0);

  // 出入口
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (!inb(tx, ty)) continue;
    const t = map[idx(tx, ty)];
    if (t === T_EXIT || t === T_ENTRY) {
      drawSpr(SPR.ladder, tx * TILE, ty * TILE);
      if (t === T_EXIT) {
        g.save(); g.globalCompositeOperation = "lighter";
        const a = 0.16 + 0.08 * Math.sin(time * 3);
        g.fillStyle = "rgba(232,196,106," + a.toFixed(3) + ")";
        g.fillRect(tx * TILE - 4, ty * TILE - 6, TILE + 8, TILE + 10);
        g.restore();
      }
    }
  }
  // 燭台の炎
  for (const t of torches) {
    if (t.x < tx0 - 1 || t.x > tx1 + 1 || t.y < ty0 - 1 || t.y > ty1 + 1) continue;
    const f = Math.sin(time * 9 + t.ph), f2 = Math.sin(time * 13.7 + t.ph * 2);
    const bx = t.x * TILE + 6, by = t.y * TILE - 1;
    g.fillStyle = "#ff9a3c"; g.fillRect(bx + (f > 0 ? 0 : 1), by + 2, 4, 5);
    g.fillStyle = "#ffe08a"; g.fillRect(bx + 1, by + 3 + (f2 > 0 ? 0 : 1), 2, 3);
    g.fillStyle = "#fff6d0"; g.fillRect(bx + 1, by + 4, 1, 1);
    g.save(); g.globalCompositeOperation = "lighter";
    const cxp = t.x * TILE + 8, cyp = t.y * TILE + 8, rr = 26 + f * 2;
    const tg = g.createRadialGradient(cxp, cyp, 1, cxp, cyp, rr);
    tg.addColorStop(0, "rgba(255,170,80,0.16)");
    tg.addColorStop(1, "rgba(255,150,60,0)");
    g.fillStyle = tg; g.fillRect(cxp - rr, cyp - rr, rr * 2, rr * 2);
    g.restore();
  }

  // 実体（Yでソート）
  const ents = [];
  for (const c of corpses) ents.push({ y: c.y + 14, kind: "corpse", o: c });
  for (const l of loose) ents.push({ y: l.y, kind: "loose", o: l });
  for (const m of mons) ents.push({ y: m.y, kind: "mon", o: m });
  if (hero) ents.push({ y: hero.y, kind: "hero", o: hero });
  ents.push({ y: P.y, kind: "player", o: P });
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) {
    const tx = Math.floor((e.o.x || 0) / TILE), ty = Math.floor((e.o.y || 0) / TILE);
    if (e.kind === "corpse") {
      const c = e.o, ctx2 = c.tx, cty2 = c.ty;
      if (light[idx(ctx2, cty2)] < 0.04 && !seen[idx(ctx2, cty2)]) continue;
      g.save();
      if (c.looted) g.globalAlpha = 0.65;
      drawSpr(c.fresh ? SPR.corpseFresh : SPR.corpse, c.x, c.y);
      g.restore();
      if (!c.looted) {
        const gl = 0.5 + 0.5 * Math.sin(time * 3 + c.tx);
        g.fillStyle = "rgba(232,196,106," + (0.35 + gl * 0.4).toFixed(2) + ")";
        g.fillRect(c.x + 12 + Math.round(Math.sin(time * 2 + c.ty) * 1), c.y + 4, 1, 1);
      }
    } else if (e.kind === "loose") {
      const l = e.o;
      const bob = Math.sin(time * 4 + l.x) * 1.2;
      drawSpr(SPR.icon[l.it.ico], l.x - 6, l.y - 6 + bob);
    } else if (e.kind === "mon") {
      const m = e.o, t = MTYPE[m.type];
      if (!inb(tx, ty) || light[idx(tx, ty)] < 0.045) continue;
      g.save();
      if (m.dead > 0) { g.globalAlpha = clamp(m.dead / 0.45, 0, 1); g.translate(0, (1 - m.dead / 0.45) * 4); }
      if (t.phase) g.globalAlpha *= 0.78;
      if (m.hurt > 0) g.globalAlpha *= 0.6;
      const bob = t.phase ? Math.sin(time * 2.4 + m.ph) * 2 : 0;
      const fr = Math.floor(m.anim * (t.erratic ? 9 : 4)) % 2;
      drawSpr(SPR[t.spr][fr], m.x - 8, m.y - 10 + bob, m.state === "chase" ? P.x < m.x : false);
      g.restore();
    } else if (e.kind === "hero") {
      const h = e.o;
      if (!inb(tx, ty) || light[idx(tx, ty)] < 0.045) continue;
      g.save();
      if (h.hurt > 0) g.globalAlpha = 0.65;
      const fr = Math.floor(h.anim * 5) % 2;
      drawSpr((h.state === "hostile" ? SPR.heroBad : SPR.hero)[fr], h.x - 8, h.y - 11, h.dir < 0);
      g.restore();
      if (h.atk > 0) { g.fillStyle = "rgba(255,240,200,0.85)"; g.fillRect(h.x + (h.dir > 0 ? 7 : -11), h.y - 6, 5, 2); }
    } else {
      if (P.invul > 0 && Math.floor(time * 18) % 2) continue;
      const spr = P.dir === "n" ? SPR.plN : P.dir === "e" ? SPR.plE : SPR.plS;
      const fr = Math.floor(P.anim) % 2;
      drawSpr(spr[fr], P.x - 8, P.y - 11, P.dir === "e" && P.face < 0);
      // 提灯
      const lx = P.x + (P.dir === "e" ? P.face * 7 : P.dir === "n" ? -6 : 6), ly = P.y - 2;
      g.fillStyle = "#2a2333"; g.fillRect(lx - 2, ly - 3, 5, 6);
      if (P.lamp) {
        g.fillStyle = "#ffd86b"; g.fillRect(lx - 1, ly - 2, 3, 4);
        g.fillStyle = "#fff3c4"; g.fillRect(lx, ly - 1, 1, 2);
      } else { g.fillStyle = "#4a4258"; g.fillRect(lx - 1, ly - 2, 3, 4); }
    }
  }
  // 粒子
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.type === "ring") {
      const r = (1 - a) * 26;
      g.strokeStyle = "rgba(232,196,106," + (a * 0.5).toFixed(2) + ")";
      g.lineWidth = 1; g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.stroke();
    } else {
      g.globalAlpha = a; g.fillStyle = p.col;
      g.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz); g.globalAlpha = 1;
    }
  }
  g.restore();

  // ---- 暗闇 ----
  g.save(); g.translate(ox, oy);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const px = tx * TILE, py = ty * TILE;
    if (!inb(tx, ty)) { g.fillStyle = "#05040a"; g.fillRect(px, py, TILE, TILE); continue; }
    const i = idx(tx, ty);
    const q = Math.round(clamp(light[i], 0, 1) * 7) / 7;
    if (q <= 0) {
      g.fillStyle = seen[i] ? "rgba(6,6,16,0.88)" : "#05040a";
      g.fillRect(px, py, TILE, TILE);
    } else if (q < 1) {
      g.fillStyle = "rgba(5,4,12," + (1 - q * 0.97).toFixed(3) + ")";
      g.fillRect(px, py, TILE, TILE);
    }
  }
  // 暖色
  g.globalCompositeOperation = "lighter";
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (!inb(tx, ty)) continue;
    const w = warm[idx(tx, ty)];
    if (w > 0.06) { g.fillStyle = "rgba(255,140,50," + (w * 0.085).toFixed(3) + ")"; g.fillRect(tx * TILE, ty * TILE, TILE, TILE); }
  }
  // 提灯の光
  if (P.lamp) {
    const rr = lampR() * TILE * 0.72;
    const grd = g.createRadialGradient(P.x, P.y - 2, 2, P.x, P.y - 2, rr);
    grd.addColorStop(0, "rgba(255,205,120,0.26)");
    grd.addColorStop(0.5, "rgba(255,170,80,0.09)");
    grd.addColorStop(1, "rgba(255,150,60,0)");
    g.fillStyle = grd; g.fillRect(P.x - rr, P.y - 2 - rr, rr * 2, rr * 2);
  }
  g.globalCompositeOperation = "source-over";
  g.restore();

  // ---- 上物（灯りに関係なく見せるもの） ----
  g.save(); g.translate(ox, oy);
  for (const m of mons) {
    if (m.dead > 0) continue;
    if (m.alert > 0) mark(m.x, m.y - 21 - (1 - m.alert / 1.2) * 3, "!", "#ff6b6b");
    else if (m.state === "chase") mark(m.x, m.y - 20, "!", "#e0524a");
    else if (m.state === "search") mark(m.x, m.y - 20, "?", "#e8c46a");
  }
  if (hero && hero.hp > 0) {
    const h = hero, w = 20;
    g.fillStyle = "rgba(0,0,0,0.6)"; g.fillRect(h.x - w / 2 - 1, h.y - 22, w + 2, 4);
    g.fillStyle = h.state === "hostile" ? "#e0524a" : "#7fd0ff";
    g.fillRect(h.x - w / 2, h.y - 21, Math.round(w * clamp(h.hp / h.maxHp, 0, 1)), 2);
    wtext(h.state === "hostile" ? (h.avenger ? "復讐者" : "勇者 " + h.name) : "勇者 " + h.name,
      h.x, h.y - 30, h.state === "hostile" ? "#ff9a92" : "#cfe0ff", 9);
  }
  // 回収ゲージ
  const nc = P.looting || nearestCorpse();
  if (nc && !nc.looted) {
    if (P.looting) {
      const w = 26;
      g.fillStyle = "rgba(0,0,0,0.7)"; g.fillRect(nc.x + 8 - w / 2 - 1, nc.y - 9, w + 2, 5);
      g.fillStyle = "#e8c46a"; g.fillRect(nc.x + 8 - w / 2, nc.y - 8, Math.round(w * clamp(P.looting.prog, 0, 1)), 3);
      wtext("回収中…", nc.x + 8, nc.y - 17, "#e8c46a", 9);
    } else {
      const bob = Math.sin(time * 4) * 1;
      wtext(isTouch ? "［回収］" : "Ｚ で回収", nc.x + 8, nc.y - 12 + bob, "#e8c46a", 9);
    }
  }
  // 浮き文字
  for (const f of floaters) {
    const a = clamp(f.life / 1.4, 0, 1);
    fg.globalAlpha = Math.min(1, a * 1.6);
    wtext(f.txt, f.x, f.y - (1 - a) * 12, f.col, 10);
    fg.globalAlpha = 1;
  }
  g.restore();

  // ---- 小地図 ----
  if (S.up.map) drawMinimap();

  if (P.smoke > 0) {
    g.fillStyle = "rgba(150,160,185," + (0.1 * clamp(P.smoke / 7, 0, 1)).toFixed(3) + ")";
    g.fillRect(0, 0, VW, VH);
  }
  const chasers = mons.reduce((n, m) => n + (m.dead <= 0 && m.state === "chase" ? 1 : 0), 0) + (hero && hero.state === "hostile" ? 1 : 0);
  if (chasers > 0) {
    const pulse = (0.13 + 0.09 * Math.sin(time * 7)) * clamp(chasers * 0.6, 0.5, 1);
    const vg = g.createRadialGradient(VW / 2, VH / 2, VH * 0.28, VW / 2, VH / 2, VH * 0.78);
    vg.addColorStop(0, "rgba(180,50,45,0)");
    vg.addColorStop(1, "rgba(180,50,45," + pulse.toFixed(3) + ")");
    g.fillStyle = vg; g.fillRect(0, 0, VW, VH);
  }
  if (flash > 0) { g.fillStyle = "rgba(180,65,58," + (flash * 0.5).toFixed(3) + ")"; g.fillRect(0, 0, VW, VH); }
}

function drawMinimap() {
  const s = 2, mw = MW * s, mh = MH * s;
  const x0 = VW - mw - 6, y0 = 24;
  g.fillStyle = "rgba(6,5,12,0.72)"; g.fillRect(x0 - 2, y0 - 2, mw + 4, mh + 4);
  g.strokeStyle = "rgba(232,196,106,0.28)"; g.lineWidth = 1; g.strokeRect(x0 - 2.5, y0 - 2.5, mw + 5, mh + 5);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const i = idx(x, y);
    if (!seen[i]) continue;
    const t = map[i];
    g.fillStyle = t === T_WALL ? "#2a2536" : t === T_EXIT ? "#e8c46a" : t === T_ENTRY ? "#6f8f5a" : "#4a4360";
    g.fillRect(x0 + x * s, y0 + y * s, s, s);
  }
  for (const c of corpses) if (!c.looted && seen[idx(c.tx, c.ty)]) { g.fillStyle = "#e8c46a"; g.fillRect(x0 + c.tx * s, y0 + c.ty * s, s, s); }
  if (hero) { g.fillStyle = hero.state === "hostile" ? "#e0524a" : "#7fd0ff"; g.fillRect(x0 + Math.floor(hero.x / TILE) * s, y0 + Math.floor(hero.y / TILE) * s, s, s); }
  g.fillStyle = Math.floor(time * 4) % 2 ? "#fff3c4" : "#e8c46a";
  g.fillRect(x0 + Math.floor(P.x / TILE) * s, y0 + Math.floor(P.y / TILE) * s, s, s);
}

/* ---------- 地上（町）の絵 ---------- */
const townStars = [];
for (let i = 0; i < 60; i++) townStars.push({ x: Math.random() * VW, y: Math.random() * 110, r: Math.random(), ph: rnd(0, 9) });
const fireflies = [];
for (let i = 0; i < 14; i++) fireflies.push({ x: rnd(0, VW), y: rnd(90, VH), ph: rnd(0, 9), sp: rnd(0.3, 0.9) });

function drawTown() {
  viewOX = 0; viewOY = 0;
  // 空
  const sky = g.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, "#0b0a1c");
  sky.addColorStop(0.45, "#141530");
  sky.addColorStop(0.72, "#1d1b30");
  sky.addColorStop(1, "#0d0b14");
  g.fillStyle = sky; g.fillRect(0, 0, VW, VH);
  for (const s of townStars) {
    const tw = 0.5 + 0.5 * Math.sin(time * 2 + s.ph);
    g.fillStyle = "rgba(232,230,255," + (0.25 + tw * 0.6).toFixed(2) + ")";
    g.fillRect(s.x | 0, s.y | 0, s.r > 0.85 ? 2 : 1, s.r > 0.85 ? 2 : 1);
  }
  // 月
  g.fillStyle = "#f2e9c8"; g.beginPath(); g.arc(258, 34, 15, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#e6dbb6"; g.beginPath(); g.arc(252, 30, 3, 0, Math.PI * 2); g.arc(263, 40, 2.5, 0, Math.PI * 2); g.fill();
  g.save(); g.globalCompositeOperation = "lighter";
  const mg = g.createRadialGradient(258, 34, 6, 258, 34, 60);
  mg.addColorStop(0, "rgba(240,235,200,0.16)"); mg.addColorStop(1, "rgba(240,235,200,0)");
  g.fillStyle = mg; g.fillRect(198, -26, 120, 120); g.restore();
  // 遠景の丘と墓標
  g.fillStyle = "#141326";
  for (let x = 0; x < VW; x += 4) {
    const h = 128 + Math.sin(x * 0.021) * 10 + Math.sin(x * 0.007 + 2) * 7;
    g.fillRect(x, h, 4, VH - h);
  }
  g.fillStyle = "#191830";
  for (let i = 0; i < 26; i++) {
    const x = (i * 37 % VW), y = 126 + (i * 13 % 8);
    g.fillRect(x, y, 3, 8); g.fillRect(x - 2, y + 2, 7, 2);
  }
  // 地面
  g.fillStyle = "#1c1a26"; g.fillRect(0, 146, VW, VH - 146);
  for (let i = 0; i < 150; i++) {
    const h = hash(i, 3);
    g.fillStyle = h < 0.5 ? "#232030" : "#191723";
    g.fillRect((h * VW) | 0, 148 + ((hash(i, 9) * (VH - 150)) | 0), 3, 2);
  }
  g.fillStyle = "#26303a";
  for (let i = 0; i < 40; i++) { const h = hash(i, 21); g.fillRect((h * VW) | 0, 150 + ((hash(i, 5) * 50) | 0), 2, 3); }

  // 小道
  g.fillStyle = "#241f28";
  for (let x = 0; x < VW; x += 2) {
    const w = 5 + Math.sin(x * 0.05) * 2;
    g.fillRect(x, 168 + Math.sin(x * 0.03) * 2, 2, w);
  }
  g.fillStyle = "#2b2530";
  for (let i = 0; i < 60; i++) { const h = hash(i, 41); g.fillRect((h * VW) | 0, 166 + ((hash(i, 17) * 12) | 0), 2, 1); }
  // 柵
  g.fillStyle = "#221b20";
  for (let x = 4; x < VW; x += 14) { g.fillRect(x, 140, 2, 12); }
  g.fillRect(0, 143, VW, 1); g.fillRect(0, 148, VW, 1);
  // 草
  for (let i = 0; i < 46; i++) {
    const h = hash(i, 61), x = (h * VW) | 0, y = 152 + ((hash(i, 7) * (VH - 158)) | 0);
    g.fillStyle = hash(i, 3) < 0.5 ? "#2f4030" : "#38492f";
    g.fillRect(x, y, 1, 3); g.fillRect(x + 1, y + 1, 1, 2); g.fillRect(x - 1, y + 1, 1, 2);
  }
  // 墓場の入口（右）
  g.fillStyle = "#0a0910"; g.beginPath(); g.ellipse(232, 176, 34, 15, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#151320"; g.beginPath(); g.ellipse(232, 174, 34, 15, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#08070d"; g.beginPath(); g.ellipse(232, 176, 27, 11, 0, 0, Math.PI * 2); g.fill();
  drawSpr(SPR.ladder, 224, 168);
  drawSpr(SPR.grave, 268, 152); drawSpr(SPR.grave, 288, 160); drawSpr(SPR.grave, 200, 158);
  wtext("墓場への入口", 232, 198, "#93876f", 10);

  // 店（左）
  g.fillStyle = "#241a1c"; g.fillRect(28, 108, 92, 62);
  g.fillStyle = "#2e2226"; g.fillRect(28, 108, 92, 6);
  g.fillStyle = "#1a1216";
  for (let y = 114; y < 170; y += 6) g.fillRect(28, y, 92, 1);
  // 屋根
  g.fillStyle = "#3a2226";
  for (let i = 0; i < 26; i++) g.fillRect(20 + i * 4, 96 + Math.abs(i - 12) * 1.1, 4, 14);
  g.fillStyle = "#4a2c30"; g.fillRect(20, 104, 104, 4);
  // 窓（灯り）
  const lampF = 0.86 + 0.14 * Math.sin(time * 3.4) * Math.sin(time * 7.1);
  g.fillStyle = "#120d10"; g.fillRect(44, 122, 60, 34);
  g.fillStyle = "rgba(255,196,110," + (0.85 * lampF).toFixed(2) + ")"; g.fillRect(46, 124, 56, 30);
  g.fillStyle = "#2a1c18"; g.fillRect(72, 122, 2, 34); g.fillRect(44, 138, 60, 2);
  drawSpr(SPR.keeper, 80, 126);
  g.save(); g.globalCompositeOperation = "lighter";
  const wg = g.createRadialGradient(74, 140, 8, 74, 140, 84);
  wg.addColorStop(0, "rgba(255,180,90," + (0.20 * lampF).toFixed(3) + ")"); wg.addColorStop(1, "rgba(255,180,90,0)");
  g.fillStyle = wg; g.fillRect(-10, 56, 168, 168); g.restore();
  // 樽と木箱
  g.fillStyle = "#3a2a1c"; g.fillRect(14, 148, 12, 16);
  g.fillStyle = "#4a3625"; g.fillRect(15, 149, 10, 14);
  g.fillStyle = "#2a1d13"; g.fillRect(14, 152, 12, 2); g.fillRect(14, 158, 12, 2);
  g.fillStyle = "#3c2c1e"; g.fillRect(112, 154, 14, 12);
  g.fillStyle = "#4d3a27"; g.fillRect(113, 155, 12, 10);
  g.fillStyle = "#2c2015"; g.fillRect(113, 159, 12, 1); g.fillRect(118, 155, 1, 10);
  // 煙突と煙
  g.fillStyle = "#2e2226"; g.fillRect(96, 88, 10, 14);
  g.fillStyle = "#3a2b30"; g.fillRect(96, 88, 10, 3);
  for (let i = 0; i < 5; i++) {
    const t = (time * 0.5 + i * 0.2) % 1;
    const yy = 86 - t * 40, xx = 101 + Math.sin(t * 5 + i) * 7;
    g.fillStyle = "rgba(150,140,150," + (0.22 * (1 - t)).toFixed(3) + ")";
    const sz = 2 + t * 5;
    g.fillRect(xx - sz / 2, yy, sz, sz);
  }
  // 看板
  g.fillStyle = "#2a1e18"; g.fillRect(122, 118, 8, 3); g.fillRect(126, 118, 3, 26);
  g.fillStyle = "#3a2b20"; g.fillRect(112, 126, 34, 16);
  g.fillStyle = "#1d150f"; g.strokeStyle = "#5b4326"; g.lineWidth = 1; g.strokeRect(112.5, 126.5, 33, 15);
  wtext("買取", 129, 134, "#e8c46a", 11);

  // 主人公
  const bob = Math.sin(time * 2) * 1;
  drawSpr(SPR.plS[0], 150, 158 + bob);
  g.fillStyle = "#ffd86b"; g.fillRect(160, 166 + bob, 3, 4);
  g.save(); g.globalCompositeOperation = "lighter";
  const pg = g.createRadialGradient(161, 168, 3, 161, 168, 34);
  pg.addColorStop(0, "rgba(255,200,110,0.18)"); pg.addColorStop(1, "rgba(255,200,110,0)");
  g.fillStyle = pg; g.fillRect(127, 134, 68, 68); g.restore();

  // 蛍
  for (const f of fireflies) {
    f.x += Math.sin(time * f.sp + f.ph) * 0.3;
    f.y += Math.cos(time * f.sp * 0.8 + f.ph) * 0.2;
    const a = 0.35 + 0.45 * Math.sin(time * 3 + f.ph);
    if (a > 0.2) { g.fillStyle = "rgba(190,255,150," + a.toFixed(2) + ")"; g.fillRect(f.x | 0, f.y | 0, 1, 1); }
  }
  // 霧
  g.save(); g.globalAlpha = 0.16;
  for (let i = 0; i < 4; i++) {
    const y = 150 + i * 12, off = (time * (6 + i * 3)) % (VW + 80) - 40;
    g.fillStyle = "#5a6a80";
    g.fillRect(off - 60, y, 120, 3); g.fillRect(off + 90, y + 2, 80, 2);
  }
  g.restore();
}

/* ============================================================
   画面（メニュー・店・会話）
   ============================================================ */
let isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
const actions = {};
function openUI(kind, html) {
  uiOpen = true; uiKind = kind;
  UI.innerHTML = html; UI.classList.add("on");
  UI.querySelectorAll("[data-a]").forEach(el => {
    el.addEventListener("click", ev => {
      ev.preventDefault();
      if (el.classList.contains("dis")) { SFX.deny(); return; }
      SFX.ui();
      const f = actions[el.dataset.a];
      if (f) f(el.dataset, el);
    });
  });
  UI.scrollTop = 0;
}
function closeUI() { uiOpen = false; uiKind = ""; UI.classList.remove("on"); UI.innerHTML = ""; }

const rarName = r => ["", "銘品", "名工", "伝説"][r] || "";
function itemRow(it, right, extra) {
  return '<div class="row rar' + it.rar + '">' +
    '<div class="ico" style="background-image:url(' + iconURL[it.ico] + ')"></div>' +
    '<div class="nm">' + it.nm + '<small>' + (rarName(it.rar) ? rarName(it.rar) + " ・ " : "") + "評価 " + it.val + " 金</small></div>" +
    '<div class="pr">' + right + "</div>" + (extra || "") + "</div>";
}
const sellPrice = it => Math.max(1, Math.round(it.val * priceMul()));

/* ---------- タイトル ---------- */
function showTitle() {
  scene = "title";
  const cont = S.stats.runs > 0;
  openUI("title",
    '<div class="panel center">' +
    '<div style="font-size:11px;letter-spacing:.4em;color:var(--dim);margin-bottom:6px">GRAVE OF HEROES</div>' +

    '<div class="sub" style="margin-top:10px">勇者は死んだ。装備は、まだそこにある。<br>あなたは戦わない。拾って、逃げて、売る。それだけの仕事だ。</div>' +
    '<div class="btns" style="margin-top:6px">' +

}
actions.start = () => { doFade(1, () => { showTown(); }); };
actions.wipe = () => {
  openUI("wipe", '<div class="panel"><h2>記録を消す</h2><p class="q">所持金・強化・手記、すべて失われます。よろしいですか。</p>' +
    '<div class="btns" style="margin-top:14px"><div class="btn warn" data-a="wipe2">消す</div><div class="btn" data-a="back">やめる</div></div></div>');
};
actions.wipe2 = () => { S = JSON.parse(JSON.stringify(DEFAULT_SAVE)); save(); showTitle(); };
actions.back = () => {
  if (scene === "title") showTitle();
  else if (scene === "dungeon" && run && !run.escaped) closeUI();
  else showTown();
};

  openUI("help", '<div class="panel"><h2>あそびかた</h2>' +

/* タッチ */
const stick = $("stick"), knob = $("knob");
let stickId = null, stickC = { x: 0, y: 0 };
function stickStart(e) {
  const t = e.changedTouches ? e.changedTouches[0] : e;
  stickId = t.identifier !== undefined ? t.identifier : "m";
  const r = stick.getBoundingClientRect();
  stickC = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  stickMove(e);
}
function stickMove(e) {
  const list = e.changedTouches ? Array.from(e.changedTouches) : [e];
  for (const t of list) {
    const id = t.identifier !== undefined ? t.identifier : "m";
    if (id !== stickId) continue;
    let dx = t.clientX - stickC.x, dy = t.clientY - stickC.y;
    const m = Math.hypot(dx, dy) || 1, r = 46;
    const cl = Math.min(m, r);
    knob.style.transform = "translate(" + (dx / m * cl) + "px," + (dy / m * cl) + "px)";
    const n = Math.min(1, m / 34);
    touchVec = { x: dx / m * n, y: dy / m * n };
  }
  e.preventDefault();
}
function stickEnd() { stickId = null; touchVec = { x: 0, y: 0 }; knob.style.transform = ""; }
stick.addEventListener("touchstart", stickStart, { passive: false });
stick.addEventListener("touchmove", stickMove, { passive: false });
stick.addEventListener("touchend", stickEnd);
stick.addEventListener("touchcancel", stickEnd);
function bindBtn(el, down, up) {
  el.addEventListener("touchstart", e => { e.preventDefault(); actx(); down(); }, { passive: false });
  el.addEventListener("touchend", e => { e.preventDefault(); if (up) up(); }, { passive: false });
  el.addEventListener("mousedown", e => { e.preventDefault(); actx(); down(); });
  el.addEventListener("mouseup", e => { e.preventDefault(); if (up) up(); });
}
bindBtn($("bA"), () => { touchA = true; }, () => { touchA = false; });
bindBtn($("bB"), () => { if (scene === "dungeon" && !uiOpen) { P.lamp = !P.lamp; SFX.ui(); hudSig = ""; } });

function showItems() {

    '<div class="row"><div class="ico" style="background-image:url(' + iconURL.potion + ')"></div><div class="nm">薬<small>体力を1つ回復</small></div>' +
    '<div class="pr">' + S.inv.potion + '<span class="btn sm' + (S.inv.potion > 0 ? "" : " dis") + '" data-a="uPot" style="margin-left:8px">使う</span></div></div>' +
    '<div class="row"><div class="ico" style="background-image:url(' + iconURL.smoke + ')"></div><div class="nm">煙玉<small>追跡を振り切る</small></div>' +
    '<div class="pr">' + S.inv.smoke + '<span class="btn sm' + (S.inv.smoke > 0 ? "" : " dis") + '" data-a="uSmk" style="margin-left:8px">使う</span></div></div>' +
    '<div class="row"><div class="ico" style="background-image:url(' + iconURL.rope + ')"></div><div class="nm">縄梯子<small>その場から帰る</small></div>' +
    '<div class="pr">' + S.inv.rope + '<span class="btn sm' + (S.inv.rope > 0 ? "" : " dis") + '" data-a="uRope" style="margin-left:8px">使う</span></div></div>' +
    "</div>" +
    '<div class="btns"><div class="btn pri" data-a="resume">とじる</div><div class="btn" data-a="pause2">中断</div></div></div>');
}
actions.uPot = () => { closeUI(); usePotion(); };
actions.uSmk = () => { closeUI(); useSmoke(); };
actions.uRope = () => { closeUI(); useRope(); };
actions.pause2 = () => showPause();

/* ============================================================
   画面サイズ / メインループ
   ============================================================ */
const stage = $("stage");
function resize() {
  const w = innerWidth, h = innerHeight;
  const portrait = isTouch && h > w * 1.05;
  document.body.classList.toggle("portrait", portrait);
  const availH = portrait ? h * 0.62 : h;
  let sc = Math.min(w / VW, availH / VH);
  sc = sc >= 2 ? Math.floor(sc) : Math.max(0.5, sc);
  const cw = Math.round(VW * sc), ch = Math.round(VH * sc);
  SCALE = sc; DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.style.width = cw + "px"; cv.style.height = ch + "px";
  fx.width = Math.round(cw * DPR); fx.height = Math.round(ch * DPR);
  fx.style.width = cw + "px"; fx.style.height = ch + "px";
  stage.style.width = cw + "px"; stage.style.height = ch + "px";
  PAD.classList.toggle("on", isTouch && scene === "dungeon");
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 200));

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.05);
  time += dt;
  fg.setTransform(1, 0, 0, 1, 0, 0);
  fg.clearRect(0, 0, fx.width, fx.height);
  shake = Math.max(0, shake - dt * 26);
  flash = Math.max(0, flash - dt * 2.2);

  if (scene === "dungeon" && run) {
    if (!uiOpen && !run.escaped) {
      run.t += dt;
      updatePlayer(dt);
      updateMons(dt);
      updateHero(dt);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].life -= dt; if (floaters[i].life <= 0) floaters.splice(i, 1); }
    drawDungeon(dt);
  } else {
    drawTown();
    if (scene === "title") { g.fillStyle = "rgba(4,3,8,0.45)"; g.fillRect(0, 0, VW, VH); }
  }
  updateHUD();
  PAD.classList.toggle("on", isTouch && scene === "dungeon" && !uiOpen);

  // フェード
  if (fadeDir > 0) {
    fade = Math.min(1, fade + dt * 3.2);
    if (fade >= 1) { fadeDir = -1; if (fadeCb) { const c = fadeCb; fadeCb = null; c(); } }
  } else if (fadeDir < 0) {
    fade = Math.max(0, fade - dt * 2.4);
    if (fade <= 0) fadeDir = 0;
  }
  if (fade > 0) { g.fillStyle = "rgba(3,2,6," + fade.toFixed(3) + ")"; g.fillRect(0, 0, VW, VH); }

  requestAnimationFrame(frame);
}

/* ---------- 起動 ---------- */
resize();
showTitle();
requestAnimationFrame(frame);
addEventListener("pointerdown", () => actx(), { once: true });

})();
</script>
</body>
</html>
