 }else{const o=source.clone();o.children=[];o.material=source.material.clone();o.matrixAutoUpdate=false;o.matrix.copy(source.matrixWorld);const box=new THREE.Box3().setFromBufferAttribute(o.geometry.attributes.position).applyMatrix4(o.matrix);scene.add(o);bins[classify(box,source)].push(o);}}
